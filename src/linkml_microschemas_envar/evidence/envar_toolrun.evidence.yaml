# Evidence for the slots of envar_toolrun.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

tool_name:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: DeGAUSS Details
      snippet: The Daymet DeGAUSS tool was created by
      match: partial
      explanation: >-
        Each tool has a name (daymet, geocoder), used in its image and appended to the output
        file name. Missing: no field in the output names the tool.
      status: verified
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No gaia table records a tool-name field; the gaia-db image name is not carried on
        any native output.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No native Amadeus output file records the tool name.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's table_dictionary carries dataset/resource metadata, not a per-run producing-tool
        name.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Tool-run provenance is instance-layer; CODATA EVs/CDIF operate at the conceptual/represented
        layer and are excluded from scoring.
  - source: chel
    reason: not_recorded
    explanation: >-
      No software is named for the pipeline. Closest: §5.5 says a release should document its
      Foundry dataset references.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Foundry dataset references (RID)
      status: verified
    status: unverified

tool_version:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-readme
      locator: Using
      snippet: >-
        docker run --rm -v $PWD:/tmp ghcr.io/degauss-org/geocoder:3.4.2 my_address_file.csv
      match: partial
      explanation: >-
        The version is the tag of the image, and the geocoder also writes it into the output
        file name (`..._geocoder_3.4.2_...csv`). Missing: the daymet container does not put its
        version into the output name, and no field in the output has it.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary.version (resource version 001/002...) via §2.6
      note: >-
        C-HER carries a resource version code, but it versions the dataset resource, not a
        per-run producing tool.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No gaia table records the gaia-db image version.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus's R package version lives in the object attributes but no native file records
        it.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Per-run tool version is instance-layer; out of scope for CODATA EV/CDIF conceptual
        layer.
  - source: chel
    reason: different_concept
    explanation: >-
      CHEL versions its data releases (2022, 2024), not the software that builds them.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: "Two primary releases are currently defined:"
      status: verified
    status: unverified

