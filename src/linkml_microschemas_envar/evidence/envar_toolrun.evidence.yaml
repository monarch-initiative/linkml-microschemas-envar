# Evidence for the slots of envar_toolrun.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

tool_name:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: §2.1
      snippet: Links to the code used to ingest, transform, and create data are stored in the database.
      match: partial
      explanation: 'The code that made a resource is linked. Missing: a link to code, not a tool name.'
      status: verified
  - source: amadeus
    support:
    - type: schema
      document: amadeus-description
      locator: DESCRIPTION
      source_slot: DESCRIPTION.Package
      match: partial
      explanation: 'The package is amadeus, and the function names say which step ran. Missing: not
        written to the result.'
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-dht-metadata-spec
      locator: Metadata Elements
      source_slot: degauss_name
      match: full
      explanation: >-
        The DeGAUSS metadata specification defines `degauss_name`, the name of the container. It
        is set in the Dockerfile and stored in the image as an environment variable and as the
        label `org.degauss.name`.
      status: verified
    - type: output
      document: degauss-daymet-dockerfile
      field: degauss_name
      value: daymet
      match: full
      explanation: >-
        The daymet image has the name `daymet`. The container appends it to the output file name
        (`..._daymet.csv`); no column of the output has it.
      status: verified
  - source: omop_gaia
    support:
    - type: output
      document: gaiadb-example-jsonld
      field: featureList
      value: wget
      match: partial
      explanation: >-
        The ETL metadata of a dataset names the software of each ETL step (`instrument`, with
        `featureList` and a repository URL). Missing: the gaiaDB functions that load and join
        the data are not recorded with the output.
      status: verified
    - type: output
      document: gaiacatalog-example-etl
      field: download
      value: wget
      match: partial
      explanation: "The ETL file names the download tool. Missing: no version."
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Tool-run provenance is instance-layer; CODATA EVs/CDIF operate at the conceptual/represented
        layer and are excluded from scoring.
  - source: chel
    reason: not_recorded
    explanation: >-
      No software is named for the pipeline. Closest: §5.5 says a release should document its
      Foundry dataset references.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Foundry dataset references (RID)
      status: verified
    status: unverified

tool_version:
  supported_by:
  - source: amadeus
    support:
    - type: schema
      document: amadeus-description
      locator: DESCRIPTION
      source_slot: DESCRIPTION.Version
      match: partial
      explanation: 'The package version is 2.1.2 (DESCRIPTION). Missing: not written to the result.'
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-dht-metadata-spec
      locator: Metadata Elements
      source_slot: degauss_version
      match: full
      explanation: >-
        The specification defines `degauss_version`, the version of the container, which is also
        the GitHub release and the image tag. It is stored in the image as an environment
        variable and as the label `org.degauss.version`.
      status: verified
    - type: output
      document: degauss-daymet-dockerfile
      field: degauss_version
      value: "1.0.0"
      match: full
      explanation: The daymet image has the version 1.0.0.
      status: verified
    - type: documentation
      document: degauss-dht-helper-functions
      locator: Write geomarker output file
      snippet: writes the output csv with container name and version appended to filename
      match: partial
      explanation: >-
        The helper library writes name and version into the output file name (the geocoder:
        `..._geocoder_3.4.2_...csv`). Missing: a container can write its file itself; daymet
        1.0.0 appends only `_daymet`, without the version.
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'No version of the producing code is recorded; the version code versions the resource.
      Closest: the link to the code.'
    closest:
    - type: documentation
      document: cher-arxiv-paper
      locator: §2.1
      snippet: Links to the code used to ingest, transform, and create data are stored in the database.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No version of the ETL software or of gaiaDB is recorded. Closest: the repository URL of
      the ETL tool in the JSON-LD.
    closest:
    - type: output
      document: gaiadb-example-jsonld
      field: downloadUrl
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Per-run tool version is instance-layer; out of scope for CODATA EV/CDIF conceptual
        layer.
  - source: chel
    reason: different_concept
    explanation: >-
      CHEL versions its data releases (2022, 2024), not the software that builds them.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: "Two primary releases are currently defined:"
      status: verified
    status: unverified

