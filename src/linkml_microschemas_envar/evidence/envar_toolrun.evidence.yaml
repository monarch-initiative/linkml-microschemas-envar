run_timestamp_utc:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db data_source.created_at/updated_at and location.created_at (load time, not
        run timestamp)
      note: >-
        Gaia records per-row load times, which approximate but are not the tool-run start
        timestamp.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_response_headers.json HTTP Date header
      note: >-
        The HTTP Date header is the only timestamp captured, recoverable but not a first-class
        run-timestamp field.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_dictionary.metadata_created_at/metadata_updated_at (metadata time, not producing-run
        time)
      note: >-
        C-HER stamps metadata create/update times, which are registration times, not the producing
        tool-run timestamp.
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: CHEL Documentation.md (no per-run timestamp)
      note: CHEL carries no per-run timestamp on emitted records.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Only OS file mtime is available; no run timestamp is emitted.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Run timestamp is instance-layer; out of scope for CODATA.

