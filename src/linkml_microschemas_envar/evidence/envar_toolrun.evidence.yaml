provenance_chain_steps:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.1"
      snippet: >-
        This pathway ensures that the origin, transformation logic, and aggregation assumptions
        of each variable are explicit and reproducible.
      match: partial
      explanation: >-
        §2.1 gives the ordered processing stages of every input. Missing: the stages are not
        runs; no tool, version, date or output per step.
      status: verified
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_catalog/meta_etl_*.json (ETL recipe) + gaia_db/spatial_join_log.txt (SQL NOTICE
        lines)
      note: >-
        Gaia's ETL descriptor plus the spatial-join log capture upstream steps, but not as
        an ordered per-run W3C-PROV chain. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage table (parent-child links) + lineage_notes
      note: >-
        C-HER's dataset_lineage links parent and child resources but is a dataset-lineage
        graph, not an ordered per-run W3C-PROV tool chain.
  not_supported_by:
  - source: degauss
    reason: implicit
    explanation: >-
      As for `provenance_chain`: the steps can be read from the output file name, to which each
      container appends its name. There is no record per step.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No native Amadeus file records an ordered upstream-run chain.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Ordered tool-run provenance is instance-layer; out of scope for CODATA.

provenance_chain_terminus_type:
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Gaia's meta_etl points at raw source downloads but has no typed chain-terminus field.
  - source: degauss
    reason: implicit
    explanation: >-
      The daymet container downloads the source data itself, so the chain ends at a download
      from the provider. The kind of root is not stated as such.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Data
      snippet: as NetCDF file(s) using the
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no typed provenance-chain terminus.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER's lineage graph has no typed terminus field on the chain.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Chain-terminus typing is instance-layer; out of scope for CODATA.
  - source: chel
    reason: implicit
    explanation: >-
      The input lineage table starts from public datasets with their download links, so the
      chain ends at downloaded sources. The kind of root is not stated as such.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7"
      snippet: >-
        These datasets form the full upstream dependency graph for aggregation and spatial
        linkage.
      status: verified
    status: unverified

input_files:
  supported_by:
  - source: codata
    support:
    - type: schema
      document: ddi-cdi-activity
      locator: Activity, attributes
      source_slot: Activity.entityUsed
      match: full
      explanation: >-
        "A thing employed in the activity", multiplicity 0..*. Each entry is a Reference,
        so an activity lists every input it used.
      status: verified
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.4.1, p. 13"
      snippet: A resource may have one parent resource or multiple parent resources.
      match: partial
      explanation: >-
        C-HER records for every derived resource the resources it was made from, one or
        several. Missing: the parents are resources of the repository and not the files
        one run read, and the entry has no hash or row count.
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.7"
      snippet: >-
        These datasets form the full upstream dependency graph for aggregation and
        spatial linkage.
      match: partial
      explanation: >-
        The Input Lineage Table lists every input of the pipeline. Missing: it is one
        table in the documentation and not a record of what a given run read, and it has
        no hashes.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-readme
      locator: Geomarker Data
      snippet: is a SQL database prepared following the instructions
      match: partial
      explanation: >-
        Besides the address file the geocoder reads a reference database
        (`geocoder.db`). Missing: the second input is only named in the README; the
        output does not list what was read.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: different_granularity
    explanation: >-
      gaiaDB records one source URL per catalogued dataset and not the files a run read.
      Closest: `data_source.url`.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.url
      status: verified
    status: unverified
  - source: amadeus
    reason: not_recorded
    explanation: >-
      The result does not list the files that were read. Closest: the `path` argument of
      `process_covariates`, which may be a directory with several raw files.
    closest:
    - type: schema
      document: amadeus-process-covariates
      locator: arguments
      source_slot: process_covariates.path
      status: verified
    status: unverified

input_file_locator:
  supported_by:
  - source: codata
    support:
    - type: schema
      document: ddi-cdi-reference
      locator: Reference, attributes
      source_slot: Reference.location
      match: full
      explanation: >-
        "The location of the referenced resource, as appropriate to support retrieval."
        Reference is the type of `Activity.entityUsed`; it also has a `uri` attribute.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.url
      match: partial
      explanation: >-
        URL of the catalogued source dataset. Missing: it is stored once per dataset and
        not per run.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: url
      value: https://www.atsdr.cdc.gov/place-health/php/svi/svi-data-documentation-download.html
      match: partial
      explanation: >-
        In the public example the URL is the download page of the source and not the file
