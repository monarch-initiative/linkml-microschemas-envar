      status: asserted
      where: no column
      note: Amadeus is an R package, not a container; no image repository applies.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER records no producing-tool container image repository.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Container provenance is instance-layer; out of scope for CODATA.

