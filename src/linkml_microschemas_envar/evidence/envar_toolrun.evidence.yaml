provenance_chain_steps:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §2.1 (Source to Module Assignment pathway)
      note: >-
        CHEL documents a lineage pathway (Source to Cleaning to Harmonization to Hex Aggregation
        to Normalization to Module Assignment), but not as an ordered per-run W3C-PROV chain.
        Conservative: partial.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_catalog/meta_etl_*.json (ETL recipe) + gaia_db/spatial_join_log.txt (SQL NOTICE
        lines)
      note: >-
        Gaia's ETL descriptor plus the spatial-join log capture upstream steps, but not as
        an ordered per-run W3C-PROV chain. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage table (parent-child links) + lineage_notes
      note: >-
        C-HER's dataset_lineage links parent and child resources but is a dataset-lineage
        graph, not an ordered per-run W3C-PROV tool chain.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no ordered upstream-run chain on its native outputs.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No native Amadeus file records an ordered upstream-run chain.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Ordered tool-run provenance is instance-layer; out of scope for CODATA.

