# Evidence for the slots of envar_toolrun.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

tool_name:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §5.5 (Foundry RID + CHEL release version)
      note: >-
        CHEL identifies its pipeline via Foundry RID + CHEL release, but not as a discrete
        tool-name field.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: >-
        output filename stem (e.g. ...daymet_1.0.0.csv / ...geocoder_3.3.0...csv)
      note: >-
        Tool name is embedded in the output CSV filename, recoverable but not a first-class
        field.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No gaia table records a tool-name field; the gaia-db image name is not carried on
        any native output.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No native Amadeus output file records the tool name.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's table_dictionary carries dataset/resource metadata, not a per-run producing-tool
        name.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Tool-run provenance is instance-layer; CODATA EVs/CDIF operate at the conceptual/represented
        layer and are excluded from scoring.

tool_version:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md Part 5 / §5.5 (CHEL release version)
      note: >-
        CHEL release version (2022 / 2024) is documented, but not as a per-tool semver in
        a run record. Conservative: partial.
  - source: degauss
    legacy:
      extent: full
      status: verified
      where: >-
        output filename container image tag (e.g. daymet_1.0.0) and ghcr.io/degauss-org/...
        reference
      evidence: >-
        COMPARISON.md §K — tool version ✅ carried as the container image tag in the filename
      note: >-
        Container image tag baked into the filename pins the exact tool version.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary.version (resource version 001/002...) via §2.6
      note: >-
        C-HER carries a resource version code, but it versions the dataset resource, not a
        per-run producing tool.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No gaia table records the gaia-db image version.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus's R package version lives in the object attributes but no native file records
        it.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Per-run tool version is instance-layer; out of scope for CODATA EV/CDIF conceptual
        layer.

container_image_repository:
  supported_by:
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: ghcr.io/degauss-org/... reference implicit in the container invocation
      note: >-
        The repository is implied by the DeGAUSS container reference but not written to any
        native output column.
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: CHEL Documentation.md §5.5 (Foundry datasets; no container repo)
      note: >-
        CHEL is built as Foundry datasets (§5.5 RIDs), not a container image, so it carries
        no container image repository.
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No gaia table records a container image repository.
  - source: amadeus
