run_arguments:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-readme
      locator: Optional Argument
      snippet: >-
        This threshold can be changed by including an optional argument in the docker call
      match: partial
      explanation: >-
        The geocoder writes the value of its one argument into the output file name
        (`..._score_threshold_0.5.csv`). Missing: the daymet container documents its arguments
        but does not record the values used.
      status: verified
    - type: schema
      document: degauss-dht-metadata-spec
      locator: Metadata Elements
      source_slot: degauss_argument
      match: partial
      explanation: >-
        The specification has one element for the argument of a container: its name and default
        value. Missing: the default and not the value used in a run, and one argument only. The
        daymet container has several arguments and leaves the element at the template text.
      status: verified
    - type: documentation
      document: degauss-dht-write-geomarker-file
      snippet: for example, a selected buffer radius, care site, or geocoding threshold
      match: partial
      explanation: >-
        The helper library appends the value of the argument to the output file name. Missing:
        only when the container passes it on; daymet does not.
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-spatial-join
      locator: spatial_join_from_catalog
      snippet: exposure_relationship_source_value (verbatim operator)
      match: partial
      explanation: >-
        The join writes its operator or method verbatim to each exposure row, and the exposure
        type concept it was given. Missing: the buffer distance and the nodata value are not
        written, and there is no record of all arguments of a run.
      status: verified
    - type: output
      document: gaiacatalog-example-etl
      field: local_epsg
      value: "EPSG:3857"
      match: partial
      explanation: >-
        The settings of a dataset's ETL are in its ETL file: download tool, source file and
        format, EPSG codes, nodata value, derived formats. Missing: they are the settings of the
        ETL, not the arguments of a join run.
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'No arguments of a run are recorded. Closest: the link to the code.'
    closest:
    - type: documentation
      document: cher-arxiv-paper
      locator: §2.1
      snippet: Links to the code used to ingest, transform, and create data are stored in the database.
      status: verified
    status: unverified
  - source: amadeus
    reason: not_recorded
    explanation: 'The arguments are those of the R call and are not stored with the result. Closest:
      the radius in the column name.'
    closest:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: Description
      snippet: column name reflects the gridMET variable and circular buffer radius.
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      The parameters of a pipeline run are not published. Closest: §5.5 lists the projection
      specifications and the privacy threshold as things a release should document.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Privacy threshold specification
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Run arguments are instance-layer; out of scope for CODATA.

run_timestamp_utc:
  supported_by:
  - source: cher
