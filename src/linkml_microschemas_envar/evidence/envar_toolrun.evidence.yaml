      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.created_at
      match: partial
      explanation: >-
        Each exposure row has the time it was written. Missing: per row, in the server's time
        without a zone, and not the start of the run.
      status: verified
    - type: output
      document: gaiacatalog-example-etl
      field: last_updated
      value: "2025-05-23T08:47:15Z"
      match: partial
      explanation: >-
        The ETL file of a catalogue entry records when the dataset was last loaded, in UTC.
        Missing: it is the time of the ETL, not of the join.
      status: verified
  - source: chel
    support:
    - type: output
      document: chel-hex3-grid
      locator: gpkg_contents
      field: last_change
      match: partial
      explanation: >-
        The grid file records when its layer was last written: 2025-11-24T19:48:49Z (read with
        sqlite3). Missing: it is the write time of the grid file and not the start of a pipeline
        run, and the indicator tables have no date.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No time of the run is recorded. The old entry cited the HTTP Date header of the gridMET
      data server, which is not written by amadeus. Closest: nothing.'
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No run time is written anywhere. Nothing close was found in the READMEs, the code or the
      example outputs.
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Run timestamp is instance-layer; out of scope for CODATA.

