address_period_alignment:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: §1
      snippet: This can be accomplished by linking exposure measures with longitudinal residential history
        data
      match: partial
      explanation: 'Exposures are linked to residential histories (addresses from 1995 to 2024). Missing:
        how an address period is aligned with the exposure dates is not described; the paper points
        to prior work.'
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: start_date
      match: partial
      explanation: >-
        The input has one row per location with `start_date` and `end_date`, so a person's
        locations over time are given as dated rows. Missing: nothing says how the periods were
        made (one fixed address, an address history).
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-readme
      locator: Time windows
      snippet: and the exposure dates are clipped to the overlap
      match: full
      explanation: >-
        A person's locations over time are rows of `location_history` with a start and an end
        date. A location is matched when its period overlaps the window of a value, and the
        exposure dates are cut to the overlap.
      status: verified
    - type: schema
      document: gaiadb-init-schema
      locator: working.location_history
      source_slot: location_history.start_date
      match: full
      explanation: The table of person, location and period that the join reads.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'A location has no time period; every location gets the values of all dates in `from`.
      Closest: "Unique locations." in the `locs` argument.'
    closest:
    - type: documentation
      document: amadeus-calculate-covariates
      locator: arguments
      snippet: Unique locations. Should include
      status: verified
    status: unverified
  - source: chel
    reason: implicit
    explanation: >-
      The README example uses one point per participant and picks the release by the year of
      `start_date`. That the location is taken as fixed over time is not stated.
    closest:
    - type: documentation
      document: chel-readme
      locator: Result
      snippet: Each participant will be assigned attributes from the correct CHEL dataset
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How patient location-over-time is modelled is an instance-layer linkage concern, outside
        CODATA's conceptual scope.

