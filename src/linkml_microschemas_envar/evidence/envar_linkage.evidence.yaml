# Evidence for the slots of envar_linkage.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

linkage_strategy:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.5.2"
      snippet: All points receive deterministic hex assignments.
      match: full
      explanation: >-
        Participant points are assigned to the Hex3 cell they fall in. The README example shows
        the same as a spatial join of points to hexes.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_relationship_source_value
      match: full
      explanation: >-
        Every exposure row says how it was joined: the operator or method verbatim in
        `exposure_relationship_source_value`, and as a concept in
        `exposure_relationship_concept_id`.
      status: verified
    - type: documentation
      document: gaiadb-spatial-join
      snippet: Map the spatial operator (and buffer) used for a join to an OMOP GIS
      match: full
      explanation: >-
        The join code maps the operator and the buffer to an OMOP GIS geometry relationship
        concept.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary column tagged Spatial – Primary + reference to boundaries
        schema
      note: >-
        C-HER's Spatial tags and boundaries-schema references encode a spatial join relationship,
        though not EnVar's linkage-strategy enum. Conservative: partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Using
      snippet: linked by date and coordinate
      match: full
      explanation: >-
        Values are attached to the coordinate of each row, for each date of the row's date
        range.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no linkage-strategy slot; the value is extracted at request coordinates
        with no recorded strategy.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The gridded-to-patient linkage strategy is an instance-layer derivation choice, outside
        CODATA's conceptual variable layer.

geocoding_precision_propagated:
  supported_by:
  - source: degauss
    support:
    - type: schema
      document: degauss-geocoder-readme
      locator: Using
      source_slot: precision
      source_label: The method/precision of the geocode
      match: full
      explanation: >-
        The geocoder writes the precision category (range, street, intersection, zip, city) to
        the column `precision`.
      status: verified
    - type: output
      document: degauss-daymet-output
      field: precision
      value: range
      match: full
      explanation: >-
        The column is still there in the output of the daymet container, next to each value.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      `working.location` holds geocoded locations with latitude and longitude, and no column for
      the precision of the geocode.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: working.location
      source_slot: location.latitude
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus collapses the address to lat/lon at the THREDDS request and carries no geocoding
        precision.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER geocodes participants to points but does not carry the precision of the geocode.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Propagated geocoder precision is an instance-layer linkage quality signal, outside
        CODATA's conceptual scope.
  - source: chel
    reason: not_recorded
    explanation: >-
      CHEL takes participant geocodes as an input and says nothing about their precision.
      Closest: the Geocodes row of the input lineage table.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: Participant coordinate inputs for spatial linkage
      status: verified
    status: unverified

