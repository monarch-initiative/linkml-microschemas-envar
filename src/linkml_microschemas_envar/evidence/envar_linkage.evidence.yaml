privacy_transformation:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.1"
      snippet: >-
        raster zonal aggregation, tract-to-hex interpolation, density normalization, and
        deterministic privacy reassignment
      match: full
      explanation: >-
        CHEL names the transformation applied at linkage: a deterministic reassignment (jitter)
        of participants, based on ZIP3 x Hex3 slivers (§2.2.2).
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'No change of a linked location is described. Exposure data are shared at hex level
      so that addresses stay with the registry. The old entry described CHEL''s hex reassignment, which
      belongs to another source. Closest: the paper''s sharing by hexagon.'
    closest:
    - type: documentation
      document: cher-arxiv-paper
      locator: §1
      snippet: it can be shared with external institutions to facilitate exposomic research with standardized
        datasets while ensuring privacy
      status: verified
    status: unverified
  - source: amadeus
    reason: not_recorded
    explanation: 'Values are extracted at the coordinates given, and no transformation is applied or
      recorded. Closest: the buffer radius, which averages over an area but does not move the location.'
    closest:
    - type: schema
      document: amadeus-calculate-gridmet
      locator: arguments
      source_slot: calculate_gridmet.radius
      status: verified
    status: unverified
  - source: degauss
    reason: different_concept
    explanation: >-
      DeGAUSS links every value at the true coordinate. Privacy comes from running locally and
      removing addresses and coordinates afterwards, and the daymet container adds a random
      buffer to the bounding box of its download, which hides the study area from the data
      provider. Neither changes the location a value was linked at, and nothing says so.
      Closest: the Removing PHI section of degauss.org; the README of the `h3` container also
      offers a safe harbor geohash as a coarse location.
    closest:
    - type: documentation
      document: degauss-using
      locator: Removing PHI
      snippet: >-
        we are applying the "Safe Harbor" method defined by HIPAA for deidentification
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A post-join privacy transformation is an instance-layer linkage step, outside CODATA's
        conceptual scope.

