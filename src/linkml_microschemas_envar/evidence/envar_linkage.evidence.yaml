geocoding_database_version:
  supported_by:
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: >-
        degauss-org/geocoder README.md, Geomarker Data (3.3.0, v3.4.2); geocoder output filename
        tag
      note: >-
        No output column names the database; the filename gives the container version, whose
        README names the 2021 TIGER/Line Street Range Address files.
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: CHEL Documentation.md §2.7 (Geocodes input row, Source Link N/A)
      note: >-
        CHEL takes participant geocodes as an input; its lineage row gives no source, and
        no geocoder or address database is named in its documentation.
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: >-
        gaiaDB sql/01_init_schema.sql working.location; gaiaDocker docker/gaia-degauss/Dockerfile
      note: >-
        working.location has coordinates but no geocoder or address-database column, and the
        gaia-degauss image uses an untagged DeGAUSS geocoder.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: >-
        amadeus R/utils-calculate.R (calc_prepare_locs input, calc_return_locs output), version
        2.1.2
      note: >-
        Amadeus takes locations that already have coordinates, and its output names no reference
        address database.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: ORNL/TM-2026/4743 (doi:10.2172/3451859) resource and column fields
      note: >-
        The published C-HER metadata fields include no geocoding database. The ORNL ADDRESS
        report (doi:10.2172/3827145, Table 2) names OSM/Nominatim without a version, outside
        that metadata.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The reference database of a geocoding run is instance-layer linkage provenance, outside
        CODATA's conceptual scope.

