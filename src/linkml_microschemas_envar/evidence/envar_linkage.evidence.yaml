# Evidence for the slots of envar_linkage.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

linkage_strategy:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: >-
        CHEL Documentation.md §4.5.2; README.md (participant point to Hex3 join)
      note: >-
        CHEL's linkage strategy is first-class: geocoded participant points (§2.7) get a deterministic
        Hex3 assignment (§4.5.2); the README shows the point-in-hex spatial join.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        working.spatial_join_exposure SQL (st_within with a hard-coded buffer); spatial_join_log.txt
      note: >-
        GAIA's linkage strategy is only implicit in the st_within SQL join semantics, not
        exposed as a documented structured slot. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary column tagged Spatial – Primary + reference to boundaries
        schema
      note: >-
        C-HER's Spatial tags and boundaries-schema references encode a spatial join relationship,
        though not EnVar's linkage-strategy enum. Conservative: partial.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS carries no structured linkage-strategy slot; the point-extraction rule is
        implicit.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no linkage-strategy slot; the value is extracted at request coordinates
        with no recorded strategy.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The gridded-to-patient linkage strategy is an instance-layer derivation choice, outside
        CODATA's conceptual variable layer.

geocoding_precision_propagated:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §2.7 (Geocodes input), §4.5.2
      note: >-
        CHEL takes geocoded participant points as input and joins them to a hex, but the precision
        of the geocode itself is not carried.
  - source: degauss
    legacy:
      extent: full
      status: verified
      where: geocoder + daymet CSV `precision` column (range/street/zip/etc.)
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §B (Geocoding precision — ✅ for DeGAUSS)
      note: >-
        DeGAUSS carries the geocoding precision category first-class in the `precision` column
        — the motivating source for this slot.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No geocoding-precision column on location.csv or external_exposure.csv.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus collapses the address to lat/lon at the THREDDS request and carries no geocoding
        precision.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER geocodes participants to points but does not carry the precision of the geocode.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Propagated geocoder precision is an instance-layer linkage quality signal, outside
        CODATA's conceptual scope.

