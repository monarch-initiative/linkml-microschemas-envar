      document: amadeus-calculate-covariates
      locator: arguments
      source_slot: calculate_covariates.locs
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      `working.location` holds geocoded locations with latitude and longitude, and no column for
      the precision of the geocode.
    closest:
