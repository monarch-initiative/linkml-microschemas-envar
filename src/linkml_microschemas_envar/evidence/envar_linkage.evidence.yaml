privacy_transformation:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.1"
      snippet: >-
        raster zonal aggregation, tract-to-hex interpolation, density normalization, and
        deterministic privacy reassignment
      match: full
      explanation: >-
        CHEL names the transformation applied at linkage: a deterministic reassignment (jitter)
        of participants, based on ZIP3 x Hex3 slivers (§2.2.2).
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        C-HER hex-reassignment privacy jitter (small-population hex → largest hex in same
        ZIP3)
      note: >-
        C-HER (the CHEL platform, §2.2.2) applies the deterministic hex-reassignment privacy
        jitter this slot models — it is the motivating case.
  not_supported_by:
  - source: degauss
    reason: different_concept
    explanation: >-
      DeGAUSS adds a random buffer to the bounding box of the Daymet download, which hides the
      study area from the data provider. The recorded location is not changed, and nothing says
      so.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: to enhance data privacy
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus extracts at the true request coordinates with no privacy-transformation record.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A post-join privacy transformation is an instance-layer linkage step, outside CODATA's
        conceptual scope.

privacy_transformation_note:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: Protection of participant privacy under HIPAA expert determination
      match: partial
      explanation: >-
        The governance basis is stated (HIPAA expert determination), and §4.1 says the
        reassignment is deterministic. Missing: the threshold that triggers a reassignment and
        the rule for the new hex are not published; §5.5 only lists the privacy threshold as
        something a release should document.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        C-HER §4.5 trigger (hex∩ZIP3 population threshold), deterministic rule, HIPAA expert-determination
        basis
      note: >-
        C-HER spells out the concrete trigger, determinism, and legal basis of its jitter
        — exactly the detail this note slot captures.
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No privacy transform is applied by Amadeus, so there is no transform detail to record.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The detail of a post-join privacy transform is instance-layer, outside CODATA's conceptual
        scope.
