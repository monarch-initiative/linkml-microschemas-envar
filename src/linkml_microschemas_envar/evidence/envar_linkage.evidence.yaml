privacy_transformation:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: >-
        CHEL Documentation.md §2.2.2, §4.1, §4.8 (deterministic privacy jitter)
      note: >-
        CHEL applies a deterministic privacy reassignment (jitter) at linkage time, driven
        by ZIP3 x Hex3 sliver populations (§2.2.2, §2.2.4, §4.1); §4.8 advises fitting models
        with and without jitter-reassigned records.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        C-HER hex-reassignment privacy jitter (small-population hex → largest hex in same
        ZIP3)
      note: >-
        C-HER (the CHEL platform, §2.2.2) applies the deterministic hex-reassignment privacy
        jitter this slot models — it is the motivating case.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        The heat-scenario GAIA/OMOP join carries the true geocoded location with no privacy-transformation
        record on location.csv or external_exposure.csv.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS runs inside the institution and emits the true geocoded location; no privacy
        transform is recorded in its CSVs.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus extracts at the true request coordinates with no privacy-transformation record.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A post-join privacy transformation is an instance-layer linkage step, outside CODATA's
        conceptual scope.

privacy_transformation_note:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §1.3, §2.2.2, §5.5 (threshold not published)
      note: >-
        The public documentation names the mechanism (deterministic reassignment over ZIP3
        x Hex3 slivers, §2.2.2) and its governance basis (HIPAA expert determination, §1.3),
        and lists the privacy threshold as a per-release documentation item (§5.5), but does
        not publish the trigger value or the reassignment rule. Conservative: partial.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        C-HER §4.5 trigger (hex∩ZIP3 population threshold), deterministic rule, HIPAA expert-determination
        basis
      note: >-
        C-HER spells out the concrete trigger, determinism, and legal basis of its jitter
        — exactly the detail this note slot captures.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No privacy transform is applied in the GAIA/OMOP heat scenario, so there is no trigger/threshold/governance
        detail to record.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No privacy transform is applied by DeGAUSS here, so there is no transform detail to
        record.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No privacy transform is applied by Amadeus, so there is no transform detail to record.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The detail of a post-join privacy transform is instance-layer, outside CODATA's conceptual
        scope.
