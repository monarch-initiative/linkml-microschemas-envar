# Evidence for the slots of envar_linkage.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

linkage_strategy:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: §3.4
      snippet: enables exposure measures at different spatial resolutions to be assigned based on the
        geocode level
      match: partial
      explanation: 'For the SEER linkage, addresses are geocoded to a point or a ZIP code and the exposure
        is assigned at the matching resolution (hex8 or ZIP). Missing: described in the paper, not recorded
        per resource.'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: Description
      snippet: column name reflects the gridMET variable and circular buffer radius.
      match: partial
      explanation: 'The buffer radius is in the column name, so `_0` means a point extraction and any
        other value a buffer. Missing: the strategy is not named, and polygon locations are not marked
        as such.'
      status: verified
    - type: documentation
      document: amadeus-readme
      locator: Calculate_* buffer radius information
      snippet: output column names often encode that radius
      match: partial
      explanation: 'The README says the radius is encoded "often". Missing: not for every dataset.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.5.2"
      snippet: All points receive deterministic hex assignments.
      match: full
      explanation: >-
        Participant points are assigned to the Hex3 cell they fall in. The README example shows
        the same as a spatial join of points to hexes.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_relationship_source_value
      match: full
      explanation: >-
        Every exposure row says how it was joined: the operator or method verbatim in
        `exposure_relationship_source_value`, and as a concept in
        `exposure_relationship_concept_id`.
      status: verified
    - type: documentation
      document: gaiadb-spatial-join
      snippet: Map the spatial operator (and buffer) used for a join to an OMOP GIS
      match: full
      explanation: >-
        The join code maps the operator and the buffer to an OMOP GIS geometry relationship
        concept.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Using
      snippet: linked by date and coordinate
      match: full
      explanation: >-
        Values are attached to the coordinate of each row, for each date of the row's date
        range.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The gridded-to-patient linkage strategy is an instance-layer derivation choice, outside
        CODATA's conceptual variable layer.

geocoding_precision_propagated:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: §3.4
      snippet: were geocoded to the point level, and 1,060,257 were geocoded to the zip code.
      match: partial
      explanation: 'The geocode level (point or ZIP code) is known per address and decides which exposure
        is assigned. Missing: described for the SEER pipeline, not a field of C-HER metadata.'
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-geocoder-readme
      locator: Using
      source_slot: precision
      source_label: The method/precision of the geocode
      match: full
      explanation: >-
        The geocoder writes the precision category (range, street, intersection, zip, city) to
        the column `precision`.
      status: verified
    - type: output
      document: degauss-daymet-output
      field: precision
      value: range
      match: full
      explanation: >-
        The column is still there in the output of the daymet container, next to each value.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus takes locations that already have coordinates and does no geocoding. Closest:
      the `locs` argument.'
    closest:
