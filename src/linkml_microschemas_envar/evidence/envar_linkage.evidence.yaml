    reason: not_recorded
    explanation: >-
      CHEL takes participant geocodes as an input and says nothing about their precision.
      Closest: the Geocodes row of the input lineage table.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: Participant coordinate inputs for spatial linkage
      status: verified
    status: unverified

