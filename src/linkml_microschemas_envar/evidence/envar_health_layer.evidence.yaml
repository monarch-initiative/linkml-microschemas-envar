# Evidence for the slots of envar_health_layer.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

health_layer_target:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working schema
      source_slot: working.external_exposure
      match: full
      explanation: >-
        gaiaDB writes its results to the `external_exposure` table of the OMOP GIS extension.
        The target is fixed by design and not declared per dataset.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: PostgreSQL schema=health (health-resource bucket)
      note: >-
        C-HER has a health schema for health resources, but does not name a downstream health-data
        model as an exposure-record target. Conservative: partial.
  - source: chel
    support:
    - type: documentation
      document: chel-readme
      locator: Background
      snippet: >-
        developed the CLAD Hex Environmental Linkage (CHEL) dataset for the All of Us Research
        Program
      match: partial
      explanation: >-
        The README names the programme whose participant data CHEL is linked to. Missing: the
        data model or table that receives the values is not named.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No downstream health data model is named. Closest: the README says amadeus was developed
      for the NIEHS CHORDS program, which links environment and health data.'
    closest:
    - type: documentation
      document: amadeus-readme
      locator: Connecting Health Outcomes Research Data Systems
      snippet: has been developed as part of the National Institute of Environmental Health Science's
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Health-layer target naming is instance/integration-layer; out of scope for CODATA.

health_layer_link_field:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_source_value
      match: full
      explanation: >-
        The field of the health data that leads back to the metadata is `exposure_source_value`;
        the join fills it with the id of the variable's metadata record.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.reference_column_id (FK to a column in another resource, e.g.
        the health schema)
      note: >-
        C-HER models a cross-resource reference-column mechanism that could carry such a join,
        but declares no exposure-record-to-health-layer link field. Conservative: partial.
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No field of a health data model is named. Closest: the result joins back to the user''s
      locations on `locs_id`.'
    closest:
    - type: schema
      document: amadeus-calculate-covariates
      locator: arguments
      source_slot: calculate_covariates.locs_id
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      No field of the health data is named as the link. Closest: the README example keys its
      example participants on `participant_id`.
    closest:
    - type: schema
      document: chel-readme
      locator: Python Example
      source_slot: participant_id
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Health-layer join-field declaration is instance/integration-layer; out of scope for
        CODATA.

resource_identifier:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 6"
      snippet: >-
        Each resource has a unique identifier that is automatically generated based on its
        metadata entry
      match: full
      explanation: >-
        Every C-HER resource (a table or file) has its own identifier, issued by C-HER. For
        tables it is also the table name.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.dataset_id
      match: full
      explanation: >-
        Unique identifier of a catalogued dataset, filled from the `@id` of its JSON-LD
        metadata.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: "@id"
      value: https://gdsc.idsc.miami.edu/detail/ma_2022_svi_tract
      match: full
      explanation: >-
        In the public example the identifier is the catalogue's URL for its own packaging of
        the source (Massachusetts tracts of the CDC index), not an identifier of the source.
      status: verified
  - source: codata
    support:
    - type: schema
      document: ddi-cdi-irdi
      locator: InternationalRegistrationDataIdentifier
      source_slot: InternationalRegistrationDataIdentifier.dataIdentifier
      match: partial
      explanation: >-
        Identifier of a registered item within its registration authority. It applies to
        every registered item, a DataSet included; DDI-CDI does not say that it names the
        delivered table.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_sure
    explanation: >-
      Closest: §5.5 asks each release to document its "Foundry dataset references (RID)".
      Whether these identify the delivered hex tables, the inputs or both is not stated.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Foundry dataset references (RID)
      status: verified
    status: unverified

resource_identifier_scheme:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 7"
      snippet: A resource identifier is assembled from selected identifying metadata.
      match: partial
      explanation: >-
        The identifier follows a fixed pattern of eight segments, given in the report. A
        resource record has no pointer to that pattern; the report itself is the only
        reference.
      status: verified
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 7"
      snippet: >-
        We maintain “lookups” that connect each abbreviation or code to its full meaning.
      match: partial
      explanation: >-
        The segments can only be read with C-HER's lookup tables, so the identifier needs
        its scheme to be decoded. The lookups are not published with a URI.
      status: verified

resource_version:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 8"
      snippet: >-
        The version code ensures that every resource has a unique identifier when its other
        identifying metadata would not be sufficient to distinguish it.
      match: full
      explanation: >-
        C-HER gives each resource its own version code, starting at 001, apart from the
        version of the source dataset.
      status: verified
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 8"
      snippet: Resources that differ only by version code are still distinct resources.
      match: full
      explanation: >-
        A corrected table is a new resource with the same source and a new version code.
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        CHEL must support versioned releases that reflect updated inputs while preserving
        methodological consistency
      match: partial
      explanation: >-
        CHEL versions its own product as releases (CHEL 2022, CHEL 2024), apart from the
        vintages of its sources. The text does not say that a table records its release, and
        there is no version below the release.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiacatalog-schema
      locator: types
      source_slot: VersionString
      match: full
      explanation: >-
        The catalogue schema defines the `version` of an entry as a release date (YYYY-MM-DD).
        gaiaDB loads it into `data_source.dataset_version`.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: version
      value: "2026-05-23"
      match: full
      explanation: >-
        The version of the catalogue entry for the 2022 CDC index in the public example.
      status: verified
  - source: codata
    support:
    - type: schema
      document: ddi-cdi-irdi
      locator: InternationalRegistrationDataIdentifier
      source_slot: InternationalRegistrationDataIdentifier.versionIdentifier
      match: partial
      explanation: >-
        Version under which a registered item was submitted or updated. It applies to every
        registered item, a DataSet included; DDI-CDI does not say that it is the version of
        the delivered table.
      status: verified

resource_publisher:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§2.2.1, p. 7"
      snippet: >-
        C-HER also has its own organization identifier for datasets created by our team.
      match: partial
      explanation: >-
        The organization of a resource is C-HER only for datasets C-HER created. For
        external data it is the publisher of the original data, so the issuer of the
        identifier and version (always C-HER) is not a field.
      status: verified
  - source: codata
    support:
    - type: schema
      document: ddi-cdi-irdi
      locator: InternationalRegistrationDataIdentifier
      source_slot: InternationalRegistrationDataIdentifier.registrationAuthorityIdentifier
      match: partial
      explanation: >-
        Identifies the authority that registered the item, i.e. who issued its identifier
        and version. It is an identifier of the authority, not its name, and applies to
        every registered item.
      status: verified
    - type: argument
      document: ddi-cdi-irdi
      locator: Definition
      snippet: >-
        The uniqueness of an InternationalRegistrationDataIdentifier (IRDI) is determined by
        the combination of the values of three identifying attributes.
      explanation: >-
        The three attributes are the identifier, the registration authority and the version:
        an identifier and a version are only unique together with who issued them.
      status: verified
  - source: omop_gaia
    support:
    - type: output
      document: gaiacatalog-example-dcat
      field: "dct:publisher"
      match: partial
      explanation: >-
        The DCAT record of a catalogue entry names who publishes the catalogued copy (in the
        PM2.5 example the University of Miami GDSC), next to the creators of the source. In the
        JSON-LD and in gaiaDB this is `provider`. Missing: the entries are not consistent: the
        bundled SVI example gives the source agency (CDC) as provider.
      status: verified

participant_coverage_pct:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-entrypoint
      locator: "lines 160-163"
      snippet: addresses were successfully geocoded
      match: partial
      explanation: >-
        The geocoder prints how many of the input addresses were geocoded, as a count and a
        percentage. Missing: it counts addresses and not persons, it is about a coordinate
        and not an exposure value, and it goes to the console and not into the output file.
      status: verified
    - type: schema
      document: degauss-geocoder-readme
      locator: "Using, added columns"
      source_slot: geocode_result
      match: partial
      explanation: >-
        Result of the geocode for each row. Rows that are not `geocoded` come back without
        coordinates, so later steps cannot give them a value. Missing: no percentage, and a
        row is an address, not a person.
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.5.2"
      snippet: Points falling outside any ZIP3 boundary are logged and reviewed.
      match: partial
      explanation: >-
        CHEL keeps track of the participant points that cannot be linked. Missing: no
        percentage of participants with a value is reported.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: implicit
    explanation: >-
      gaiaDB has no coverage figure. Closest: `working.external_exposure` has one row per
      computed value with a `person_id`, so the persons with a value can be counted and
      compared with the entities in `working.location_history`.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.person_id
      status: verified
    status: unverified
