# Evidence for the slots of envar_source.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

source_dataset_name:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "ACS NOHSDP | Census Tract | Social vulnerability indicators"
      match: full
      explanation: Each input is named in the Input column of the table.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db data_source.dataset_name; meta_dcat_*.json dct:title
      evidence: EnVar/examples/heat/COMPARISON.md §I (Dataset name — ✅ OMOP/GAIA)
      note: >-
        GAIA carries the dataset name first-class in data_source and the DCAT title.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset (via table_name {dataset} slot)
      note: >-
        C-HER names the dataset first-class as the {dataset} component of the reproducible
        table_name and as a foreign key on table_dictionary.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS emits no dataset-name field; only the container name is baked into the CSV
        filename.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no dataset name; it has to be inferred from the THREDDS URL path.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: DDI-CDI dataset-level description (conceptual layer)
      note: >-
        Dataset identity sits above the DDI-CDI InstanceVariable layer CODATA scores; conceptual,
        excluded from instance-layer scoring.

source_dataset_short_code:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: gaia_db data_source.dataset_name (no registry short code)
      note: >-
        GAIA carries the dataset name but no stable per-product short registry code; scored
        partial.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset ({dataset} component of table_name)
      note: >-
        The {dataset} slot in the reproducible table_name is exactly a stable machine-readable
        short code keying the product.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no dataset short code.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no dataset short code.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A registry short code is a catalogue/discovery concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      Inputs are named in full in the input lineage table (§2.7); there is no short code per
      input.
    status: unverified

source_dataset_doi:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: meta_dcat_*.json dct:identifier
      note: >-
        GAIA carries a DOI in DCAT dct:identifier for daymet, but not all entries carry one
        (gridmet has only a url), so scored conservatively as partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary doi (via doi_id FK)
      note: >-
        C-HER has a doi field (foreign key doi_id) but it is on the optional-field list, so
        a DOI is not guaranteed present.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no DOI.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no DOI.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Source-dataset DOI is a discovery/citation concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      The input lineage table gives a web link per input; none of them is a DOI. Closest: the
      Source Link column.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "Input | Native Geometry | Role in CHEL | Source Link"
      status: verified
    status: unverified

source_dataset_version:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§5.3.1"
      snippet: EJI 2022 and EJI 2024 are distinct source datasets.
      match: partial
      explanation: >-
        The release of the main input (EJI) and of the boundary files (TIGER 2019 and 2020,
        §2.2.2) is given per CHEL release. Missing: for ACS, §5.3.2 only says that the releases
        use different rolling periods, without naming them.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db data_source.dataset_version
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §I (Dataset version — ✅ OMOP/GAIA, 'V4 R1')
      note: >-
        GAIA carries the upstream dataset version first-class in data_source.dataset_version.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: CSV filename token (daymet_1.0.0)
      note: >-
        DeGAUSS bakes only the container version into the filename, not the upstream dataset
        version.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary version ({version} component of table_name)
      note: >-
        C-HER carries an auto-generated version code first-class in the table_name and via
        the version table (§2.6).
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no dataset version.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Product version is a discovery/lineage concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

source_dataset_temporal_coverage:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        meta_dcat_*.json dct:temporal; gaia_db variable_source.start_date/end_date
      evidence: EnVar/examples/heat/COMPARISON.md §H (Dataset time-span — ✅ OMOP/GAIA)
      note: >-
        GAIA carries the product time span in DCAT dct:temporal and the variable_source start/end
        dates.
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml TimeSpan
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §H (Dataset time-span — ✅ Amadeus, TimeSpan 1979→present)
      note: >-
        Amadeus records the full dataset time span in the THREDDS dataset.xml TimeSpan element.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary temporal_extent (YYYYMMDDYYYYMMDD in table_name)
      note: >-
        C-HER carries temporal extent as a start+end date pair in the reproducible table_name
        (§2.4).
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no dataset time-span.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Product temporal coverage is a discovery-layer concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      Inputs are identified by release year (EJI 2022, TIGER 2019); the period the data cover is
      not given. Closest: the statement that each release is tied to source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified

source_dataset_spatial_extent:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        meta_dcat_*.json spatialCoverage; gaia_db data_source.spatial_coverage; meta_etl_*.json
        extent (POLYGON WKT)
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §G (Source-dataset spatial coverage — ✅ OMOP/GAIA)
      note: >-
        GAIA carries the source spatial coverage in DCAT, in data_source.spatial_coverage,
        and as a POLYGON WKT extent.
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml projectionBox + LatLonBox
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §G (Source-dataset spatial coverage — ✅ Amadeus,
        CONUS bbox)
      note: >-
        Amadeus records the source bbox via the THREDDS projectionBox and LatLonBox elements.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary spatial_extent (Gxx/Txx/Cxx/sxx code in table_name)
      note: >-
        C-HER carries spatial extent first-class as a coded component of the reproducible
        table_name (§2.2).
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no source spatial coverage.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Product spatial extent is a discovery-layer concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: implicit
    explanation: >-
      That the inputs are national US datasets follows from the text, but no extent is given per
      input. Closest: the mention of national-scale datasets in §1.3.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: Computational feasibility for national-scale datasets
      status: verified
    status: unverified

source_producer_institution:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.5"
      snippet: Health prevalence indicators derive from CDC PLACES.
      match: partial
      explanation: >-
        The producer is named in passing for some inputs (CDC for PLACES and, in the README, for
        EJI). Missing: the input lineage table has no producer column; for ACS, GPW and TIGER
        only a link is given.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db data_source.creator/provider; meta_dcat_*.json dct:publisher
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §I (Publisher/creator/provider — ✅ OMOP/GAIA)
      note: >-
        GAIA carries publisher/creator/provider first-class in data_source and DCAT dct:publisher.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_dictionary org ({org} component of table_name; publishing organization)
      note: >-
        C-HER encodes the publishing organization first-class as the {org} component of table_name;
        selecting a dataset implicitly selects its organization (§1).
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no producer/publisher field.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no producer/publisher field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Producer institution is a discovery/attribution concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

