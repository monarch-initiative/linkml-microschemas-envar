source_citation_apa:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: acknowledgement string (acknowledgement = TRUE)
      note: >-
        Amadeus can attach a free-text acknowledgement string, which is a citation-like credit
        but not a formatted APA reference (related-approaches.md §3).
  - source: chel
    support:
    - type: documentation
      document: chel-wiki-home
      locator: "13. References"
      snippet: >-
        Centers for Disease Control and Prevention and Agency for Toxic Substances Disease
        Registry. 2024 Environmental Justice Index.
      match: partial
      explanation: >-
        The wiki has a reference list with a citation of the main input, EJI 2024. Missing: not
        in APA form, and EJI 2022, ACS, GPW and TIGER are not cited (PLACES is listed by name
        only).
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-census-block-group-readme
      locator: References
      snippet: >-
        Steven Manson, Jonathan Schroeder, David Van Riper, Tracy Kugler, and Steven Ruggles.
        IPUMS National Historical Geographic Information System: Version 15.0
      match: partial
      explanation: >-
        The README of the `census_block_group` container gives a full citation of its source
        dataset. Missing: only in this container; the daymet README gives no citation of Daymet.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for a citation. Closest: creator, name and publication date, from which one can
      be built.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.date_published
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER carries contributors, rights, and DOI but no assembled APA citation string.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A formatted citation is a discovery/attribution concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

source_license_spdx:
