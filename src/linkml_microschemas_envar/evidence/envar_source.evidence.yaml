        partial.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset ({dataset} component of table_name)
      note: >-
        The {dataset} slot in the reproducible table_name is exactly a stable machine-readable
        short code keying the product.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no dataset short code.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no dataset short code.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A registry short code is a catalogue/discovery concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

