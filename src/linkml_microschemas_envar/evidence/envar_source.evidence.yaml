    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA carries publisher and DOI but no assembled APA citation string; none is emitted.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no citation.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER carries contributors, rights, and DOI but no assembled APA citation string.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A formatted citation is a discovery/attribution concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      No citation is given for any input. Closest: the Source Link column of the input lineage
