  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary spatial_extent (Gxx/Txx/Cxx/sxx code in table_name)
      note: >-
        C-HER carries spatial extent first-class as a coded component of the reproducible
        table_name (§2.2).
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        produced on a 1 km x 1 km gridded surface over continental North America and Hawaii
      match: full
      explanation: >-
        The README gives the extent of the product: continental North America, Hawaii and Puerto
        Rico.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
