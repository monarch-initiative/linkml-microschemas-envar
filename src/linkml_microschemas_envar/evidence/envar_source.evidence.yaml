# Evidence for the slots of envar_source.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

source_dataset_name:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: CHEL Documentation.md §2.7 input lineage table
      note: >-
        CHEL names each source dataset first-class in the §2.7 input-lineage table (e.g. EJI
        2022, EJI 2024, ACS, GPW v4).
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db data_source.dataset_name; meta_dcat_*.json dct:title
      evidence: EnVar/examples/heat/COMPARISON.md §I (Dataset name — ✅ OMOP/GAIA)
      note: >-
        GAIA carries the dataset name first-class in data_source and the DCAT title.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset (via table_name {dataset} slot)
      note: >-
        C-HER names the dataset first-class as the {dataset} component of the reproducible
        table_name and as a foreign key on table_dictionary.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS emits no dataset-name field; only the container name is baked into the CSV
        filename.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no dataset name; it has to be inferred from the THREDDS URL path.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: DDI-CDI dataset-level description (conceptual layer)
      note: >-
        Dataset identity sits above the DDI-CDI InstanceVariable layer CODATA scores; conceptual,
        excluded from instance-layer scoring.

