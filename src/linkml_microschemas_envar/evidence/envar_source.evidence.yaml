# Evidence for the slots of envar_source.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

source_dataset_name:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "ACS NOHSDP | Census Tract | Social vulnerability indicators"
      match: full
      explanation: Each input is named in the Input column of the table.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.dataset_name
      match: full
      explanation: The name of the dataset, a required field.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: name
      value: "2022 Massachusetts CDC Social Vulnerability Index (tracts)"
      match: full
      explanation: The name in the public example.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset (via table_name {dataset} slot)
      note: >-
        C-HER names the dataset first-class as the {dataset} component of the reproducible
        table_name and as a foreign key on table_dictionary.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Data
      snippet: Weather data are downloaded from
      match: partial
      explanation: >-
        The README says the weather data are downloaded from Daymet. Missing: the product is
        named as Daymet only, without its full name, and the name is not written to the output.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no dataset name; it has to be inferred from the THREDDS URL path.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: DDI-CDI dataset-level description (conceptual layer)
      note: >-
        Dataset identity sits above the DDI-CDI InstanceVariable layer CODATA scores; conceptual,
        excluded from instance-layer scoring.

source_dataset_short_code:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.dataset_id
      match: full
      explanation: >-
        Every dataset has a unique `dataset_id` (the `@id` of its JSON-LD), which ends in the
        short table id the catalogue uses for it, for example `ma_2022_svi_tract`.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary dataset ({dataset} component of table_name)
      note: >-
        The {dataset} slot in the reproducible table_name is exactly a stable machine-readable
        short code keying the product.
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      There is no code for the source product. Closest: the container itself is called `daymet`.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no dataset short code.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A registry short code is a catalogue/discovery concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      Inputs are named in full in the input lineage table (§2.7); there is no short code per
      input.
    status: unverified

source_dataset_doi:
  supported_by:
  - source: omop_gaia
    support:
    - type: output
      document: gaiacatalog-example-dcat
      field: "dct:identifier"
      value: "https://doi.org/10.7910/DVN/RHIFKL"
      match: partial
      explanation: >-
        The DCAT record of a catalogue entry gives the DOI of the source dataset as
        `dct:identifier`. Missing: only in the DCAT record. The JSON-LD that gaiaDB loads has no
        field for it, so `data_source` has no DOI.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary doi (via doi_id FK)
      note: >-
        C-HER has a doi field (foreign key doi_id) but it is on the optional-field list, so
        a DOI is not guaranteed present.
  - source: degauss
    support:
    - type: documentation
      document: degauss-census-block-group-readme
      locator: References
      snippet: "Minneapolis, MN: IPUMS. 2020. http://doi.org/10.18128/D050.V15.0"
      match: partial
      explanation: >-
        The citation in the README of the `census_block_group` container has the DOI of its
        source dataset. Missing: only in this container; the daymet README links the Daymet user
        guide and project page, no DOI.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no DOI.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Source-dataset DOI is a discovery/citation concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      The input lineage table gives a web link per input; none of them is a DOI. Closest: the
      Source Link column.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "Input | Native Geometry | Role in CHEL | Source Link"
      status: verified
    status: unverified

source_dataset_version:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§5.3.1"
      snippet: EJI 2022 and EJI 2024 are distinct source datasets.
      match: partial
      explanation: >-
        The release of the main input (EJI) and of the boundary files (TIGER 2019 and 2020,
        §2.2.2) is given per CHEL release. Missing: for ACS, §5.3.2 only says that the releases
        use different rolling periods, without naming them.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary version ({version} component of table_name)
      note: >-
        C-HER carries an auto-generated version code first-class in the table_name and via
        the version table (§2.6).
  - source: degauss
    support:
    - type: schema
      document: degauss-st-census-tract-readme
      locator: Using
      source_slot: census_tract_vintage
      match: partial
      explanation: >-
        The `st_census_tract` container writes the vintage of the census geography it used to a
        column of the output, per row. Missing: only in this container. The daymet container
        asks the provider for the current Daymet product at run time and does not write the
        version it got; its README links the Daymet V4 user guide.
      status: verified
    - type: documentation
      document: degauss-census-block-group-readme
      locator: References
      snippet: "IPUMS National Historical Geographic Information System: Version 15.0"
      match: partial
      explanation: >-
        The README of the `census_block_group` container names the version of its source.
        Missing: in the README only, not in the output.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no dataset version.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Product version is a discovery/lineage concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      The catalogue's `version` is a release date of the catalogue entry (YYYY-MM-DD), which
      gaiaDB loads into `dataset_version`. The version of the source product has no field; in
      the public PM2.5 example it is only part of the dataset name and of the source URL (v1).
    closest:
    - type: schema
      document: gaiacatalog-schema
      locator: types
      source_slot: VersionString
      status: verified
    status: unverified

source_dataset_temporal_coverage:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.start_date
      match: full
      explanation: "Each variable has the period it covers (`start_date`, `end_date`)."
      status: verified
    - type: schema
      document: gaiacatalog-schema
      locator: Dataset
      source_slot: Dataset.temporal_coverage
      match: full
      explanation: >-
        A catalogue entry can give the period of the whole dataset as `temporalCoverage`,
        written start/end. It is a recommended field.
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml TimeSpan
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §H (Dataset time-span — ✅ Amadeus, TimeSpan 1979→present)
      note: >-
        Amadeus records the full dataset time span in the THREDDS dataset.xml TimeSpan element.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary temporal_extent (YYYYMMDDYYYYMMDD in table_name)
      note: >-
        C-HER carries temporal extent as a start+end date pair in the reproducible table_name
        (§2.4).
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        over continental North America and Hawaii from 1980 and over Puerto Rico from 1950
        through the end of the most recent full calendar year
      match: partial
      explanation: >-
        The README gives the years the product covers. Missing: the end is relative (the most
        recent full year), and the coverage is not written to the output.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Product temporal coverage is a discovery-layer concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: not_recorded
    explanation: >-
      Inputs are identified by release year (EJI 2022, TIGER 2019); the period the data cover is
      not given. Closest: the statement that each release is tied to source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified

