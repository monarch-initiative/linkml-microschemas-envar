    support:
    - type: schema
      document: gaiacatalog-schema
      locator: Dataset
      source_slot: Dataset.license
      match: partial
      explanation: >-
        A catalogue entry has a `license`, a short identifier from a list of four (cc0-1.0,
        cc_by, odbl, odc_by); a missing one is reported as a warning. Missing: the list is the
        catalogue's own, not SPDX.
      status: verified
    - type: output
      document: gaiacatalog-example-etl
      field: rights
      value: Public Domain
      match: partial
      explanation: >-
        The ETL file of the example gives the rights of the source. Missing: free text.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary rights (via rights FK)
      note: >-
        C-HER carries a required rights field, but it is not SPDX-coded, so it only partly
        satisfies this SPDX-specific slot.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No licence is given for any input, and the CHEL repository has no licence file. Nothing
      close was found in Documentation.md or README.md.
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No licence or terms of use of Daymet are passed on. Nothing close was found in the daymet
      README or entrypoint.R.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no license field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        License is a discovery/rights concern above the DDI-CDI InstanceVariable layer CODATA
        scores.

