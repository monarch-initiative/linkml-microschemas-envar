  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no DOI.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Source-dataset DOI is a discovery/citation concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

