source_access_url:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "Input | Native Geometry | Role in CHEL | Source Link"
      match: full
      explanation: >-
        The Source Link column gives a URL for each public input, in most rows a landing or
        download page of the dataset.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db data_source.url; meta_etl_*.json source; JSON-LD url
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §I (Source landing-page URL — ✅ OMOP/GAIA)
      note: >-
        GAIA carries the source landing-page URL first-class in data_source.url and the JSON-LD
        url.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml @location (NCSS data endpoint)
      note: >-
        Amadeus carries only the THREDDS NCSS data-endpoint URL, not the human landing page.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no source landing-page URL.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER records an S3-protocol storage location for the resource, not a source landing-page
        URL.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A source landing-page URL is a discovery concern above the DDI-CDI InstanceVariable
        layer CODATA scores.

source_native_format:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        meta_etl_*.json structure/geometry (raster); gaia_db data_source.geom_type
      note: >-
        GAIA records dataset structure (raster) and geometry type but not the native file
        format (e.g. NetCDF-4/CF) as a first-class slot.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: gridmet_tmmx.cf_metadata.json (CF metadata implies NetCDF)
      note: >-
        Amadeus's CF metadata blob implies the NetCDF/CF native format but does not declare
        it in a dedicated format field.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_dictionary resource_format (IANA Media Types controlled vocab)
      note: >-
        C-HER carries resource_format first-class against the IANA Media Types controlled
        vocabulary.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS records no source native format.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Native shipping format is a packaging/discovery concern above the DDI-CDI InstanceVariable
        layer CODATA scores.
  - source: chel
    reason: different_concept
    explanation: >-
      The input lineage table has a Native Geometry column (census tract, raster, polygon,
      point). That is the geometry of the input, not its file format.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "Input | Native Geometry | Role in CHEL | Source Link"
      status: verified
    status: unverified
