# Evidence for the slots of envar_layout.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

table_orientation:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 12
      snippet: They identify whether a column contains the measured value
      match: partial
      explanation: 'Column tags say which columns hold values and which locate the row in space and
        time, so the layout can be read off. Missing: wide or long is not stated.'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: Description
      snippet: column name reflects the gridMET variable and circular buffer radius.
      match: partial
      explanation: 'The result has one row per location and time and one column per variable and radius,
        so it is wide. Missing: the layout is not declared; it follows from the column naming.'
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-readme
      locator: Loading Variables and Spatial Joins
      snippet: one row per feature, variable, and time window
      match: partial
      explanation: >-
        The README says that the attribute tables are long: one row per feature, variable and
        time window. Missing: for `external_exposure` the long layout follows from its columns
        only, and there is no field for the orientation.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-using
      locator: A Sample Workflow
      snippet: >-
        These two DeGAUSS containers append new columns to our dataset with their respective
        geomarkers, while keeping intact our original dataset.
      match: partial
      explanation: >-
        degauss.org says that each container appends its geomarkers as new columns to the input
        file, which is the wide layout. Missing: the layout is not named, and no field declares
        it.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        File orientation is an instance-layer layout detail; CODATA's conceptual layer does
        not describe physical table shape.
  - source: chel
    reason: implicit
    explanation: >-
      The wide layout can be seen in the published tables (one row per `hex_id`, one column per
      indicator) but is not stated. Closest: the key column `hex_id`.
    closest:
    - type: output
      document: chel-hex3-2024
      field: hex_id
      status: verified
    status: unverified

value_column:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 12
      snippet: Measured, observed, modeled, or calculated quantity.
      match: full
      explanation: Columns that hold values carry the tag Value (e.g. pm25_mean).
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: Description
      snippet: column name reflects the gridMET variable and circular buffer radius.
      match: full
      explanation: 'The value column has a documented name: variable code and buffer radius, e.g. `tmmx_0`
        in the gridMET vignette.'
      status: verified
    - type: documentation
      document: amadeus-calc-setcolumns
      locator: Description
      snippet: temporal lag, and 5 digit buffer radius (in meters)
      match: partial
      explanation: '`calc_setcolumns` renames value columns to a fixed pattern of genre, variable, lag
        and radius. Missing: it is an internal helper for beethoven and is not applied by `calculate_covariates`.'
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.value_as_number
      match: full
      explanation: "The value is in the fixed column `value_as_number`."
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      source_label: maximum temperature
      match: full
      explanation: >-
        The README lists the columns the tool adds, one per Daymet variable, with what each
        holds.
      status: verified
    - type: output
      document: degauss-daymet-output
      field: tmax
      value: "44.61"
      match: full
      explanation: "The output of the daymet container has the value in the column `tmax`."
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Binding a value to a physical column is instance-layer; CODATA's conceptual layer
        does not name file columns.
  - source: chel
    reason: implicit
    explanation: >-
      Each indicator is its own column in the hex tables, but nothing declares which column
      holds the values of which variable. Closest: an indicator column such as `EPL_NEHD`.
    closest:
    - type: output
      document: chel-hex3-2024
      field: EPL_NEHD
      status: verified
    status: unverified

subject_column:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 13
      snippet: Most specific spatial identifier used to locate the record.
      match: partial
      explanation: 'The row subject of a C-HER table is a place, and its column is tagged Spatial -
        Primary (e.g. h3_index). Missing: there is no tag for a person or cohort identifier.'
      status: verified
  - source: amadeus
    support:
    - type: schema
      document: amadeus-calculate-covariates
      locator: arguments
      source_slot: calculate_covariates.locs_id
      match: full
      explanation: '"Name of unique identifier." The identifier column of the locations is named by
        the caller and kept in the result.'
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.person_id
      match: full
      explanation: "The person is in the fixed column `person_id`."
      status: verified
  - source: degauss
    support:
    - type: output
      document: degauss-daymet-output
      field: id
      value: "91204"
      match: full
      explanation: >-
        The identifier is in the column `id` on every row; the README names `id` as the ID
        column of the input.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The subject/cohort column binding is instance-layer layout, outside CODATA's conceptual
        scope.
  - source: chel
    reason: implicit
    explanation: >-
      The released tables are keyed on `hex_id`, and the README example keys participants on
      `participant_id`. Neither is declared as the subject column.
    closest:
    - type: output
      document: chel-hex3-2024
      field: hex_id
      status: verified
    status: unverified

time_column:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 13
      snippet: Most specific time field used to locate the observation.
      match: full
      explanation: The time column is tagged Temporal - Primary (e.g. observation_date).
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-utils-calculate
      locator: calc_time
      snippet: Type of time to return in the
      match: full
      explanation: Every time-dependent result has a `time` column ("`$time` column" in the code, and
        the `time` column of the README example).
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_start_date
      match: partial
      explanation: >-
        The time of a value is in fixed columns. Missing: it is a period in two columns
        (`exposure_start_date`, `exposure_end_date`), not one date column.
      status: verified
  - source: degauss
    support:
    - type: output
      document: degauss-daymet-output
      field: date
      value: "2022-07-15"
      match: full
      explanation: "The output has one row per id and day, with the day in the column `date`."
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The time-column binding is instance-layer layout, outside CODATA's conceptual scope.
  - source: chel
    reason: different_granularity
    explanation: >-
      The hex tables have no time column: the year is part of the release (file) name. Closest:
      the participant `start_date` of the README example, which selects the release and is not
      the time of a value.
    closest:
    - type: schema
      document: chel-readme
      locator: Python Example
      source_slot: start_date
      status: verified
    status: unverified

value_uncertainty_column:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 12
      snippet: Information that qualifies or describes a value field.
      match: partial
      explanation: 'Columns that qualify a value are tagged Meta Value; the examples include estimate_margin_error.
        Missing: the tag also covers quality flags, so an uncertainty column is not marked as such.'
      status: verified
  - source: amadeus
    support:
    - type: schema
      document: amadeus-modis-vignette
      locator: MCD19A2 subdatasets
      source_slot: MCD19A2.AOD_Uncertainty_1
      match: partial
      explanation: 'For MODIS MCD19A2 the AOD uncertainty layers can be processed and extracted like
        any other layer. Missing: only for MODIS AOD; no column is marked as the uncertainty of another,
        and gridMET has none.'
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-pm-readme
      locator: Using
      snippet: standard error for predicted PM2.5
      match: partial
      explanation: >-
        In the `pm` container the output has a column `pm_se` with the standard error of each
        predicted value. Missing: only in this container; the daymet container of the heat
        example has no uncertainty column.
      status: verified
  not_supported_by:
  - source: chel
    reason: implicit
    explanation: >-
      The tables have a column `M_TOTPOP` next to `E_TOTPOP` (in EJI, `M_` is the margin of
      error). It exists for this one variable only and CHEL's documentation does not describe
      it. No other indicator has an uncertainty column.
    closest:
    - type: output
      document: chel-hex3-2024
      field: M_TOTPOP
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      `external_exposure` and the attribute tables have no column for the uncertainty of a
      value. Nothing close was found in the schema or the README.
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A per-value uncertainty column binding is instance-layer layout, outside CODATA's
        conceptual scope.

null_semantics_column:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.3"
      snippet: Structural nulls (no source data available)
      match: partial
      explanation: >-
        CHEL defines the three kinds of empty value the column distinguishes (structural null,
        derived null, true zero). Missing: the published tables have no column that says which
        kind a given null is.
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'No column says why a value is missing. Closest: a quality flag column (Meta Value)
      that codes completeness or review conditions of a value.'
    closest:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.3, p. 13
      snippet: Code that identifies completeness or review conditions associated with pm25_mean.
      status: verified
    status: unverified
  - source: amadeus
    reason: not_recorded
    explanation: 'No column says why a value is missing. Closest: the MODIS fusion of two satellites
      takes the mean while ignoring missing values, so a missing value is left out silently.'
    closest:
    - type: documentation
      document: amadeus-calculate-modis
      locator: arguments
      snippet: Fusion method used only when
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No column says why a value is empty. Closest: the geocoder's `geocode_result`, which says
      why a coordinate is missing (PO box, no address text, imprecise geocode).
    closest:
    - type: schema
      document: degauss-geocoder-readme
      locator: Using
      source_slot: geocode_result
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A per-value null-semantics column binding is instance-layer layout, outside CODATA's
        conceptual scope.
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      The catalogue gives the nodata value of a dataset (`nodata` in the ETL file) and gaiaDB
      registers it per variable (`attr_no_value_as_number`). That is the marker of a missing
      value, not a column that says for each value why it is empty.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_index
      source_slot: attr_index.attr_no_value_as_number
      status: verified
    - type: output
      document: gaiacatalog-example-etl
      field: nodata
      status: verified
    status: unverified
