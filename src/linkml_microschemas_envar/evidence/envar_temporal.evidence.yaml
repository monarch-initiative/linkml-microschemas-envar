# Evidence for the slots of envar_temporal.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

temporal_resolution:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 8
      snippet: Temporal resolution is the frequency or granularity
      match: full
      explanation: Temporal resolution is a coded field of every resource (A00 annual, M00 monthly,
        W00 weekly).
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-gridmet-vignette
      locator: Available inputs and data availability
      snippet: 'Temporal resolution: daily; each download is an annual NetCDF file for one variable.'
      match: full
      explanation: The vignette of each dataset gives its temporal resolution; gridMET is daily.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet weather variables include daily day length
      match: full
      explanation: "The README says the variables are daily; the output has one row per day."
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_template
      source_slot: attr_template.attr_start_date
      match: partial
      explanation: >-
        Every value has its own time window (`attr_start_date`, `attr_end_date`). Missing: the
        grain is not named (daily, monthly); it follows from the length of the window.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No time grain is stated for the indicators. Closest: each release is tied to a set of
      source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The native temporal grain of a specific run is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

temporal_aggregation_method:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.3, p. 13
      snippet: Arithmetic mean of valid PM2.5 observations assigned to the cell and date
      match: partial
      explanation: 'The column description says how a value was calculated. Missing: free text, not
        a coded method.'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-gridmet-vignette
      locator: Available inputs and data availability
      snippet: Maximum Near-Surface Air Temperature
      match: partial
      explanation: 'For temperature the daily summary is in the variable name (maximum, minimum). With
        `.by_time` amadeus itself summarises over a time unit with `fun`. Missing: not a structured
        field.'
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: maximum and minimum temperature, and vapor pressure
      match: partial
      explanation: >-
        For temperature the summary over the day is in the variable name (maximum, minimum).
        Missing: nothing for the other variables (precipitation, radiation, vapor pressure).
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      Indicators such as extreme heat days and wildfire smoke days are counts over a period, but
      neither the period nor the way of summarising is given. Closest: the indicator list in
      §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field says how a value summarises its time window (mean, maximum, sum). Closest: the
      free-text description of the variable.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_description
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How sub-period values were aggregated in one run is instance-layer detail outside
        the conceptual EV/DDI-CDI layer.

