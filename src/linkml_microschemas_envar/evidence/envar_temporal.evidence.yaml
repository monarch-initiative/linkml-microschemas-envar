  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 8
      snippet: Temporal extent is the period covered by the resource and is recorded as a start date
        and
      match: partial
      explanation: 'A resource is one cut of a dataset (e.g. TIGER 2024), and its start date is recorded.
