day_boundary_convention:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-goes-vignette
      locator: Temporal domain
      snippet: Daily archive by UTC day
      match: partial
      explanation: 'For GOES the vignette says the daily archive is by UTC day. Missing: only for GOES;
        for gridMET nothing says where the day starts.'
      status: verified
    - type: documentation
      document: amadeus-process-aqs
      locator: arguments
      snippet: for time zone associated with hourly data.
      match: partial
      explanation: 'For AQS the user chooses whether hourly data are in local time or GMT. Missing:
        only for AQS, and it is the clock of hourly data, not a daily window.'
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'Where a day starts is not recorded. Closest: a time zone column can be tagged Temporal
      - Secondary.'
    closest:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.2, p. 13
      snippet: Supporting time field.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      Periods are dates, and nothing says where a day starts or in which time zone. Closest: the
      exposure datetime columns, which the join fills from the dates.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_start_datetime
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing says when a Daymet day starts and ends. Closest: the README's note on the Daymet
      calendar.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: The Daymet calendar is based on a standard calendar year.
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Day-boundary convention is an EnVar-novel commensurability slot no standard carries;
        not merely out-of-layer — genuinely absent.

