calendar:
  supported_by:
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml day axis (days since 1900-01-01, calendar = gregorian)
      evidence: EnVar/examples/heat/COMPARISON.md §H (time-origin / calendar ✅)
      note: >-
        The THREDDS day axis declares the calendar (gregorian) and time origin explicitly.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: The Daymet calendar is based on a standard calendar year.
      match: full
      explanation: >-
        The README describes the calendar: every year has 365 days, and in leap years February
        29 is kept and December 31 is dropped.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      Dates are plain SQL dates. No field for the calendar of a source that uses another one.
      Nothing close was found in the schema or the README.
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER has no calendar-of-time-axis field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The calendar of a specific product's time axis is instance-layer representation detail
        outside the conceptual EV/DDI-CDI layer.
