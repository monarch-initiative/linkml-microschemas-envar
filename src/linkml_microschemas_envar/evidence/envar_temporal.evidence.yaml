# Evidence for the slots of envar_temporal.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

temporal_resolution:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml day axis increment = 1.0 (days since 1900-01-01)
      note: >-
        Only derivable from the THREDDS time-axis increment; not written as a discrete resolution
        field.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_name temporal-resolution code (§2.4); inheritable temporal_resolution
      note: >-
        C-HER carries temporal resolution first-class as a code in the table_name pattern
        and as an inheritable lineage field.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No time grain is stated for the indicators. Closest: each release is tied to a set of
      source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No first-class temporal_resolution slot in gaiaCatalog or gaia-db.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS's daily grain is implicit in one-row-per-day, with no resolution field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The native temporal grain of a specific run is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

temporal_aggregation_method:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml long_name / grid name (daily_maximum_temperature)
      note: >-
        The aggregation (daily maximum) is recoverable only from the variable long_name, not
        a structured field.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      Indicators such as extreme heat days and wildfire smoke days are counts over a period, but
      neither the period nor the way of summarising is given. Closest: the indicator list in
      §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      status: verified
    status: unverified
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No aggregation-method slot in gaiaCatalog or gaia-db.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no temporal-aggregation field.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's data-level codes track processing stage, not which statistic summarises a
        sub-period; no aggregation-method field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How sub-period values were aggregated in one run is instance-layer detail outside
        the conceptual EV/DDI-CDI layer.

