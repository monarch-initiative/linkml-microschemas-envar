extraction_window_start:
  supported_by:
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: start_date
      match: partial
      explanation: >-
        The input column `start_date` sets the first day extracted. Missing: it is given per
        input row, not once for the run, and the output keeps only the single dates.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_start_date
      match: partial
      explanation: >-
        Each exposure row has the start of the period it was made for (the value's window cut to
        the residence period). Missing: per row; the window of a join run as a whole is not
        recorded.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus records the product TimeSpan but not the start date this particular run pulled.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's temporal_extent is the dataset's coverage span, not the window an individual
        extraction job pulled.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The window a specific run pulled is instance-layer provenance outside the conceptual
        EV/DDI-CDI layer.

