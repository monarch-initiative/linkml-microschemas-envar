extraction_window_start:
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        gaia-native output collapses per-day to the variable's window-wide validity range;
        the run's actual extraction window start is not recorded.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS writes per-day rows but records no explicit run extraction-window-start field.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus records the product TimeSpan but not the start date this particular run pulled.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's temporal_extent is the dataset's coverage span, not the window an individual
        extraction job pulled.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The window a specific run pulled is instance-layer provenance outside the conceptual
