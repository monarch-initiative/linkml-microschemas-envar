temporal_coverage_start:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_catalog meta_dcat_*.json dct:temporal; gaia_db variable_source.start_date
      evidence: EnVar/examples/heat/COMPARISON.md §H (dataset time-span ✅)
      note: >-
        GAIA records the product time-span via DCAT dct:temporal and variable_source.start_date/end_date.
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml TimeSpan (1979 -> present)
      evidence: EnVar/examples/heat/COMPARISON.md §H (dataset time-span ✅)
      note: >-
        The THREDDS dataset.xml TimeSpan gives the product's full temporal coverage.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_name temporal-extent YYYYMMDDYYYYMMDD (start); inheritable temporal_extent
      note: >-
        C-HER encodes the coverage start in the concatenated temporal-extent code (§2.4) and
        as an inheritable lineage field.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      A release has a year in its name (CHEL 2022, CHEL 2024); the period its values cover is
      not given.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: "Two primary releases are currently defined:"
      status: verified
    status: unverified
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no product coverage-start.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A product's coverage start is instance/discovery-layer detail outside the conceptual
        EV/DDI-CDI layer.

