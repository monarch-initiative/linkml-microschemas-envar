# Evidence for the slots of envar_temporal.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

temporal_resolution:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml day axis increment = 1.0 (days since 1900-01-01)
      note: >-
        Only derivable from the THREDDS time-axis increment; not written as a discrete resolution
        field.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_name temporal-resolution code (§2.4); inheritable temporal_resolution
      note: >-
        C-HER carries temporal resolution first-class as a code in the table_name pattern
        and as an inheritable lineage field.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet weather variables include daily day length
      match: full
      explanation: "The README says the variables are daily; the output has one row per day."
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_template
      source_slot: attr_template.attr_start_date
      match: partial
      explanation: >-
        Every value has its own time window (`attr_start_date`, `attr_end_date`). Missing: the
        grain is not named (daily, monthly); it follows from the length of the window.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No time grain is stated for the indicators. Closest: each release is tied to a set of
      source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The native temporal grain of a specific run is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

temporal_aggregation_method:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml long_name / grid name (daily_maximum_temperature)
      note: >-
        The aggregation (daily maximum) is recoverable only from the variable long_name, not
        a structured field.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: maximum and minimum temperature, and vapor pressure
      match: partial
      explanation: >-
        For temperature the summary over the day is in the variable name (maximum, minimum).
        Missing: nothing for the other variables (precipitation, radiation, vapor pressure).
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      Indicators such as extreme heat days and wildfire smoke days are counts over a period, but
      neither the period nor the way of summarising is given. Closest: the indicator list in
      §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field says how a value summarises its time window (mean, maximum, sum). Closest: the
      free-text description of the variable.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_description
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's data-level codes track processing stage, not which statistic summarises a
        sub-period; no aggregation-method field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How sub-period values were aggregated in one run is instance-layer detail outside
        the conceptual EV/DDI-CDI layer.

temporal_aggregation_window_seconds:
  supported_by:
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml day axis increment = 1.0 (days since 1900-01-01)
      note: >-
        The 1-day window is derivable in the THREDDS time axis but not emitted as an explicit
        seconds value.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      As for `temporal_resolution`: no time grain is stated for the indicators. Closest: each
      release is tied to a set of source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: implicit
    explanation: >-
      The length of the window follows from the two dates of each value; it is not given as a
      number.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_template
      source_slot: attr_template.attr_start_date
      status: verified
    status: unverified
  - source: degauss
    reason: implicit
    explanation: "The window follows from the word daily; no length is given."
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet weather variables include daily day length
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER encodes a temporal-resolution code but not a machine seconds-per-step window.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The numeric aggregation window of one run is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

day_boundary_convention:
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      Periods are dates, and nothing says where a day starts or in which time zone. Closest: the
      exposure datetime columns, which the join fills from the dates.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_start_datetime
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing says when a Daymet day starts and ends. Closest: the README's note on the Daymet
      calendar.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: The Daymet calendar is based on a standard calendar year.
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        The NetCDF time axis (days since 1900-01-01) has no calendar day-edge clarification
        — pure ambiguity.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER has no field for where the 24-hour day window starts.
  - source: codata
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Day-boundary convention is an EnVar-novel commensurability slot no standard carries;
        not merely out-of-layer — genuinely absent.

temporal_coverage_start:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.start_date
      match: full
      explanation: The first date a variable covers.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: startDate
      value: "2022-01-01"
      match: full
      explanation: The value in the public example, per variable.
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml TimeSpan (1979 -> present)
      evidence: EnVar/examples/heat/COMPARISON.md §H (dataset time-span ✅)
      note: >-
        The THREDDS dataset.xml TimeSpan gives the product's full temporal coverage.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_name temporal-extent YYYYMMDDYYYYMMDD (start); inheritable temporal_extent
      note: >-
        C-HER encodes the coverage start in the concatenated temporal-extent code (§2.4) and
        as an inheritable lineage field.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        over continental North America and Hawaii from 1980 and over Puerto Rico from 1950
      match: full
      explanation: >-
        The README gives the first year of the product: 1980, and 1950 for Puerto Rico.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      A release has a year in its name (CHEL 2022, CHEL 2024); the period its values cover is
      not given.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: "Two primary releases are currently defined:"
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A product's coverage start is instance/discovery-layer detail outside the conceptual
        EV/DDI-CDI layer.

