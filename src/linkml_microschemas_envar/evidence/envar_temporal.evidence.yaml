calendar:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: The Daymet calendar is based on a standard calendar year.
      match: full
      explanation: >-
        The README describes the calendar: every year has 365 days, and in leap years February
        29 is kept and December 31 is dropped.
      status: verified
  not_supported_by:
  - source: cher
    reason: implicit
    explanation: 'Dates are ISO 8601, so the calendar is implicitly Gregorian. Closest: the unit of
      the example date column.'
    closest:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.3.3, p. 13
      snippet: Calendar date represented by the aggregated value.
      status: verified
    status: unverified
  - source: amadeus
    reason: implicit
    explanation: 'Dates are R dates, so the calendar is implicitly Gregorian; nothing says so. Closest:
      the `date` argument (format YYYY-MM-DD).'
    closest:
    - type: schema
      document: amadeus-process-gridmet
      locator: arguments
      source_slot: process_gridmet.date
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      Dates are plain SQL dates. No field for the calendar of a source that uses another one.
      Nothing close was found in the schema or the README.
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The calendar of a specific product's time axis is instance-layer representation detail
        outside the conceptual EV/DDI-CDI layer.
