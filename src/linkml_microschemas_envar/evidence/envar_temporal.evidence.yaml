        recorded.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The window a specific run pulled is instance-layer provenance outside the conceptual
        EV/DDI-CDI layer.

