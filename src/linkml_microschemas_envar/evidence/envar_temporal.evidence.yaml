      daily" in the vignette.'
    closest:
    - type: documentation
      document: amadeus-gridmet-vignette
      locator: Available inputs and data availability
      snippet: 'Temporal resolution: daily; each download is an annual NetCDF file for one variable.'
      status: verified
    status: unverified
  - source: chel
