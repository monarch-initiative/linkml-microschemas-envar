crs:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-readme
      locator: Process
      snippet: ensuring a coordinate reference system is present
      match: partial
      explanation: '`process_covariates` makes sure the raster has a CRS, and with `geom` the result
        keeps the CRS of `from`. Missing: the default data.frame result has no CRS.'
      status: verified
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: arguments
      snippet: Should the function return with geometry?
      match: partial
      explanation: '"The coordinate reference system of the sf or SpatVector is that of from." Missing:
        only when geometry is returned.'
      status: verified
  - source: chel
    support:
    - type: output
      document: chel-hex3-grid
      locator: gpkg_geometry_columns
      field: srs_id
      value: "4326"
      match: full
      explanation: >-
        The published grid file records the CRS of its geometry column: `srs_id` 4326, with the
        definition of WGS 84 in `gpkg_spatial_ref_sys` (read with sqlite3). In the grid file
        only; the indicator tables have no geometry.
      status: verified
    - type: documentation
      document: chel-documentation
      locator: "§4.2.1"
      snippet: >-
        all geometries are reprojected into a consistent equal-area CRS (e.g., EPSG:5070)
      match: partial
      explanation: >-
        CHEL names the CRS in which areas are computed. Missing: it is given as an example, and
        it is the CRS of the processing step, not of the published grid.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.srid
      match: full
      explanation: The SRID of the source dataset.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: value
      value: "https://epsg.io/4269"
      match: full
      explanation: >-
        In the public example the spatial reference system is an `additionalProperty` with an
        EPSG URL.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Setting Daymet projection
      match: partial
      explanation: >-
        The code sets the CRS of the Daymet grid (a Lambert conformal conic PROJ string) and
        reads the input coordinates as longitude and latitude. Missing: neither is stated in the
        README or written to the output.
      status: verified
    - type: documentation
      document: degauss-dht-read-lat-lon-csv
      snippet: the crs defaults to 4326
      match: partial
      explanation: >-
        The helper library reads the `lat` and `lon` columns as EPSG:4326. Missing: in the
        documentation of a library function that the daymet container does not call; the daymet
        README and output state no CRS.
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'No CRS is recorded. Closest: the paper says data may be re-projected before conversion
      to H3.'
    closest:
    - type: documentation
      document: cher-arxiv-paper
      locator: Supplement 1
      snippet: This may include re-projecting, converting rasters to tiff
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        CRS of a specific extract is an instance-layer representation detail; the conceptual
        EV/DDI-CDI layer does not carry it.

spatial_extent_bbox:
  supported_by:
  - source: amadeus
    support:
    - type: schema
      document: amadeus-process-gridmet
      locator: arguments
      source_slot: process_gridmet.extent
      match: partial
      explanation: 'The processed raster has an extent. Missing: it is the extent that was loaded (`extent`
        crops it), not the box of the product, and it is not in the extracted result.'
      status: verified
  - source: omop_gaia
    support:
    - type: output
      document: gaiadb-example-jsonld
      field: polygon
      value: >-
        -73.508142 41.237964 -69.928393 41.237964 -69.928393 42.886589 -73.508142 42.886589
        -73.508142 41.237964
      match: full
      explanation: >-
        The public example gives the bounding box of the dataset as a polygon in
        `spatialCoverage`.
      status: verified
  - source: chel
    support:
    - type: output
      document: chel-hex3-grid
      locator: gpkg_contents
      field: min_x
      match: full
      explanation: >-
        The grid file records the bounding box of its layer in `min_x`, `min_y`, `max_x` and
        `max_y`: longitude -179.92 to 178.44, latitude -15.12 to 71.96 (read with sqlite3). It
        is the box of the 929 hexagons, and it is in the grid file only.
      status: verified
  not_supported_by:
  - source: cher
    reason: different_granularity
    explanation: 'The extent is a coded region, not a box. Closest: the spatial extent field.'
    closest:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 7
      snippet: Spatial extent describes the geographic area covered by a resource
      status: verified
    status: unverified
  - source: degauss
    reason: different_concept
    explanation: >-
      The tool has bounding box arguments (`min_lat`, `max_lat`, `min_lon`, `max_lon`), but they
      are the box of the download for one run, not the extent of the product.
    closest:
    - type: schema
      document: degauss-daymet-readme
      locator: Optional Arguments
      source_slot: min_lat
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A product's spatial bounding box is instance/discovery-layer detail outside the conceptual
        EV/DDI-CDI layer.

