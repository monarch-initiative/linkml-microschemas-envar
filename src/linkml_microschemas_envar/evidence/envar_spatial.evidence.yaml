# Evidence for the slots of envar_spatial.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

native_geometry:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.1"
      snippet: The H3 Resolution 3 grid serves as the analytic backbone of CHEL.
      match: full
      explanation: >-
        CHEL states the geometry its tables are delivered on, H3 hexagons. For its own inputs,
        the lineage table (§2.7) has a Native Geometry column.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.geom_type
      match: full
      explanation: The geometry type of the source dataset.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: termCode
      value: multipolygon
      match: full
      explanation: >-
        In the public example the data structure (vector) and the geometry (multipolygon) are
        given as terms of `measurementTechnique`.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml gridDataset/gridSet
      note: >-
        Only implied by the THREDDS gridDataset/gridSet structure; never written as a geometry
        type in the output.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_name spatial-res code prefix (m/k/h/c/t/b/s/z)
      note: >-
        The resolution code prefix separates grid (m/k), H3 (h) and polygon (tract/block/ZIP)
        layouts (§2.3); it has no line or point code.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: the four nearest Daymet 1 km x 1 km raster cell numbers
      match: full
      explanation: The README says the source is a raster of 1 km x 1 km cells.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Source geometry of a specific product is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

h3_resolution:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: >-
        CHEL adopts H3 Resolution 3 (Hex3), in which each cell has an approximate area of 12,000
        square kilometers.
      match: full
      explanation: "The H3 resolution is stated: 3."
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_name spatial-res code (e.g. h08)
      note: C-HER encodes the H3 resolution in the table_name code (§2.3).

native_spatial_resolution_m:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.4"
      snippet: >-
        CHEL uses the Gridded Population of the World (GPW v4) raster at 2.5 arc-minute
        resolution.
      match: partial
      explanation: >-
        CHEL gives the cell size of its one raster input. Missing: in arc-minutes, not metres.
        CHEL's own tables are on H3 cells, for which the slot does not apply.
      status: verified
    - type: documentation
      document: chel-wiki-home
      locator: "3. Spatial Framework and Grid Selection"
      snippet: "Edge length: ~59.8 km"
      match: partial
      explanation: >-
        The wiki gives the approximate size of a Hex3 cell (edge about 59.8 km, area about
        12,000 km²). Missing: approximate and in km, and the slot is defined for regular grids,
        not for H3 cells.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_dataset.xml axis lat/lon increment (0.041666 deg)
      note: >-
        Only derivable from the grid-axis increment in thredds_dataset.xml; never written
        as a resolution number in metres.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: table_name spatial-res code (e.g. m30, k05, h08)
      note: >-
        C-HER encodes native spatial resolution first-class in the table_name pattern (§2.3
        metric/H3 codes) and as the inheritable spatial_resolution field.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: produced on a 1 km x 1 km gridded surface
      match: full
      explanation: "The cell size of the source is stated: 1 km."
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for the cell size of a raster source. Closest: the geometry type of the dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.geom_type
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        CODATA EVs / DDI-CDI operate at the conceptual/represented layer; native grid resolution
        of one run is instance-layer detail deliberately outside their scope.

native_spatial_resolution_descriptor:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§5.2.1"
      snippet: Resolution 3 (Hex3) continues to serve as the base analytic geography.
      match: full
      explanation: "CHEL has a readable label for its resolution: H3 Resolution 3, or Hex3."
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_name spatial-res code prefix (m/k/h/c/t/b/s/z)
      note: >-
        The spatial-resolution code prefix distinguishes grid (m/k), H3 (h), and polygon (tract/block/ZIP)
        layouts (§2.3), a coded rather than free-text descriptor.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: produced on a 1 km x 1 km gridded surface
      match: full
      explanation: >-
        The README has a readable label for the resolution: a 1 km x 1 km gridded surface.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No resolution-layout label is emitted; only a derivable axis increment exists.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Resolution-layout description of a specific product is instance-layer detail outside
        the conceptual EV/DDI-CDI layer.
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for a readable resolution label. Closest: the geometry type of the dataset; in
      the public example the unit (tracts) is only part of the dataset name.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.geom_type
      status: verified
    status: unverified

crs:
  supported_by:
  - source: chel
    support:
    - type: output
      document: chel-hex3-grid
      locator: gpkg_geometry_columns
      field: srs_id
      value: "4326"
      match: full
      explanation: >-
        The published grid file records the CRS of its geometry column: `srs_id` 4326, with the
        definition of WGS 84 in `gpkg_spatial_ref_sys` (read with sqlite3). In the grid file
        only; the indicator tables have no geometry.
      status: verified
    - type: documentation
      document: chel-documentation
      locator: "§4.2.1"
      snippet: >-
        all geometries are reprojected into a consistent equal-area CRS (e.g., EPSG:5070)
      match: partial
      explanation: >-
        CHEL names the CRS in which areas are computed. Missing: it is given as an example, and
        it is the CRS of the processing step, not of the published grid.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.srid
      match: full
      explanation: The SRID of the source dataset.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: value
      value: "https://epsg.io/4269"
      match: full
      explanation: >-
        In the public example the spatial reference system is an `additionalProperty` with an
        EPSG URL.
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml coordinate_system = "WGS84,EPSG:4326"
      evidence: EnVar/examples/heat/COMPARISON.md §C (CRS of source raster ✅)
      note: >-
        Amadeus's THREDDS grid declares the raster CRS explicitly as an EPSG code.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Setting Daymet projection
      match: partial
      explanation: >-
        The code sets the CRS of the Daymet grid (a Lambert conformal conic PROJ string) and
        reads the input coordinates as longitude and latitude. Missing: neither is stated in the
        README or written to the output.
      status: verified
    - type: documentation
      document: degauss-dht-read-lat-lon-csv
      snippet: the crs defaults to 4326
      match: partial
      explanation: >-
        The helper library reads the `lat` and `lon` columns as EPSG:4326. Missing: in the
        documentation of a library function that the daymet container does not call; the daymet
        README and output state no CRS.
      status: verified
  not_supported_by:
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's metadata model (table_dictionary / column dictionary) documents spatial extent/resolution
        codes but no per-resource CRS/EPSG field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        CRS of a specific extract is an instance-layer representation detail; the conceptual
        EV/DDI-CDI layer does not carry it.

spatial_extent_bbox:
  supported_by:
  - source: omop_gaia
    support:
    - type: output
      document: gaiadb-example-jsonld
      field: polygon
      value: >-
        -73.508142 41.237964 -69.928393 41.237964 -69.928393 42.886589 -73.508142 42.886589
        -73.508142 41.237964
      match: full
      explanation: >-
        The public example gives the bounding box of the dataset as a polygon in
        `spatialCoverage`.
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: thredds_dataset.xml projectionBox + LatLonBox (CONUS bbox)
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §G (source-dataset spatial coverage ✅)
      note: >-
        The THREDDS dataset.xml gives the product footprint as projectionBox and LatLonBox.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_name spatial-extent code (Gxx/Txx/Cxx/sxx/bxx/cdX)
      note: >-
        C-HER encodes spatial extent as a coded region (§2.2), not a numeric min/max bounding
        box.
  - source: chel
    support:
    - type: output
      document: chel-hex3-grid
      locator: gpkg_contents
      field: min_x
      match: full
      explanation: >-
        The grid file records the bounding box of its layer in `min_x`, `min_y`, `max_x` and
        `max_y`: longitude -179.92 to 178.44, latitude -15.12 to 71.96 (read with sqlite3). It
        is the box of the 929 hexagons, and it is in the grid file only.
      status: verified
  not_supported_by:
  - source: degauss
    reason: different_concept
    explanation: >-
      The tool has bounding box arguments (`min_lat`, `max_lat`, `min_lon`, `max_lon`), but they
      are the box of the download for one run, not the extent of the product.
    closest:
    - type: schema
      document: degauss-daymet-readme
      locator: Optional Arguments
      source_slot: min_lat
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A product's spatial bounding box is instance/discovery-layer detail outside the conceptual
        EV/DDI-CDI layer.

spatial_extent_descriptor:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: Computational feasibility for national-scale datasets
      match: partial
      explanation: >-
        CHEL describes itself as national in scale. Missing: which states and territories the
        tables include is not said.
      status: verified
    - type: documentation
      document: chel-wiki-home
      locator: "1. Introduction"
      snippet: across the continental United States
      match: partial
      explanation: >-
        The wiki gives the extent in words. Missing: the bounding box in the grid file reaches
        further (to 15°S and across 180° longitude), and no text says which territories are
        included.
      status: verified
  - source: omop_gaia
    support:
    - type: output
      document: gaiadb-example-jsonld
      field: name
      value: Massachusetts
      match: full
      explanation: >-
        The public example names the covered place in `spatialCoverage`, with its GeoNames id.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        spatial-extent code prefix (Gxx=global, Txx=US+Terr, Cxx=CONUS, sxx=state)
      note: >-
        The coded spatial-extent prefix conveys a controlled-vocabulary extent label (§2.2)
        rather than free-text prose.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        over continental North America and Hawaii from 1980 and over Puerto Rico from 1950
      match: full
      explanation: The README describes the extent of the product in words.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries a numeric bbox (projectionBox/LatLonBox) but no human-readable extent
        description.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Human-readable extent of a specific product is instance/discovery-layer detail outside
        the conceptual layer.

extraction_method:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.2"
      snippet: To harmonize these with the hex grid, CHEL uses area-weighted interpolation.
      match: full
      explanation: >-
        Part 3 states the operator per kind of input: area-weighted interpolation (§3.2),
        area-proportional allocation of counts (§3.3), density and intersection proportion
        (§3.4), raster sum (§3.5).
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: >-
        A weighted average of the Daymet weather variable values within these four nearest
        raster cells is then calculated to provide the final Daymet weather variable estimate
      match: full
      explanation: >-
        The README states the extraction rule: the inverse-distance weighted average of the four
        nearest cells.
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-readme
      locator: Raster Sources
      snippet: the value of the cell containing the location
      match: full
      explanation: >-
        The README defines the methods (for rasters: point, buffer mean, class fraction; for
        points: nearest and inverse-distance weighted), and the join writes the method used to
        each exposure row.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no extraction-method field.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's data-level codes track processing stage, not the point-to-cell extraction
        rule; no extraction-method field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How a value was extracted from a grid is instance-layer provenance the conceptual
        EV/DDI-CDI layer deliberately omits.

target_geography_type:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.1"
      snippet: >-
        Hex3 is the spatial unit at which all environmental, social, health, and climate
        indicators are ultimately expressed.
      match: full
      explanation: Every value is attached to an H3 cell of resolution 3.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.location
      source_slot: location.geom
      match: partial
      explanation: >-
        Values are attached to a location, which the schema defines as a point. Missing: no
        field for the kind of target; it is always the location point.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: spatial-res code (c/t/b/z/h) + column_tag Spatial – Primary
      note: >-
        C-HER's spatial-resolution code names the geographic unit (county/tract/block group/ZCTA/H3)
        and column_tag flags the spatial-primary column (§2.3, §6.1).
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: is linked to coordinate data within the
      match: full
      explanation: Values are attached to a point, the coordinate of each input row.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus collapses to lat/lon at the THREDDS request with no geography-type field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The target geographic unit of a specific value is instance-layer detail outside the
        conceptual EV/DDI-CDI layer.

spatial_aggregation_preserves:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.10"
      snippet: >-
        All CHEL aggregation can be expressed as a mapping from values defined on a source
        support to a target support (Hex3).
      match: full
      explanation: >-
        §3.10 lists the four quantities an operator can preserve (mean intensity, totals,
        occurrence intensity, areal coverage) and chooses the operator by them. The slot's
        values were taken from this section.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      gaiaDB aggregates (buffer mean, class fraction), but nothing says which quantity an
      operator is meant to preserve. Closest: the README's definition of the buffer mean.
    closest:
    - type: documentation
      document: gaiadb-readme
      locator: Raster Sources
      snippet: the mean of the cells whose centre is within
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus records no preserved-quantity of any spatial aggregation.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER captures resolution and data-level but not which quantity a re-gridding operator
        preserves.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The preserved quantity of an aggregation is instance-layer methodological detail outside
        the conceptual EV/DDI-CDI layer.
