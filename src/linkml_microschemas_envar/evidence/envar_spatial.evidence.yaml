# Evidence for the slots of envar_spatial.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

native_geometry:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 7
      snippet: Spatial resolution refers to how the resource is organized geographically.
      match: partial
      explanation: 'The resolution code tells grid (m30), H3 (h08), polygons (c00, t00) and points (pnt)
        apart. Missing: of the resource, and not as a geometry type.'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-readme
      locator: Process
      snippet: ensuring a coordinate reference system is present
      match: partial
      explanation: '`process_covariates` returns a SpatRaster for gridded data and a SpatVector for
        vector data, so the geometry kind is the class of the object. Missing: it is not stated as a
        geometry type.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.1"
      snippet: The H3 Resolution 3 grid serves as the analytic backbone of CHEL.
      match: full
      explanation: >-
        CHEL states the geometry its tables are delivered on, H3 hexagons. For its own inputs,
        the lineage table (§2.7) has a Native Geometry column.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.geom_type
      match: full
      explanation: The geometry type of the source dataset.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: termCode
      value: multipolygon
      match: full
      explanation: >-
        In the public example the data structure (vector) and the geometry (multipolygon) are
        given as terms of `measurementTechnique`.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: the four nearest Daymet 1 km x 1 km raster cell numbers
      match: full
      explanation: The README says the source is a raster of 1 km x 1 km cells.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Source geometry of a specific product is instance-layer detail outside the conceptual
        EV/DDI-CDI layer.

h3_resolution:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 7
      snippet: H3 resolution 8
      match: full
      explanation: The spatial resolution code gives the H3 resolution (h08 = H3 resolution 8).
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: >-
        CHEL adopts H3 Resolution 3 (Hex3), in which each cell has an approximate area of 12,000
        square kilometers.
      match: full
      explanation: "The H3 resolution is stated: 3."
      status: verified

native_spatial_resolution_m:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.2.1, p. 7
      snippet: Spatial resolution m30
      match: partial
      explanation: 'Grid resolutions are coded in metres (m30 = 30 m grid). Missing: of the resource,
        which may have been converted from the source grid.'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-download-gridmet
      locator: Details
      snippet: approximately 4-km grid
      match: partial
      explanation: 'The help page gives the gridMET grid as approximately 4 km. Missing: approximate,
        in km, and in a paragraph on SPEI; the processed raster has the resolution in degrees.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.4"
      snippet: >-
        CHEL uses the Gridded Population of the World (GPW v4) raster at 2.5 arc-minute
        resolution.
      match: partial
      explanation: >-
        CHEL gives the cell size of its one raster input. Missing: in arc-minutes, not metres.
        CHEL's own tables are on H3 cells, for which the slot does not apply.
      status: verified
    - type: documentation
      document: chel-wiki-home
      locator: "3. Spatial Framework and Grid Selection"
      snippet: "Edge length: ~59.8 km"
      match: partial
      explanation: >-
        The wiki gives the approximate size of a Hex3 cell (edge about 59.8 km, area about
        12,000 km²). Missing: approximate and in km, and the slot is defined for regular grids,
        not for H3 cells.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: produced on a 1 km x 1 km gridded surface
      match: full
      explanation: "The cell size of the source is stated: 1 km."
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for the cell size of a raster source. Closest: the geometry type of the dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.geom_type
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        CODATA EVs / DDI-CDI operate at the conceptual/represented layer; native grid resolution
        of one run is instance-layer detail deliberately outside their scope.

