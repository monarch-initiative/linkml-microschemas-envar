spatial_aggregation_preserves:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: Supplement 1
      snippet: counts, averages, and per-capita values are structurally similar but require different
        H3 conversion strategies.
      match: partial
      explanation: 'The paper says counts and averages need different conversions (Tobler''s intensive
        and extensive options). Missing: not recorded per resource.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.10"
      snippet: >-
        All CHEL aggregation can be expressed as a mapping from values defined on a source
        support to a target support (Hex3).
      match: full
      explanation: >-
        §3.10 lists the four quantities an operator can preserve (mean intensity, totals,
        occurrence intensity, areal coverage) and chooses the operator by them. The slot's
        values were taken from this section.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: implicit
    explanation: 'The summary function is given (default mean), but not what it is meant to preserve.
      Closest: the `fun` argument.'
    closest:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: arguments
      snippet: Function used to summarize multiple raster cells
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      gaiaDB aggregates (buffer mean, class fraction), but nothing says which quantity an
      operator is meant to preserve. Closest: the README's definition of the buffer mean.
    closest:
    - type: documentation
      document: gaiadb-readme
      locator: Raster Sources
      snippet: the mean of the cells whose centre is within
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The preserved quantity of an aggregation is instance-layer methodological detail outside
        the conceptual EV/DDI-CDI layer.
