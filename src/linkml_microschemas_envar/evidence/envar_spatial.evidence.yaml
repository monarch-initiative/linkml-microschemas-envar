extraction_method:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-arxiv-paper
      locator: §2.2
      snippet: convert exposure values from the native grid to the hex8 grid using a spatially weighted
        average.
      match: partial
      explanation: 'The paper describes how values are moved to hex8 (area-weighted average, and other
        methods in Supplement 1). Missing: in the paper; per resource only in free-text lineage notes
        such as "County values aggregated to H3 cells".'
      status: verified
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-calculate-gridmet
      locator: arguments
      snippet: Function used to summarize multiple raster cells
      match: partial
      explanation: 'Points get the value of the cell they fall in (radius 0), buffers and polygons the
        summary `fun` (default mean) over the cells. Missing: the method is not named and not recorded
        in the result.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.2"
      snippet: To harmonize these with the hex grid, CHEL uses area-weighted interpolation.
      match: full
      explanation: >-
        Part 3 states the operator per kind of input: area-weighted interpolation (§3.2),
        area-proportional allocation of counts (§3.3), density and intersection proportion
        (§3.4), raster sum (§3.5).
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Geomarker Methods
      snippet: >-
        A weighted average of the Daymet weather variable values within these four nearest
        raster cells is then calculated to provide the final Daymet weather variable estimate
      match: full
      explanation: >-
        The README states the extraction rule: the inverse-distance weighted average of the four
        nearest cells.
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-readme
      locator: Raster Sources
      snippet: the value of the cell containing the location
      match: full
      explanation: >-
        The README defines the methods (for rasters: point, buffer mean, class fraction; for
        points: nearest and inverse-distance weighted), and the join writes the method used to
        each exposure row.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        How a value was extracted from a grid is instance-layer provenance the conceptual
        EV/DDI-CDI layer deliberately omits.

