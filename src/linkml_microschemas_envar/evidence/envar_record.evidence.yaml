# Evidence for the slots of envar_record.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

subject_type:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.1"
      snippet: >-
        Hex3 is the spatial unit at which all environmental, social, health, and climate
        indicators are ultimately expressed.
      match: partial
      explanation: >-
        CHEL says that a row of its indicator tables is a hexagon, not a person. Missing: stated
        in prose only; no field says whether a row is a hexagon or a participant.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.location_history
      source_slot: location_history.domain_id
      match: full
      explanation: >-
        `domain_id` says what kind of entity (a person, a care site) the `entity_id` of a
        location period is. The join writes `person_id` only for the person domain.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        ORNL/TM-2026/4743 (doi:10.2172/3451859) spatial resolution code; Spatial Primary column
        tag (§2.3.2)
      note: >-
        The spatial resolution code gives the geographic unit (c00 is county-level data),
        but no field declares the subject kind.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: DDI-CDI 1.0 UnitType (Conceptual package)
      note: >-
        UnitType states the class of unit, for example Person or State, at the conceptual
        layer; it does not declare one delivered record's subject.
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      The tools keep the user's `id` column; nothing says what an id identifies (a person, a
      visit, an address).
    closest:
    - type: output
      document: degauss-daymet-output
      field: id
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: amadeus R/utils-calculate.R locs_id, version 2.1.2
      note: >-
        Amadeus output keeps a location identifier (locs_id) and does not declare whether
        it stands for a patient, a cohort or a geographic unit.

variable_identity:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.3.1"
      snippet: "Air pollution indicators include:"
      match: partial
      explanation: >-
        §2.3 to §2.6 name the indicators by domain. Missing: names only. No unit, no standard
        name and no vocabulary term per indicator, and the names are not tied to the column
        codes.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_name
      match: full
      explanation: >-
        `variable_source` describes each variable: name, description, property id, data type,
        unit, value range and concept ids.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml long_name/standard_name/description + gridmet_tmmx.cf_metadata.json
        units
      note: >-
        Amadeus carries a CF-style blob (long_name, units K), but standard_name is overloaded
        with the gridMET shortcode, not a real CF term. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_tag=Value + column_unit_id (+ planned ontology tag)
      note: >-
        C-HER tags a Value column with a unit and (planned) ontology tag, but carries no CF
        standard name / cell-methods identity.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        Daymet weather variables include daily day length, precipitation, shortwave radiation,
        snow water equivalent, maximum and minimum temperature, and vapor pressure
      match: partial
      explanation: >-
        The README names each variable and its column. Missing: no unit, no standard name and no
        vocabulary term.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Variable identity is exactly the conceptual/represented layer CODATA EVs occupy, but
        as a conceptual framework it is excluded from instance-layer scoring.

spatial_reference:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: >-
        CHEL adopts H3 Resolution 3 (Hex3), in which each cell has an approximate area of 12,000
        square kilometers.
      match: partial
      explanation: >-
        Geometry and resolution (§1.3, §2.2.1), the aggregation operators (Part 3) and the
        processing CRS (§4.2.1) are described. Missing: no bounding box, and the CRS of the
        published hex grid is not stated.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.srid
      match: partial
      explanation: >-
        A dataset has its CRS (`srid`), geometry type and spatial coverage, and each exposure
        row says how it was joined. Missing: no cell size or resolution of the source.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        produced on a 1 km x 1 km gridded surface over continental North America and Hawaii
      match: partial
      explanation: >-
        Grid, cell size and extent of the source are stated, and Geomarker Methods describes the
        extraction. Missing: the CRS is only in the code, and nothing of this is written to the
        output.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml coordinate_system=WGS84,EPSG:4326 + axis lat/lon increment + projectionBox/LatLonBox
      note: >-
        Amadeus declares source-raster CRS and bbox and grid increment, but no extraction-method
        slot and resolution is only derivable. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_name spatial extent + spatial resolution codes (e.g. h08 / k05 / m30); column_tag
        Spatial-Primary
      note: >-
        C-HER encodes spatial extent and organisation resolution in the table_name and tags
        spatial columns, but carries no per-value extraction method or CRS field. Conservative:
        partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Extraction geometry is instance-layer; out of scope for CODATA's conceptual framework.

temporal_reference:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.start_date
      match: partial
      explanation: >-
        A variable has the period it covers, and each value its own time window. Missing: no
        field for the time grain, the aggregation over the window or the day boundary.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml day axis (days since 1900-01-01, calendar=gregorian) + TimeSpan;
        long_name daily_maximum_temperature
      note: >-
        Amadeus carries time-origin, calendar, and dataset span, and aggregation is encoded
        only in the long_name; day-boundary is pure ambiguity. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_name temporal extent (YYYYMMDDYYYYMMDD) + temporal resolution code; column_tag
        Temporal-Primary
      note: >-
        C-HER encodes temporal extent and resolution in the table_name and tags temporal columns,
        but carries no aggregation-method or day-boundary-convention field. Conservative:
        partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: The Daymet calendar is based on a standard calendar year.
      match: partial
      explanation: >-
        The README states that the variables are daily, the years covered and the 365-day
        calendar. Missing: where a day starts, and the aggregation for the variables other than
        maximum and minimum temperature.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No time grain, temporal aggregation or covered period is stated for the indicators.
      Closest: each release is tied to a set of source data vintages.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.1"
      snippet: >-
        Each release corresponds to a specific set of source data vintages and reference
        geometries.
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Temporal-aggregation semantics are instance-layer; out of scope for CODATA.

exposure_model:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.3.1"
      snippet: >-
        These measures are typically modeled and reported at census tract level or fine modeled
        grids.
      match: partial
      explanation: >-
        CHEL says that its air pollution inputs are modeled and describes its own aggregation in
        Part 3. Missing: model type, inputs, methods paper and skill of the source models are
        not passed on.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_dictionary.data_level codes (dXX calculated / mXX modeled) + description/notes
      note: >-
        C-HER's data_level codes signal that a resource is calculated or modeled, but do not
        carry a structured exposure-model type or inputs. Conservative: partial.
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing about the Daymet model (type, inputs, paper, skill) is passed on. Closest: the
      README's links to the Daymet documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus records no exposure-model type or model description.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Exposure-model identity is instance-layer; out of scope for CODATA.
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      `data_source` has a field `measurement_technique`, but in the catalogue it says how the
      data are represented (raster, vector), not how the values were modelled. Model type,
      inputs and skill have no field.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.measurement_technique
      status: verified
    status: unverified

data_layout:
  supported_by:
  - source: chel
    support:
    - type: output
      document: chel-hex3-2024
      field: hex_id
      value: "696"
      match: partial
      explanation: >-
        The published tables have the key column `hex_id` and one column per indicator, and the
        README joins them to the grid on `hex_id`. Missing: no data dictionary; the columns are
        not described.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.value_as_number
      match: full
      explanation: >-
        The output table has a fixed definition: person, period, value, unit and the source
        value that identifies the variable.
      status: verified
  - source: degauss
    support:
    - type: output
      document: degauss-daymet-output
      field: date
      value: "2022-07-15"
      match: partial
      explanation: >-
        The output is the input table with one row per id and date and one added column per
        Daymet variable; the README lists the input columns and the added ones. Missing: no
        machine-readable description of the columns.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        gridmet_tmmx.csv columns person_loc_id / lat / lon / value_kelvin / value_celsius
        (implicit layout)
      note: >-
        Amadeus's CSV has value/subject columns but no portable sidecar column-binding document.
        Conservative: partial.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_column_dictionary (column_name, description, column_tag Index/Value/Temporal/Spatial,
        column_unit)
      note: >-
        C-HER's column dictionary is a first-class, portable per-column layout with a role
        tag and unit for every column — the closest analogue to the sidecar's data-layout
        block.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Companion-file column binding is instance/packaging-layer; out of scope for CODATA.

source_dataset:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.7, Input Lineage Table"
      snippet: "EJI 2022 | Census Tract | Environmental burden inputs (2022 release)"
      match: partial
      explanation: >-
        The table gives each input's name, release, native geometry, role and a web link.
        Missing: licence, DOI and citation of the inputs.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.dataset_name
      match: full
      explanation: >-
        `data_source` describes each source dataset: name, version, description, creator,
        provider, licence, coverage, dates and URL.
      status: verified
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_dictionary (dataset, doi, rights, resource_type/format, contributors) + version
        + source_update_frequency
      note: >-
        C-HER's table_dictionary and its foreign-key vocabularies identify the source dataset
        first-class (dataset, rights, DOI, contributors, version).
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        over continental North America and Hawaii from 1980 and over Puerto Rico from 1950
        through the end of the most recent full calendar year
      match: partial
      explanation: >-
        The README names the source (Daymet), links its user guide and project page, and gives
        its coverage and cell size. Missing: the version is only visible in a link, no DOI,
        licence or citation, and nothing in the output.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no dataset-identity metadata (no name, DOI, license, publisher) natively.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Dataset identity/discovery is catalogue-layer; CODATA operates at the conceptual variable
        layer and is out of scope for scoring.

uncertainty:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.3"
      snippet: >-
        For percentile ranking, null values are excluded from ranking denominator N unless
        otherwise documented.
      match: partial
      explanation: >-
        CHEL describes how missing values are treated. Missing: no per-value uncertainty and no
        skill statistics; §4.6.4 only says that the modeled inputs are uncertain.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        C-HER null taxonomy (structural/derived null) + data_level QA codes (aXX/bXX)
      note: >-
        C-HER classifies null cells and encodes QA level, but carries no per-value uncertainty
        or completeness percentage. Conservative: partial.
  not_supported_by:
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for the uncertainty of a value or of a source model. Nothing close was found in
      the schema or the README.
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No uncertainty of any kind is passed on or computed. Nothing close was found in the daymet
      README, entrypoint.R or the example output.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no uncertainty block; only a _FillValue sentinel.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Per-value uncertainty is instance-layer; out of scope for CODATA.

linkage_method:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.2.1"
      snippet: >-
        It is also the geography used for participant linkage after privacy logic is applied.
      match: partial
      explanation: >-
        CHEL describes the linkage (participant point to Hex3 cell, §4.5.2) and the privacy
        reassignment applied with it. Missing: precision and score of the geocodes, and how a
        participant's location over time is handled.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_relationship_concept_id
      match: partial
      explanation: >-
        Each exposure row says how it was joined, and the residence periods come from
        `location_history`. Missing: nothing about the quality or origin of the geocodes.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-readme
      locator: Using
      snippet: The method/precision of the geocode.
      match: full
      explanation: >-
        The geocoder documents and writes precision, score, result and the matched address for
        every row, its README names the address database, and the daymet README says how values
        are attached to the coordinate.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary reference_column_id + column_tag Foreign Reference / Spatial-Primary
        (cross-table join descriptors)
      note: >-
        C-HER models cross-table join references and spatial-column tags, but no patient-to-place
        linkage-strategy field. Conservative: partial.
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus collapses the address to lat/lon at the THREDDS request and records no linkage/geocoding
        quality.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Patient-to-place linkage is instance-layer; out of scope for CODATA.

tool_run:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.created_at
      match: partial
      explanation: >-
        Rows have the time they were written, and the join method is on each exposure row.
        Missing: no name or version of the software, no hashes and no row counts.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-geocoder-readme
      locator: Optional Argument
      snippet: >-
        This threshold can be changed by including an optional argument in the docker call
      match: partial
      explanation: >-
        The geocoder writes its name, version and argument into the output file name
        (`..._geocoder_3.4.2_score_threshold_0.5.csv`), and both READMEs give the image to run.
        Missing: no image digest, run time, hashes or row counts, and the daymet container adds
        only `_daymet` to the name.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_response_headers.json HTTP Date header (run timestamp only)
      note: >-
        Amadeus records only the HTTP Date header; no tool name/version, container, run args,
        or hashes natively. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_dictionary.metadata_created_at/updated_at + uploaded_by + version
      note: >-
        C-HER records registration time, uploader, and version, but no per-run producing-tool
        name/version, container digest, args, or hashes. Conservative: partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Tool-run provenance is instance-layer; out of scope for CODATA.
  - source: chel
    reason: not_recorded
    explanation: >-
      No run of the pipeline is described: no software name or version, no run date, no hashes.
      Closest: §5.5 lists what a release should document, including Foundry dataset references.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Foundry dataset references (RID)
      status: verified
    status: unverified

provenance_chain:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.1"
      snippet: "Every input entering CHEL follows a defined lineage pathway:"
      match: partial
      explanation: >-
        CHEL gives the ordered stages every input passes through (source, cleaning, spatial
        harmonization, hex aggregation, normalization, module assignment). Missing: the stages
        are generic; no tool, version or date per step.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.etl_metadata
      match: partial
      explanation: >-
        The ETL steps of a dataset (download from the source, the tool used, the result) are
        kept from the `about` part of its JSON-LD. Missing: they describe the ETL of the dataset
        as planned, not runs: no time or version per step, and the join is not part of it.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage (parent-child links) + lineage_notes
      note: >-
        C-HER's dataset_lineage links parent and child resources, but is a dataset-lineage
        graph, not an ordered per-run W3C-PROV chain. Conservative: partial.
  not_supported_by:
  - source: degauss
    reason: implicit
    explanation: >-
      Each container appends its name to the output file name (the geocoder also its version and
      argument), so the sequence of runs can be read from the name. DeGAUSS does not describe
      this as a chain, and there is no record per step.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no ordered upstream-run chain.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Ordered tool-run provenance is instance-layer; out of scope for CODATA.

