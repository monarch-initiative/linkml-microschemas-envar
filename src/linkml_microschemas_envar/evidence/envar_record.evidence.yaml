  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Health-layer linkage hooks are instance/integration-layer; out of scope for CODATA.

delivered_resource:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: "§1, p. 4"
      snippet: >-
        Each resource has its own identifier and metadata entry, but all of those resources
        can still be associated with the same source dataset.
      match: full
