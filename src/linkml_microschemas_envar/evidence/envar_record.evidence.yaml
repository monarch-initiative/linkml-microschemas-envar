# Evidence for the slots of envar_record.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

subject_type:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL data/CHEL_hex3_*.csv hex_id; README.md participant_id
      note: >-
        The key column implies the subject (hex_id in the released tables, participant_id
        in the linkage example), but no field states it.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: external_exposure.person_id; location_history.domain_id/entity_id
      note: >-
        person_id makes every exposure row person-level and location_history.domain_id types
        the entity, but no subject-type field exists.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        ORNL/TM-2026/4743 (doi:10.2172/3451859) spatial resolution code; Spatial Primary column
        tag (§2.3.2)
      note: >-
        The spatial resolution code gives the geographic unit (c00 is county-level data),
        but no field declares the subject kind.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: DDI-CDI 1.0 UnitType (Conceptual package)
      note: >-
        UnitType states the class of unit, for example Person or State, at the conceptual
        layer; it does not declare one delivered record's subject.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: output CSV id column (daymet 1.0.0 README.md)
      note: >-
        DeGAUSS keeps the user's own id column and has no field saying what the id identifies.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: amadeus R/utils-calculate.R locs_id, version 2.1.2
      note: >-
        Amadeus output keeps a location identifier (locs_id) and does not declare whether
        it stands for a patient, a cohort or a geographic unit.

variable_identity:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md (indicator names; no substance vocabulary)
      note: >-
        CHEL carries indicator names but no environmental-substance vocabulary; the exposure
        concept is unfilled (EnVar-Tracker #38). Conservative: partial.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db variable_source.variable_name/variable_description + JSON-LD variableMeasured.propertyID
        (NERC air_temperature); unit_concept_id 8653
      note: >-
        Gaia carries variable name, description, unit, and a CF-mirror propertyID, but CF
        cell_methods has no slot. Conservative: partial.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml long_name/standard_name/description + gridmet_tmmx.cf_metadata.json
        units
      note: >-
        Amadeus carries a CF-style blob (long_name, units K), but standard_name is overloaded
        with the gridMET shortcode, not a real CF term. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_tag=Value + column_unit_id (+ planned ontology tag)
      note: >-
        C-HER tags a Value column with a unit and (planned) ontology tag, but carries no CF
        standard name / cell-methods identity.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Variable identity is implicit in the column header tmax with no CF standard name,
        cell methods, or unit annotation.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Variable identity is exactly the conceptual/represented layer CODATA EVs occupy, but
        as a conceptual framework it is excluded from instance-layer scoring.

spatial_reference:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: >-
        CHEL Documentation.md §1.3/§4.2.1/Part 3 (hex resolution, CRS, aggregation)
      note: >-
        The spatial block is where CHEL is strongest: fixed hex resolution, equal-area CRS,
        and explicit aggregation operators are all first-class.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db location.geom EPSG:4326 / data_source.srid; meta_etl_*.json epsg / extent;
        data_source.spatial_coverage
      note: >-
        Gaia carries CRS/SRID and dataset spatial coverage, but has no first-class native-resolution
        or extraction-method slot. Conservative: partial.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: lat / lon columns on the geocoded CSV (implicit WGS84)
      note: >-
        DeGAUSS carries coordinates but no explicit CRS, native resolution, or extraction
        method.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml coordinate_system=WGS84,EPSG:4326 + axis lat/lon increment + projectionBox/LatLonBox
      note: >-
        Amadeus declares source-raster CRS and bbox and grid increment, but no extraction-method
        slot and resolution is only derivable. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_name spatial extent + spatial resolution codes (e.g. h08 / k05 / m30); column_tag
        Spatial-Primary
      note: >-
        C-HER encodes spatial extent and organisation resolution in the table_name and tags
        spatial columns, but carries no per-value extraction method or CRS field. Conservative:
        partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Extraction geometry is instance-layer; out of scope for CODATA's conceptual framework.

temporal_reference:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db variable_source.start_date/end_date; meta_dcat_*.json dct:temporal
      note: >-
        Gaia carries the dataset time span but has no first-class temporal-resolution, aggregation-method,
        or day-boundary slot. Conservative: partial.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml day axis (days since 1900-01-01, calendar=gregorian) + TimeSpan;
        long_name daily_maximum_temperature
      note: >-
        Amadeus carries time-origin, calendar, and dataset span, and aggregation is encoded
        only in the long_name; day-boundary is pure ambiguity. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_name temporal extent (YYYYMMDDYYYYMMDD) + temporal resolution code; column_tag
        Temporal-Primary
      note: >-
        C-HER encodes temporal extent and resolution in the table_name and tags temporal columns,
        but carries no aggregation-method or day-boundary-convention field. Conservative:
        partial.
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: CHEL Documentation.md (spatial-only; start_date only)
      note: >-
        CHEL is spatial-only; it carries participant start_date but no temporal-aggregation
        semantics.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Temporal resolution is implicit (one row per day); aggregation method and day boundary
        are absent.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Temporal-aggregation semantics are instance-layer; out of scope for CODATA.

exposure_model:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: >-
        CHEL Documentation.md Part 3 / Part 4 (aggregation explicit; source model inherited)
      note: >-
        CHEL makes the aggregation operator explicit but inherits the source exposure model
        from EJI and validates only its own geometry. Conservative: partial.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db data_source.measurement_technique + meta_dcat_*.json measurementTechnique
        (free-text)
      note: >-
        Gaia carries a free-text method description but no structured exposure-model type
        or model-inputs list. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_dictionary.data_level codes (dXX calculated / mXX modeled) + description/notes
      note: >-
        C-HER's data_level codes signal that a resource is calculated or modeled, but do not
        carry a structured exposure-model type or inputs. Conservative: partial.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS records no exposure-model type or model description.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus records no exposure-model type or model description.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Exposure-model identity is instance-layer; out of scope for CODATA.

data_layout:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL data/CHEL_hex3_*.csv (wide, keyed on hex_id); README.md
      note: >-
        CHEL publishes wide hex-indexed tables keyed on `hex_id`; subject and time live only
        in the README linkage example, and there is no portable sidecar column layout. Conservative:
        partial.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        external_exposure.person_id/value_as_number + gaia_db location.csv columns (implicit
        layout)
      note: >-
        Gaia's OMOP/gaia-db tables have value/subject/time columns but no portable sidecar
        column-binding document. Conservative: partial.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: geocoded CSV columns id / lat / lon / tmax / date (implicit layout)
      note: >-
        DeGAUSS's CSV has value/subject/date columns but no portable sidecar layout describing
        them. Conservative: partial.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        gridmet_tmmx.csv columns person_loc_id / lat / lon / value_kelvin / value_celsius
        (implicit layout)
      note: >-
        Amadeus's CSV has value/subject columns but no portable sidecar column-binding document.
        Conservative: partial.
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_column_dictionary (column_name, description, column_tag Index/Value/Temporal/Spatial,
        column_unit)
      note: >-
        C-HER's column dictionary is a first-class, portable per-column layout with a role
        tag and unit for every column — the closest analogue to the sidecar's data-layout
        block.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Companion-file column binding is instance/packaging-layer; out of scope for CODATA.

source_dataset:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: CHEL Documentation.md §2.7 lineage table; §5.5 (name + release + RID)
      note: >-
        CHEL identifies each source dataset first-class in the §2.7 lineage table with its
        release vintage (EJI 2022 / 2024); §5.5 adds Foundry RIDs to the per-release documentation.
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_db data_source.dataset_name/dataset_version/license/creator/date_published +
        meta_dcat_*.json dct:title/dct:identifier(DOI)/dct:license
      evidence: >-
        COMPARISON.md §I — dataset name ✅, version ✅, DOI ✅, license ✅, publisher ✅, date
        published/modified ✅
      note: >-
        Gaia natively carries full dataset-level discovery metadata (name, version, DOI, license,
        publisher).
  - source: cher
    legacy:
      extent: full
      status: asserted
      where: >-
        table_dictionary (dataset, doi, rights, resource_type/format, contributors) + version
        + source_update_frequency
      note: >-
        C-HER's table_dictionary and its foreign-key vocabularies identify the source dataset
        first-class (dataset, rights, DOI, contributors, version).
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no dataset name, version, DOI, license, or publisher.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no dataset-identity metadata (no name, DOI, license, publisher) natively.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Dataset identity/discovery is catalogue-layer; CODATA operates at the conceptual variable
        layer and is out of scope for scoring.

uncertainty:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: >-
        CHEL Documentation.md §4.3 (conservation/range diagnostics); §4.6.4, §4.7 (source
        uncertainty acknowledged)
      note: >-
        CHEL has conservation and range/domain validation and a null taxonomy, but carries
        no per-value uncertainty. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        C-HER null taxonomy (structural/derived null) + data_level QA codes (aXX/bXX)
      note: >-
        C-HER classifies null cells and encodes QA level, but carries no per-value uncertainty
        or completeness percentage. Conservative: partial.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        No gaia output carries per-value or model-aggregate uncertainty (per-value uncertainty
        is ❌ across all pipelines).
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no uncertainty block.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no uncertainty block; only a _FillValue sentinel.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Per-value uncertainty is instance-layer; out of scope for CODATA.

linkage_method:
  supported_by:
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: >-
        CHEL Documentation.md §4.5.2, §2.2.2 (point-to-hex join + deterministic privacy jitter)
      note: >-
        CHEL's linkage is first-class: deterministic participant point to Hex3 join plus a
        deterministic privacy reassignment (jitter) at the linkage stage.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        working.spatial_join_exposure (st_within with hard-coded buffer), captured in gaia_db/spatial_join_log.txt
      note: >-
        Gaia's linkage lives in the SQL-join semantics and its NOTICE log, not as a documented
        linkage-strategy column. Conservative: partial.
  - source: degauss
    legacy:
      extent: full
      status: verified
      where: >-
        geocoded CSV columns score, precision, geocode_result, matched_street/zip/city/state
      evidence: >-
        COMPARISON.md §B — geocoder match score ✅, precision ✅, geocode-result flag ✅ on every
        row
      note: >-
        DeGAUSS's linkage event (geocoding precision, match score, result flag, matched address)
        is first-class per row.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary reference_column_id + column_tag Foreign Reference / Spatial-Primary
        (cross-table join descriptors)
      note: >-
        C-HER models cross-table join references and spatial-column tags, but no patient-to-place
        linkage-strategy field. Conservative: partial.
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus collapses the address to lat/lon at the THREDDS request and records no linkage/geocoding
        quality.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Patient-to-place linkage is instance-layer; out of scope for CODATA.

tool_run:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §5.5 (Foundry RID + CHEL release)
      note: >-
        CHEL identifies its pipeline via Foundry RID + CHEL release, but carries no container
        digest, run args, timestamps, or hashes. Conservative: partial.
  - source: omop_gaia
    legacy:
      extent: partial
      status: asserted
      where: >-
        gaia_db data_source.created_at/updated_at (load time); spatial_join_log.txt (SQL functions)
      note: >-
        Gaia carries per-row load times and a join log, but no tool name/version, container
        digest, run args, or hashes. Conservative: partial.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: >-
        output filename tool name + container image tag (e.g. daymet_1.0.0); ghcr.io/degauss-org/...
        reference
      note: >-
        DeGAUSS pins tool name and version via the filename/container tag, but no digest,
        run args, timestamp, or hashes. Conservative: partial.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: thredds_response_headers.json HTTP Date header (run timestamp only)
      note: >-
        Amadeus records only the HTTP Date header; no tool name/version, container, run args,
        or hashes natively. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_dictionary.metadata_created_at/updated_at + uploaded_by + version
      note: >-
        C-HER records registration time, uploader, and version, but no per-run producing-tool
        name/version, container digest, args, or hashes. Conservative: partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Tool-run provenance is instance-layer; out of scope for CODATA.

