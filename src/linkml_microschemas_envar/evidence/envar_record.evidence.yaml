provenance_chain:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.1"
      snippet: "Every input entering CHEL follows a defined lineage pathway:"
      match: partial
      explanation: >-
        CHEL gives the ordered stages every input passes through (source, cleaning, spatial
        harmonization, hex aggregation, normalization, module assignment). Missing: the stages
        are generic; no tool, version or date per step.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.etl_metadata
      match: partial
      explanation: >-
        The ETL steps of a dataset (download from the source, the tool used, the result) are
        kept from the `about` part of its JSON-LD. Missing: they describe the ETL of the dataset
        as planned, not runs: no time or version per step, and the join is not part of it.
      status: verified
    - type: output
      document: gaiacatalog-example-dcat
      field: "prov:wasGeneratedBy"
      value: GDSC automation (see Process Step)
      match: partial
      explanation: >-
        The DCAT record of a catalogue entry has the process steps of its ETL as a script-like
        text (`prov:action`, also the `processStep` file of the entry). Missing: a description
        of the ETL, not a record of runs.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage (parent-child links) + lineage_notes
      note: >-
        C-HER's dataset_lineage links parent and child resources, but is a dataset-lineage
        graph, not an ordered per-run W3C-PROV chain. Conservative: partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-using
      locator: A Sample Workflow
      snippet: >-
        The programs can either be run in parallel on the geocoded file or they can be run
