# Evidence for the slots of envar_common.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

schema_version:
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus returns R objects and writes no metadata document, so there is nothing to
      carry a schema version. Closest: the package version in DESCRIPTION.'
    closest:
    - type: schema
      document: amadeus-description
      locator: DESCRIPTION
      source_slot: DESCRIPTION.Version
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's version code versions the data resource, not a metadata sidecar schema, so
        no EnVar-style schema-version field exists.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Sidecar schema versioning is packaging-layer; out of scope for CODATA's conceptual
        framework.

provenance_id:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§5.5"
      snippet: Foundry dataset references (RID)
      match: partial
      explanation: >-
        CHEL names a stable identifier for its datasets, the Foundry RID. Missing: it is listed
        as something each release should document; no RID is given in the public material, and
        nothing says that the health data refer back to it.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_source_id
      match: partial
      explanation: >-
        Every variable has a metadata record with an id, and the join writes that id to each
        exposure row (`exposure_source_value`), so a value leads back to its metadata. Missing:
        the id is a serial number of one database, not a stable identifier across installations,
        and it identifies the variable, not a run.
      status: verified
    - type: documentation
      document: gaiadb-spatial-join
      locator: spatial_join_from_catalog
      snippet: exposure_source_value (variable_source_id)
      match: partial
      explanation: >-
        The join code shows that `exposure_source_value` receives the `variable_source_id`.
        Missing: as above.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_name reproducible resource identifier (org_dataset_..._version) + osti_id /
        ornl_res_pub_id
      note: >-
        C-HER assigns each resource a reproducible identifier, but it names the dataset resource,
        not an EnVar sidecar that a health layer's source-value field carries. Conservative:
        partial.
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No identifier is given to a result. Closest: `download_data` can return a combined
      MD5 hash of the download directory, which identifies the raw files, not the result.'
    closest:
    - type: documentation
      document: amadeus-download-data
      locator: Value
      snippet: combined MD5 hash of the source's output directory
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      A run or its output has no identifier. Closest: the output file name, into which the
      geocoder writes its name, version and argument.
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A per-sidecar provenance id is packaging-layer; out of scope for CODATA.

phi_status:
  supported_by:
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        PostgreSQL schemas private / embargo (access-tier separation) + rights FK
      note: >-
        C-HER separates private/embargoed resources into dedicated schemas and records rights,
        but has no per-record PHI-status assertion flag. Conservative: partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-using
      locator: Removing PHI
      snippet: >-
        we can remove the addresses and coordinates from our output file, leaving only the
        geomarker information
      match: partial
      explanation: >-
        degauss.org says which columns of an output file are PHI (addresses and coordinates) and
        that the file has none once they are removed. Missing: a statement in the user guide; no
        field of an output file says whether it contains PHI.
      status: verified
    - type: documentation
      document: degauss-paper-2018
      locator: Results
      snippet: >-
        The analyst can then strip away the PHI (address and location coordinates) in order to
        create a deidentified dataset.
      match: partial
      explanation: >-
        The 2018 paper says the same. Missing: as above, nothing in the file itself.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'Nothing says whether a result holds PHI. Closest: the locations come from the user
      with an identifier column of the user''s choice (`locs_id`), which may or may not identify a person.'
    closest:
    - type: schema
      document: amadeus-calculate-covariates
      locator: arguments
      source_slot: calculate_covariates.locs_id
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      gaiaDB holds addresses and coordinates of persons (`working.location`), and nothing marks
      a table or a dataset as containing PHI. Nothing close was found in the schema or the
      README.
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Per-record PHI assertion is packaging/governance-layer; out of scope for CODATA.
  - source: chel
    reason: implicit
    explanation: >-
      The hex tables hold no participant data and the privacy design is described, but no
      statement says whether a released file contains PHI. Closest: the privacy basis in §1.3.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§1.3"
      snippet: Protection of participant privacy under HIPAA expert determination
      status: verified
    status: unverified
