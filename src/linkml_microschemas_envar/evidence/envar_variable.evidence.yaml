      status: verified
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no plausible-range metadata.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no plausible-range bounds; only a _FillValue sentinel.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER column metadata carries no per-variable plausible min/max.

