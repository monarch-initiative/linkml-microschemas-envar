# Evidence for the slots of envar_variable.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

variable_name:
  supported_by:
  - source: chel
    support:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      match: partial
      explanation: >-
        Each indicator has a short code as its column name, taken from EJI (`E_NEHD`,
        `EPL_NEHD`). Missing: CHEL's documentation does not list or explain the codes.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_db/variable_source.variable_name; DeGAUSS/Amadeus emit the short name only as
        a bare column header (tmax / tmmx)
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §F (Variable short name — ✅ for GAIA)
      note: >-
        GAIA carries the variable short name first-class in variable_source.variable_name;
        the combined stack surfaces it as a named slot.
  - source: degauss
    legacy:
      extent: partial
      status: asserted
      where: cohort_addresses_geocoded_daymet CSV column header `tmax`
      note: >-
        DeGAUSS carries the short name only as the value column header, not as a first-class
        named slot. Conservative: partial.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        gridmet_tmmx.csv column header `tmmx`; thredds_dataset.xml long_name/standard_name
        = tmmx
      note: >-
        Amadeus carries the short name as a column header and in the THREDDS long_name, not
        as a portable variable-name slot. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_name (literal column name)
      note: >-
        C-HER records each resource's literal column_name, which serves as the variable's
        machine-readable handle; not a portable sidecar short-name. Conservative: partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A tool-specific short name is an instance-layer handle; the CODATA/I-ADOPT conceptual
        layer names the property canonically, not the upstream tool's nickname.

variable_label:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      match: partial
      explanation: >-
        §2.3 to §2.6 give readable names of the indicators (extreme heat days, wildfire smoke
        days). Missing: the names are not tied to the column codes of the tables.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_db/variable_source.variable_description; JSON-LD variableMeasured.description
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §F (Variable description / long name — ✅ for GAIA)
      note: >-
        GAIA carries a variable long name / description first-class in variable_source.variable_description
        and the JSON-LD.
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml description = "Daily Maximum Temperature (2m)"; grid named daily_maximum_temperature
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §F (Variable description / long name — ✅ for Amadeus)
      note: >-
        Amadeus's THREDDS metadata carries a human-readable variable description first-class.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.name (human-readable, optional) / description
      note: >-
        C-HER's optional `name` and required column `description` carry a human-readable label,
        though `name` is optional. Conservative: partial.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS CSVs carry no variable description / long name — only the bare `tmax` column
        header.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A display label is instance-layer presentation; CODATA's conceptual layer names the
        property via I-ADOPT Object/Property, not a free-text label.

standard_name:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_db/variable_source.property_id and JSON-LD variableMeasured.propertyID → vocab.nerc.ac.uk/standard_name/air_temperature
        (NERC/CF mirror)
      evidence: EnVar/examples/heat/COMPARISON.md §F (CF standard name — ✅ for GAIA)
      note: >-
        GAIA is the only stack carrying a real CF standard name, via the hand-authored NERC
        propertyID in variable_source / JSON-LD.
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml standard_name = "tmmx" (gridMET shortcode overloaded, not a real
        CF term)
      note: >-
        Amadeus populates a standard_name slot but with the gridMET shortcode rather than
        a CF term, so a CF lookup fails. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_tag_id (ontology tag planned §8)
      note: >-
        C-HER's column_tag / planned ontology encoding will tag columns to its MORPH-built
        ontology, but no CF/standard-name binding exists today. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        I-ADOPT Object + Property decomposition; DDI-CDI RepresentedVariable (value domain
        + units)
      note: >-
        Naming the physical quantity canonically is exactly CODATA's RepresentedVariable /
        I-ADOPT layer — its strongest zone — but it names the concept, not this run's specific
        CURIE.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator has a standard name or a term from a vocabulary. Closest: the readable names
      in §2.3 to §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.3.1"
      snippet: "Air pollution indicators include:"
      status: verified
    status: unverified
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS carries no standard-name identifier — the quantity is implicit in the `tmax`
        column name.

units_ucum:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: This places each indicator on a standardized
      match: partial
      explanation: >-
        For the percentile ranks CHEL states the scale, 0 to 100. Missing: no unit for the
        native estimates (`E_` columns), and the published `EPL_` columns are on a 0 to 1 scale.
      status: verified
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        gaia_db/variable_source.unit_code (UCUM `CEL`) + unit_text; JSON-LD variableMeasured.unitCode;
        external_exposure.unit_concept_id 8653
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §E (Native unit declared — ✅ for GAIA)
      note: >-
        GAIA carries the unit as a first-class UCUM code (CEL) plus the OMOP unit_concept_id.
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml units = "K"; gridmet_tmmx.cf_metadata.json mirrors it
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §E (Native unit declared — ✅ for Amadeus)
      note: >-
        Amadeus declares the native unit K in a machine-readable CF metadata slot (though
        not in UCUM syntax).
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_unit_id (required for Value-tagged columns)
      note: >-
        C-HER requires column_unit on Value-tagged columns, but the unit vocabulary is not
        asserted to be UCUM. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable (value domain + units); I-ADOPT decomposition
      note: >-
        Units live at CODATA's RepresentedVariable layer — canonical unit semantics — but
        not the specific UCUM string of this run's file.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS's `tmax` column has no unit annotation; °C is only a container convention.

native_units_ucum:
  supported_by:
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml units = "K" (native) alongside the derived value_celsius; gridmet_tmmx.csv
        value_kelvin column
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §D/§E (Value in native source units — ✅ for Amadeus)
      note: >-
        Amadeus ships the native Kelvin value and its unit declaration side by side with the
        converted Celsius.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA stores °C as if it were always °C; only the OMOP-side unit lands in value_as_number
        and the upstream native unit is not on the row.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS does the K→°C conversion inside the container, so the native unit never appears
        in any output.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER records one column_unit per column; it has no notion of a distinct source-native
        unit and conversion.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A source-native unit and its packing are instance-layer decode details; CODATA's conceptual/represented
        layers do not carry per-run storage conventions.
  - source: chel
    reason: not_recorded
    explanation: >-
      The tables keep the native estimate (`E_` columns) next to its percentile rank (`EPL_`),
      but no unit is given for the native values.
    closest:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      status: verified
    status: unverified

target_concept_vocabulary:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: >-
        external_exposure.exposure_concept_id + exposure_type_concept_id (32885) + unit_concept_id
        (8653) — OMOP vocabulary is the implicit target
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §D (Exposure concept / variable identity — ✅ for
        GAIA)
      note: >-
        The OMOP CDM is the target vocabulary itself; the concept slots land the value against
        OHDSI concept ids.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator is bound to a concept of a health-data vocabulary. Nothing close was found in
      Documentation.md or README.md.
    status: unverified
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits a bare `tmax` value with no target-vocabulary binding.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no target-vocabulary binding; the variable is implicit in the `tmmx`
        column name.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's controlled vocabs (DCMI Type, IANA media types) describe resource type/format,
        not a downstream health-data target vocabulary for the variable.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Binding to a downstream health-data layer is an instance/target concern; CODATA aligns
        concepts across standards but names no single target vocabulary.

