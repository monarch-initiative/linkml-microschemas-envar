  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: working.external_exposure
      source_slot: external_exposure.exposure_concept_id
      match: full
      explanation: >-
        The concept of the exposure; the variable's metadata has the same as `attr_concept_id`.
      status: verified
    - type: schema
      document: gaiacatalog-schema
      locator: types
      source_slot: ConceptIdText
      match: full
      explanation: >-
        In the catalogue the concept of a variable is its `propertyID`, an OMOP concept id
        written as text.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No concept identifier is given. Closest: the source''s variable code.'
    closest:
    - type: documentation
      document: amadeus-process-gridmet
      locator: Note
      snippet: Layer names of the returned
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator is bound to a concept of a health-data vocabulary. Nothing close was found in
      Documentation.md or README.md.
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER binds no downstream concept id for the variable; only planned ontology tags
        on columns (§8).
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A concrete concept id in a target vocabulary is instance-layer; CODATA names the concept,
        not this run's downstream id.

concept_status:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: vocabulary.concept
      source_slot: concept.standard_concept
      match: partial
      explanation: >-
        The vocabulary says whether a concept is a standard one, and the join code uses the
        concept id 0 where nothing is mapped. Missing: no status for a concept that is proposed
        or known to be missing.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No concept binding, so no status. Closest: nothing.'
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER carries no existing/proposed/gap coverage status for a target vocabulary.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A gap-status flag against a target vocabulary is instance/target bookkeeping, outside
        CODATA's conceptual-alignment layer.

value_data_type:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.data_type
      match: full
      explanation: The data type of the variable.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: "qudt:dataType"
      value: float8
      match: full
      explanation: The value in the public example, per variable.
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.2"
      snippet: Binary flags are constrained to
      match: partial
      explanation: >-
        §4.3.2 gives the value domain per kind of indicator (percentile rank, binary flag,
        density, composite score). Missing: no data type per column.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_tag (Value) + column_unit (unit present ⇒ numeric)
      note: >-
        C-HER's Value tag plus the presence/absence of a column_unit distinguishes numeric
        from free-text value columns, but not the full continuous/categorical/flag taxonomy.
        Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable value domain (numeric vs categorical value domain)
      note: >-
        A value domain is exactly what CDI's RepresentedVariable carries, so the numeric/categorical
        distinction lives at CODATA's represented layer.
  not_supported_by:
  - source: amadeus
    reason: implicit
    explanation: 'Values are numeric R columns; the type is not declared. Closest: the description of
      the result.'
    closest:
    - type: documentation
      document: amadeus-calculate-covariates
      locator: Value
      snippet: Calculated covariates as a data.frame or SpatVector object
      status: verified
    status: unverified
  - source: degauss
    reason: implicit
    explanation: >-
      The values are numbers rounded to two decimals, which follows from the code and the
      output. No data type is declared.
    closest:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Rounding the Daymet variables to two decimal places
      status: verified
    status: unverified

value_range_plausible_min:
  supported_by:
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: I-ADOPT Constraint on the Property; DDI-CDI value-domain bounds
      note: >-
        Plausible domain bounds are naturally an I-ADOPT Constraint on the property / a CDI
        value-domain restriction at the conceptual layer.
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.2"
      snippet: Density measures are non-negative.
      match: partial
      explanation: >-
        §4.3.2 gives lower bounds per kind of indicator (0 for ranks, flags and densities).
        Missing: no bound per variable, and none for the native estimates.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-greenspace-readme
      locator: Geomarker Methods
      snippet: is a measure of greenness that ranges from -0.2 to 1
      match: partial
      explanation: >-
        The README of the `greenspace` container gives the range of its index; the lower bound
        is -0.2. Missing: only in this container; no range is given for any Daymet variable.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No plausible range is given. Closest: the MODIS `scale` argument, which the user must
      set from the product documentation.'
    closest:
    - type: schema
      document: amadeus-calculate-modis
      locator: arguments
      source_slot: calculate_modis.scale
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER column metadata carries no per-variable plausible min/max.
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      The catalogue stores a `minValue` per variable (gaiaDB: `min_value`). In the public
      example it is the smallest value found in the data (8 for a column of codes, -1 for a
      concentration), not a bound for plausible values.
    closest:
    - type: schema
      document: gaiacatalog-schema
      locator: Variable
      source_slot: Variable.min_value
      status: verified
    status: unverified

