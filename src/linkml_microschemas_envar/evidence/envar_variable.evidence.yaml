# Evidence for the slots of envar_variable.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

variable_name:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-process-gridmet
      locator: Note
      snippet: Layer names of the returned
      match: full
      explanation: Layer names contain the variable code (e.g. `tmmx`), and so does the value column
        of the extracted result.
      status: verified
  - source: chel
    support:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      match: partial
      explanation: >-
        Each indicator has a short code as its column name, taken from EJI (`E_NEHD`,
        `EPL_NEHD`). Missing: CHEL's documentation does not list or explain the codes.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_name
      match: full
      explanation: The name of the variable, a required field.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: name
      value: area_sqmi
      match: full
      explanation: A variable name in the public example.
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      source_label: maximum temperature
      match: full
      explanation: >-
        The README lists the short name of each variable (`dayl`, `prcp`, `srad`, `swe`, `tmax`,
        `tmin`, `vp`), which is also its column name in the output.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_name (literal column name)
      note: >-
        C-HER records each resource's literal column_name, which serves as the variable's
        machine-readable handle; not a portable sidecar short-name. Conservative: partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A tool-specific short name is an instance-layer handle; the CODATA/I-ADOPT conceptual
        layer names the property canonically, not the upstream tool's nickname.

variable_label:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-readme
      locator: Process
      snippet: Daily Accumulated Snow at Surface
      match: partial
      explanation: 'The processed raster carries a long name (`terra::longnames`), as the README example
        shows for NARR. Missing: the extracted data.frame keeps only the code.'
      status: verified
    - type: documentation
      document: amadeus-gridmet-vignette
      locator: Available inputs and data availability
      snippet: Maximum Near-Surface Air Temperature
      match: partial
      explanation: 'The vignette lists a label for each gridMET code. Missing: documentation only.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      match: partial
      explanation: >-
        §2.3 to §2.6 give readable names of the indicators (extreme heat days, wildfire smoke
        days). Missing: the names are not tied to the column codes of the tables.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_description
      match: full
      explanation: The description of the variable.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: description
      value: Tract area in square miles
      match: full
      explanation: A variable description in the public example.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.name (human-readable, optional) / description
      note: >-
        C-HER's optional `name` and required column `description` carry a human-readable label,
        though `name` is optional. Conservative: partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        Daymet weather variables include daily day length, precipitation, shortwave radiation,
        snow water equivalent, maximum and minimum temperature, and vapor pressure
      match: full
      explanation: >-
        The README gives a readable name for each variable, and the list under Using ties each
        name to its column.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A display label is instance-layer presentation; CODATA's conceptual layer names the
        property via I-ADOPT Object/Property, not a free-text label.

standard_name:
  supported_by:
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_tag_id (ontology tag planned §8)
      note: >-
        C-HER's column_tag / planned ontology encoding will tag columns to its MORPH-built
        ontology, but no CF/standard-name binding exists today. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        I-ADOPT Object + Property decomposition; DDI-CDI RepresentedVariable (value domain
        + units)
      note: >-
        Naming the physical quantity canonically is exactly CODATA's RepresentedVariable /
        I-ADOPT layer — its strongest zone — but it names the concept, not this run's specific
        CURIE.
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'Variables are named by the source''s code (gridMET `tmmx`), not by a standard name.
      The old entry cited the gridMET server, not amadeus. Closest: the layer names.'
    closest:
    - type: documentation
      document: amadeus-process-gridmet
      locator: Note
      snippet: Layer names of the returned
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator has a standard name or a term from a vocabulary. Closest: the readable names
      in §2.3 to §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.3.1"
      snippet: "Air pollution indicators include:"
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No variable has a standard name or a term from a vocabulary. Closest: the short names and
      labels in the README.
    closest:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      status: verified
    status: unverified
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      A variable's `propertyID` is defined in the catalogue schema as an OMOP concept id, and
      gaiaDB loads it into `property_id` and `attr_concept_id`. That binds the variable to the
      health vocabulary. A standard name of the physical quantity, such as a CF name, has no
      field.
    closest:
    - type: schema
      document: gaiacatalog-schema
      locator: Variable
      source_slot: Variable.property_id
      status: verified
    status: unverified

units_ucum:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-readme
      locator: Process
      snippet: Daily Accumulated Snow at Surface
      match: partial
      explanation: 'The processed raster keeps the unit of the source file (`kg/m^2` in the README example).
        Missing: not UCUM, and the extracted data.frame has no unit.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: This places each indicator on a standardized
      match: partial
      explanation: >-
        For the percentile ranks CHEL states the scale, 0 to 100. Missing: no unit for the
        native estimates (`E_` columns), and the published `EPL_` columns are on a 0 to 1 scale.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.unit_code
      match: partial
      explanation: >-
        A variable has a unit code, a unit text and an OMOP unit concept. Missing: nothing says
        that the code is UCUM.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: unitText
      value: square miles
      match: partial
      explanation: "The public example gives the unit as text only. Missing: no unit code."
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_unit_id (required for Value-tagged columns)
      note: >-
        C-HER requires column_unit on Value-tagged columns, but the unit vocabulary is not
        asserted to be UCUM. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable (value domain + units); I-ADOPT decomposition
      note: >-
        Units live at CODATA's RepresentedVariable layer — canonical unit semantics — but
        not the specific UCUM string of this run's file.
  - source: degauss
    support:
    - type: documentation
      document: degauss-pm-readme
      locator: Using
      snippet: predicted PM2.5 (micrograms per cubic meter)
      match: partial
      explanation: >-
        The README of the `pm` container gives the unit of its value column in words. Missing:
        in words and not UCUM, in the README only, and the daymet container gives no unit for
        any variable (its code passes Daymet's values on unchanged apart from interpolation and
        rounding, which the README does not say either).
      status: verified

native_units_ucum:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_template
      source_slot: attr_template.unit_source_value
      match: partial
      explanation: >-
        Next to the unit concept, a value keeps the unit as the source gave it
        (`unit_source_value`). Missing: free text, not UCUM, and nothing says whether values
        were converted.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus does not convert units, so there is no second unit to record; gridMET temperature
      stays in kelvin. The `value_celsius` column of the old entry came from our own example script.
      Closest: the unit on the processed raster.'
    closest:
    - type: documentation
      document: amadeus-readme
      locator: Process
      snippet: Daily Accumulated Snow at Surface
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No container says in which unit the source stores its values. The daymet code converts no
      units, so its values are in Daymet's own units, which are not stated. Closest: the `pm`
      container gives the unit of its output.
    closest:
    - type: documentation
      document: degauss-pm-readme
      locator: Using
      snippet: predicted PM2.5 (micrograms per cubic meter)
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER records one column_unit per column; it has no notion of a distinct source-native
        unit and conversion.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A source-native unit and its packing are instance-layer decode details; CODATA's conceptual/represented
        layers do not carry per-run storage conventions.
  - source: chel
    reason: not_recorded
    explanation: >-
      The tables keep the native estimate (`E_` columns) next to its percentile rank (`EPL_`),
      but no unit is given for the native values.
    closest:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      status: verified
    status: unverified

target_concept_vocabulary:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: vocabulary.concept
      source_slot: concept.vocabulary_id
      match: full
      explanation: >-
        Concepts are from the OMOP vocabulary tables, where each concept names its vocabulary.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No health vocabulary is named. Closest: the source''s variable code.'
    closest:
    - type: documentation
      document: amadeus-process-gridmet
      locator: Note
      snippet: Layer names of the returned
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator is bound to a concept of a health-data vocabulary. Nothing close was found in
      Documentation.md or README.md.
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's controlled vocabs (DCMI Type, IANA media types) describe resource type/format,
        not a downstream health-data target vocabulary for the variable.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Binding to a downstream health-data layer is an instance/target concern; CODATA aligns
        concepts across standards but names no single target vocabulary.

