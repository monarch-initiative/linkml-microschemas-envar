  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS has no concept binding and so no coverage-status flag.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus has no concept binding and so no coverage-status flag.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER carries no existing/proposed/gap coverage status for a target vocabulary.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A gap-status flag against a target vocabulary is instance/target bookkeeping, outside
        CODATA's conceptual-alignment layer.

value_data_type:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_catalog meta_etl_*.json qudt:dataType (numeric/float4)
      evidence: >-
        examples/scenarios/standards/omop_gaia_daymet_tmax.yaml (value_data_type)
      note: >-
        GAIA registers the attribute's numeric qudt:dataType at dataset-registration time;
        the EnVar translation carries it first-class as value_data_type.
  - source: chel
    legacy:
      extent: full
      status: asserted
      where: CHEL Documentation.md §3.6-3.7; CSV E_* / EPL_* / F_* column prefixes
      note: >-
        CHEL carries the value data type first-class via column prefix: native estimate (`E_`),
        percentile 0-100 (`EPL_`), or binary vulnerability flag (`F_`).
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_tag (Value) + column_unit (unit present ⇒ numeric)
      note: >-
        C-HER's Value tag plus the presence/absence of a column_unit distinguishes numeric
        from free-text value columns, but not the full continuous/categorical/flag taxonomy.
        Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable value domain (numeric vs categorical value domain)
      note: >-
        A value domain is exactly what CDI's RepresentedVariable carries, so the numeric/categorical
        distinction lives at CODATA's represented layer.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS emits a numeric `tmax` column but declares no explicit value data type; the
        type is implicit in the data.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus emits numeric value_kelvin/value_celsius columns with no explicit value-data-type
        declaration.

