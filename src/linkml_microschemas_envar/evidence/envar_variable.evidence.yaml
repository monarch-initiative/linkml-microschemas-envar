# Evidence for the slots of envar_variable.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

variable_name:
  supported_by:
  - source: chel
    support:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      match: partial
      explanation: >-
        Each indicator has a short code as its column name, taken from EJI (`E_NEHD`,
        `EPL_NEHD`). Missing: CHEL's documentation does not list or explain the codes.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_name
      match: full
      explanation: The name of the variable, a required field.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: name
      value: area_sqmi
      match: full
      explanation: A variable name in the public example.
      status: verified
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      source_label: maximum temperature
      match: full
      explanation: >-
        The README lists the short name of each variable (`dayl`, `prcp`, `srad`, `swe`, `tmax`,
        `tmin`, `vp`), which is also its column name in the output.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        gridmet_tmmx.csv column header `tmmx`; thredds_dataset.xml long_name/standard_name
        = tmmx
      note: >-
        Amadeus carries the short name as a column header and in the THREDDS long_name, not
        as a portable variable-name slot. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_name (literal column name)
      note: >-
        C-HER records each resource's literal column_name, which serves as the variable's
        machine-readable handle; not a portable sidecar short-name. Conservative: partial.
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A tool-specific short name is an instance-layer handle; the CODATA/I-ADOPT conceptual
        layer names the property canonically, not the upstream tool's nickname.

variable_label:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.6"
      snippet: "Climate hazard indicators include:"
      match: partial
      explanation: >-
        §2.3 to §2.6 give readable names of the indicators (extreme heat days, wildfire smoke
        days). Missing: the names are not tied to the column codes of the tables.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.variable_description
      match: full
      explanation: The description of the variable.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: description
      value: Tract area in square miles
      match: full
      explanation: A variable description in the public example.
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml description = "Daily Maximum Temperature (2m)"; grid named daily_maximum_temperature
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §F (Variable description / long name — ✅ for Amadeus)
      note: >-
        Amadeus's THREDDS metadata carries a human-readable variable description first-class.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.name (human-readable, optional) / description
      note: >-
        C-HER's optional `name` and required column `description` carry a human-readable label,
        though `name` is optional. Conservative: partial.
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: >-
        Daymet weather variables include daily day length, precipitation, shortwave radiation,
        snow water equivalent, maximum and minimum temperature, and vapor pressure
      match: full
      explanation: >-
        The README gives a readable name for each variable, and the list under Using ties each
        name to its column.
      status: verified
  not_supported_by:
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A display label is instance-layer presentation; CODATA's conceptual layer names the
        property via I-ADOPT Object/Property, not a free-text label.

standard_name:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.property_id
      match: partial
      explanation: >-
        A variable has a `property_id`, an identifier of what it measures. Missing: any
        identifier can go there, and nothing asks for a standard name of the physical quantity.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: propertyID
      value: "2052497175"
      match: partial
      explanation: >-
        In the public example the property id is an OMOP concept id. Missing: not a standard
        name such as a CF name.
      status: verified
  - source: amadeus
    legacy:
      extent: partial
      status: asserted
      where: >-
        thredds_dataset.xml standard_name = "tmmx" (gridMET shortcode overloaded, not a real
        CF term)
      note: >-
        Amadeus populates a standard_name slot but with the gridMET shortcode rather than
        a CF term, so a CF lookup fails. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_column_dictionary.column_tag_id (ontology tag planned §8)
      note: >-
        C-HER's column_tag / planned ontology encoding will tag columns to its MORPH-built
        ontology, but no CF/standard-name binding exists today. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        I-ADOPT Object + Property decomposition; DDI-CDI RepresentedVariable (value domain
        + units)
      note: >-
        Naming the physical quantity canonically is exactly CODATA's RepresentedVariable /
        I-ADOPT layer — its strongest zone — but it names the concept, not this run's specific
        CURIE.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator has a standard name or a term from a vocabulary. Closest: the readable names
      in §2.3 to §2.6.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.3.1"
      snippet: "Air pollution indicators include:"
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No variable has a standard name or a term from a vocabulary. Closest: the short names and
      labels in the README.
    closest:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      status: verified
    status: unverified

units_ucum:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: This places each indicator on a standardized
      match: partial
      explanation: >-
        For the percentile ranks CHEL states the scale, 0 to 100. Missing: no unit for the
        native estimates (`E_` columns), and the published `EPL_` columns are on a 0 to 1 scale.
      status: verified
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.unit_code
      match: partial
      explanation: >-
        A variable has a unit code, a unit text and an OMOP unit concept. Missing: nothing says
        that the code is UCUM.
      status: verified
    - type: output
      document: gaiadb-example-jsonld
      field: unitText
      value: square miles
      match: partial
      explanation: "The public example gives the unit as text only. Missing: no unit code."
      status: verified
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml units = "K"; gridmet_tmmx.cf_metadata.json mirrors it
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §E (Native unit declared — ✅ for Amadeus)
      note: >-
        Amadeus declares the native unit K in a machine-readable CF metadata slot (though
        not in UCUM syntax).
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_unit_id (required for Value-tagged columns)
      note: >-
        C-HER requires column_unit on Value-tagged columns, but the unit vocabulary is not
        asserted to be UCUM. Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable (value domain + units); I-ADOPT decomposition
      note: >-
        Units live at CODATA's RepresentedVariable layer — canonical unit semantics — but
        not the specific UCUM string of this run's file.
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      No unit is given for any variable, in the README or in the output. The code passes
      Daymet's values on unchanged apart from interpolation and rounding, which the README does
      not say either.
    closest:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Rounding the Daymet variables to two decimal places
      status: verified
    status: unverified

native_units_ucum:
  supported_by:
  - source: amadeus
    legacy:
      extent: full
      status: verified
      where: >-
        thredds_dataset.xml units = "K" (native) alongside the derived value_celsius; gridmet_tmmx.csv
        value_kelvin column
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §D/§E (Value in native source units — ✅ for Amadeus)
      note: >-
        Amadeus ships the native Kelvin value and its unit declaration side by side with the
        converted Celsius.
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.attr_template
      source_slot: attr_template.unit_source_value
      match: partial
      explanation: >-
        Next to the unit concept, a value keeps the unit as the source gave it
        (`unit_source_value`). Missing: free text, not UCUM, and nothing says whether values
        were converted.
      status: verified
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      As for `units_ucum`: no unit is given. The code converts no units, so the values are in
      Daymet's own units.
    closest:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Rounding the Daymet variables to two decimal places
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER records one column_unit per column; it has no notion of a distinct source-native
        unit and conversion.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A source-native unit and its packing are instance-layer decode details; CODATA's conceptual/represented
        layers do not carry per-run storage conventions.
  - source: chel
    reason: not_recorded
    explanation: >-
      The tables keep the native estimate (`E_` columns) next to its percentile rank (`EPL_`),
      but no unit is given for the native values.
    closest:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      status: verified
    status: unverified

target_concept_vocabulary:
  supported_by:
  - source: omop_gaia
    support:
    - type: schema
      document: gaiadb-init-schema
      locator: vocabulary.concept
      source_slot: concept.vocabulary_id
      match: full
      explanation: >-
        Concepts are from the OMOP vocabulary tables, where each concept names its vocabulary.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator is bound to a concept of a health-data vocabulary. Nothing close was found in
      Documentation.md or README.md.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus carries no target-vocabulary binding; the variable is implicit in the `tmmx`
        column name.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's controlled vocabs (DCMI Type, IANA media types) describe resource type/format,
        not a downstream health-data target vocabulary for the variable.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Binding to a downstream health-data layer is an instance/target concern; CODATA aligns
        concepts across standards but names no single target vocabulary.

