value_data_type:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_catalog meta_etl_*.json qudt:dataType (numeric/float4)
      evidence: >-
        examples/scenarios/standards/omop_gaia_daymet_tmax.yaml (value_data_type)
      note: >-
        GAIA registers the attribute's numeric qudt:dataType at dataset-registration time;
        the EnVar translation carries it first-class as value_data_type.
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.2"
      snippet: Binary flags are constrained to
      match: partial
      explanation: >-
        §4.3.2 gives the value domain per kind of indicator (percentile rank, binary flag,
        density, composite score). Missing: no data type per column.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: >-
        table_column_dictionary.column_tag (Value) + column_unit (unit present ⇒ numeric)
      note: >-
        C-HER's Value tag plus the presence/absence of a column_unit distinguishes numeric
        from free-text value columns, but not the full continuous/categorical/flag taxonomy.
        Conservative: partial.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: >-
        DDI-CDI RepresentedVariable value domain (numeric vs categorical value domain)
      note: >-
        A value domain is exactly what CDI's RepresentedVariable carries, so the numeric/categorical
        distinction lives at CODATA's represented layer.
  not_supported_by:
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        DeGAUSS emits a numeric `tmax` column but declares no explicit value data type; the
        type is implicit in the data.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus emits numeric value_kelvin/value_celsius columns with no explicit value-data-type
        declaration.

value_range_plausible_min:
  supported_by:
  - source: omop_gaia
    legacy:
      extent: full
      status: verified
      where: gaia_db/variable_source.min_value (−50); also JSON-LD variableMeasured
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §F (Variable valid range min/max — ✅ for GAIA)
      note: GAIA carries a first-class min_value (−50) as variable metadata.
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: I-ADOPT Constraint on the Property; DDI-CDI value-domain bounds
      note: >-
        Plausible domain bounds are naturally an I-ADOPT Constraint on the property / a CDI
        value-domain restriction at the conceptual layer.
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.2"
      snippet: Density measures are non-negative.
      match: partial
      explanation: >-
        §4.3.2 gives lower bounds per kind of indicator (0 for ranks, flags and densities).
