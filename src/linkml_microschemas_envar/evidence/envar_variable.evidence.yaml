      document: gaiadb-init-schema
      locator: backbone.variable_source
      source_slot: variable_source.min_value
      match: partial
      explanation: >-
        A variable has a `min_value`. Missing: nothing says whether it is a plausible bound or
        the smallest value observed, and the public example does not fill it.
      status: verified
  - source: codata
    legacy:
      extent: partial
      status: asserted
      where: I-ADOPT Constraint on the Property; DDI-CDI value-domain bounds
      note: >-
        Plausible domain bounds are naturally an I-ADOPT Constraint on the property / a CDI
        value-domain restriction at the conceptual layer.
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.2"
      snippet: Density measures are non-negative.
      match: partial
      explanation: >-
        §4.3.2 gives lower bounds per kind of indicator (0 for ranks, flags and densities).
        Missing: no bound per variable, and none for the native estimates.
      status: verified
  not_supported_by:
  - source: degauss
    reason: not_recorded
    explanation: >-
      No plausible range is given for any variable. Nothing close was found in the daymet README
      or entrypoint.R.
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no plausible-range bounds; only a _FillValue sentinel.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER column metadata carries no per-variable plausible min/max.

