    legacy:
      extent: full
      status: verified
      where: >-
        external_exposure.exposure_concept_id (placeholder concept present) + exposure_type_concept_id
        32885
      evidence: >-
        EnVar/examples/heat/COMPARISON.md §D (Exposure concept / variable identity — ✅ for
        GAIA)
      note: >-
        GAIA fills the concept-id slot even though no real OMOP concept is yet minted for
        daily-max-air-temperature; the binding exists.
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator is bound to a concept of a health-data vocabulary. Nothing close was found in
      Documentation.md or README.md.
    status: unverified
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No concept-id column in DeGAUSS output.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No concept-id column in Amadeus output.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER binds no downstream concept id for the variable; only planned ontology tags
        on columns (§8).
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A concrete concept id in a target vocabulary is instance-layer; CODATA names the concept,
        not this run's downstream id.

