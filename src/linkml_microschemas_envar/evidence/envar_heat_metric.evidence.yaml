percentile_reference_geographic_scope:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: CHEL applies national percentile ranking aggregated from the EJI source.
      match: full
      explanation: >-
        The reference set of the percentile ranks is stated: national, over all hexes. CHEL
        states it for its indicator ranks in general, not for a heat threshold.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus computes no percentile metric, so there is no reference distribution. Closest:
      nothing.'
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's percentile normalization is EJI vulnerability, not a heat-metric percentile
        baseline scope.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Percentile-baseline scope is instance-layer; out of scope for CODATA.

