# Evidence for the slots of envar_heat_metric.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

heat_metric_family:
  supported_by:
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      source_label: maximum temperature
      match: partial
      explanation: >-
        The README names the variable and what it is, maximum temperature, which is one of the
        families. Missing: the output has only the column name; no field says which heat metric
        a column is.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      CHEL has an extreme heat days indicator from EJI, but does not say which heat metric
      defines an extreme heat day. Closest: the column `E_NEHD` of the 2024 table and the
      indicator list in §2.6.
    closest:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits plain tmmx with no heat-metric family field.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER models no derived heat-metric family.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Heat-metric methodology is instance-layer; out of scope for CODATA.

