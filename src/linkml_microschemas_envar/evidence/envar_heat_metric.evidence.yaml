# Evidence for the slots of envar_heat_metric.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

heat_metric_family:
  supported_by:
  - source: degauss
    support:
    - type: schema
      document: degauss-daymet-readme
      locator: Using
      source_slot: tmax
      source_label: maximum temperature
      match: partial
      explanation: >-
        The README names the variable and what it is, maximum temperature, which is one of the
        families. Missing: the output has only the column name; no field says which heat metric
        a column is.
      status: verified
  not_supported_by:
  - source: cher
    reason: not_recorded
    explanation: 'C-HER describes no heat metric. Closest: gridMET meteorological variables are among
      its data.'
    closest:
    - type: documentation
      document: cher-arxiv-paper
      locator: §2.3
      snippet: Seven meteorological variables from the GridMet database
      status: verified
    status: unverified
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus has no heat metrics; it returns the variables of the source, such as gridMET
      `tmmx`. Closest: the gridMET variable list.'
    closest:
    - type: documentation
      document: amadeus-gridmet-vignette
      locator: Available inputs and data availability
      snippet: Maximum Near-Surface Air Temperature
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      CHEL has an extreme heat days indicator from EJI, but does not say which heat metric
      defines an extreme heat day. Closest: the column `E_NEHD` of the 2024 table and the
      indicator list in §2.6.
    closest:
    - type: output
      document: chel-hex3-2024
      field: E_NEHD
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Heat-metric methodology is instance-layer; out of scope for CODATA.

input_source_short_code:
  supported_by:
  - source: cher
    support:
    - type: documentation
      document: cher-metadata-overview
      locator: §2.4.1, p. 14
      snippet: A resource may have one parent resource or multiple parent resources.
      match: partial
      explanation: 'A derived resource links its parents, and each parent''s identifier starts with
        the abbreviation of its organization and dataset (e.g. census_tiger). Missing: not for heat
        metrics, and the code is C-HER''s abbreviation.'
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus computes no metric from several inputs, so there are no inputs to name. Closest:
      the dataset name of a call (`dataset_name`, e.g. "gridmet").'
    closest:
    - type: schema
      document: amadeus-download-data
      locator: arguments
      source_slot: download_data.dataset_name
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Heat-equation input decomposition is instance-layer; out of scope for CODATA.

