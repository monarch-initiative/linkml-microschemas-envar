# Evidence for the slots of envar_heat_metric.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

heat_metric_family:
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: CHEL Documentation.md §2.6 (EJI extreme-heat-days indicator only)
      note: >-
        CHEL carries the EJI-derived extreme-heat-days indicator (§2.6; `E_NEHD` / `EPL_NEHD`
        in the 2024 hex table), but no heat-metric methodology, so no heat-metric family is
        recorded.
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        The scenario is a plain Tmax extraction, not a heat index; the variable family is
        implicit in variable_name tmax, with no derived heat-metric family slot.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits plain tmax with no heat-metric family field.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits plain tmmx with no heat-metric family field.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER models no derived heat-metric family.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Heat-metric methodology is instance-layer; out of scope for CODATA.

