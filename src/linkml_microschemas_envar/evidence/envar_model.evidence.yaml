      document: chel-documentation
      locator: "§4.6.4"
      snippet: >-
        Modeled environmental exposures (e.g., air pollution estimates) contain inherent
        uncertainty independent of spatial aggregation.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for a skill statistic of the source model. Closest: the free-text `description`
      of the dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.description
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No skill statistic of Daymet is passed on. Closest: the README's links to the Daymet
      documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER carries no source-model skill/cross-validation field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Model cross-validation skill is instance-layer quality metadata the CDIF / DDI-CDI
        conceptual and represented layers do not carry.

exposure_model_known_biases:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.6.1"
      snippet: Area-weighted interpolation assumes uniform distribution within tracts.
      match: partial
      explanation: >-
        CHEL lists the known limits of its own aggregation step (§4.6: interpolation assumption,
        raster resolution, fixed grid alignment). Missing: known biases of the source models
        behind the indicators are not passed on.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No known biases are listed. Closest: the MODIS help page tells users to read the product''s
      technical documentation to get the scale right.'
    closest:
    - type: documentation
      document: amadeus-calculate-modis
      locator: arguments
      snippet: It is crucial that users review the technical documentation of the MODIS
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for known issues of the source data. Closest: the free-text `description` of the
      dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.description
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No known bias of Daymet is passed on. Closest: the README's links to the Daymet
      documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
