        source methods-paper DOI.
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA carries a dataset DOI (dct:identifier) but no methods-paper DOI describing the
        exposure model; no such slot exists.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no methods-paper DOI for the source model.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no methods-paper DOI for the source model.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's doi field is the resource's own DOI, not a methods-paper DOI for the model
