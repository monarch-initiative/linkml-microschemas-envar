# Evidence for the slots of envar_model.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

exposure_model_type:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.5"
      snippet: These measures are estimated at tract level using small-area modeling.
      match: partial
      explanation: >-
        For the health prevalence inputs CHEL says how the source values were produced. Missing:
        for the other indicators it only says they are typically modeled (§2.3.1), and no model
        class is given per indicator.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary data_level (mXX = modeled data)
      note: >-
        C-HER's data_level code flags modeled data (mXX) and distinguishes calculated (dXX)
        from modeled, but does not name the model class (reanalysis vs interpolation).
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA has no first-class exposure-model-type slot; it is present only via the EnVar
        JSON-LD extension. Natively GAIA carries only a free-text measurement_technique.
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing says what kind of model Daymet is. Closest: the README's links to the Daymet
      documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no exposure-model-type slot.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The exposure-model class is instance-layer methodology that CDIF / DDI-CDI conceptual
        and represented layers explicitly do not carry (related-approaches.md §4).

exposure_model_inputs:
  supported_by:
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage (parent resources of a computed/modeled resource)
      note: >-
        C-HER's dataset_lineage links parent resources a child was calculated/modeled from,
        but as resource FKs, not a named model-input variable list.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: GAIA has no slot anywhere for model inputs.
  - source: degauss
    reason: not_recorded
    explanation: >-
      The inputs of the Daymet model are not passed on. Closest: the README's links to the
      Daymet documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no model-input list.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Model inputs are instance-layer derivation provenance that the CDIF / DDI-CDI conceptual
        and represented layers do not carry (related-approaches.md §4).
  - source: chel
    reason: different_concept
    explanation: >-
      The input lineage table lists the datasets CHEL itself reads (EJI, ACS, GPW), not the
      inputs of the models behind the indicators.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7"
      snippet: >-
        These datasets form the full upstream dependency graph for aggregation and spatial
        linkage.
      status: verified
    status: unverified

exposure_model_paper_doi:
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No methods paper is cited for any of the source models. Closest: the pointer to the EJI
      technical documentation in §3.6, as a web link.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: for details on rank calculation
      status: verified
    status: unverified
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA carries a dataset DOI (dct:identifier) but no methods-paper DOI describing the
        exposure model; no such slot exists.
  - source: degauss
    reason: not_recorded
    explanation: >-
      The README links the Daymet user guide and project page; no methods paper and no DOI.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no methods-paper DOI for the source model.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's doi field is the resource's own DOI, not a methods-paper DOI for the model
        that produced the values.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A model methods-paper DOI is instance-layer derivation metadata the CDIF / DDI-CDI
        conceptual and represented layers do not carry.

exposure_model_cross_validation_r2:
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No skill statistic of the source models is passed on; CHEL's own validation (Part 4)
      checks geometry and conservation. Closest: the statement in §4.6.4 that the modeled inputs
      are uncertain.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§4.6.4"
      snippet: >-
        Modeled environmental exposures (e.g., air pollution estimates) contain inherent
        uncertainty independent of spatial aggregation.
      status: verified
    status: unverified
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA carries no model cross-validation R2; no such slot exists in gaiaCatalog or gaia-db.
  - source: degauss
    reason: not_recorded
    explanation: >-
      No skill statistic of Daymet is passed on. Closest: the README's links to the Daymet
      documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no model cross-validation R2.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER carries no source-model skill/cross-validation field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Model cross-validation skill is instance-layer quality metadata the CDIF / DDI-CDI
        conceptual and represented layers do not carry.

