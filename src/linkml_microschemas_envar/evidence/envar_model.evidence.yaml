        and represented layers do not carry.

bias_correction_applied:
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'amadeus applies no bias correction and does not say so. Closest: the MODIS `scale`
      argument, which rescales raw values but is not a bias correction.'
    closest:
    - type: schema
      document: amadeus-calculate-modis
      locator: arguments
      source_slot: calculate_modis.scale
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      Nothing says whether the source values or the hex values were bias-corrected. Closest:
      §3.2, which names the interpolation bias and describes no correction.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§3.2, Bias Considerations"
      snippet: Interpolation bias magnitude is proportional to within-tract variance.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field says whether values were bias-corrected. Closest: the free-text `description` of
      the dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.description
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing says whether the values are bias-corrected. The code only interpolates and rounds
      them (entrypoint.R).
    closest:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Rounding the Daymet variables to two decimal places
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's data_level codes track processing stage but do not flag whether statistical
        bias correction was applied.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Bias correction is instance-layer derivation metadata the CDIF / DDI-CDI conceptual
        and represented layers do not carry.
