# Evidence for the slots of envar_model.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

exposure_model_type:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: >-
        CHEL Documentation.md Part 3 (aggregation operator explicit; source model inherited
        from EJI)
      note: >-
        CHEL makes the aggregation operator explicit, but the source exposure-model type (reanalysis
        vs station-interp) is inherited from EJI, not modelled by CLAD.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary data_level (mXX = modeled data)
      note: >-
        C-HER's data_level code flags modeled data (mXX) and distinguishes calculated (dXX)
        from modeled, but does not name the model class (reanalysis vs interpolation).
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        GAIA has no first-class exposure-model-type slot; it is present only via the EnVar
        JSON-LD extension. Natively GAIA carries only a free-text measurement_technique.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no exposure-model-type slot.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no exposure-model-type slot.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The exposure-model class is instance-layer methodology that CDIF / DDI-CDI conceptual
        and represented layers explicitly do not carry (related-approaches.md §4).

exposure_model_inputs:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: CHEL Documentation.md §2.7 lineage / Part 3 inputs
      note: >-
        Inputs enter mostly via EJI and are listed in the lineage table, but not as a per-value
        model-input list. Conservative: partial.
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage (parent resources of a computed/modeled resource)
      note: >-
        C-HER's dataset_lineage links parent resources a child was calculated/modeled from,
        but as resource FKs, not a named model-input variable list.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: GAIA has no slot anywhere for model inputs.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS carries no model-input list.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no model-input list.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Model inputs are instance-layer derivation provenance that the CDIF / DDI-CDI conceptual
        and represented layers do not carry (related-approaches.md §4).

