      locator: "§4.6.1"
      snippet: Area-weighted interpolation assumes uniform distribution within tracts.
      match: partial
      explanation: >-
        CHEL lists the known limits of its own aggregation step (§4.6: interpolation assumption,
        raster resolution, fixed grid alignment). Missing: known biases of the source models
        behind the indicators are not passed on.
      status: verified
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: GAIA carries no known-model-biases field.
  - source: degauss
    reason: not_recorded
    explanation: >-
      No known bias of Daymet is passed on. Closest: the README's links to the Daymet
      documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no known-model-biases field.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER has free-text description/notes but no structured known-biases field for the
        source model.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Known model biases are instance-layer quality metadata the CDIF / DDI-CDI conceptual
        and represented layers do not carry.

bias_correction_applied:
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      Nothing says whether the source values or the hex values were bias-corrected. Closest:
      §3.2, which names the interpolation bias and describes no correction.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§3.2, Bias Considerations"
      snippet: Interpolation bias magnitude is proportional to within-tract variance.
      status: verified
    status: unverified
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: GAIA carries no bias-correction flag for the source model.
  - source: degauss
    reason: not_recorded
    explanation: >-
      Nothing says whether the values are bias-corrected. The code only interpolates and rounds
      them (entrypoint.R).
    closest:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: Rounding the Daymet variables to two decimal places
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus carries no bias-correction flag.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's data_level codes track processing stage but do not flag whether statistical
        bias correction was applied.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Bias correction is instance-layer derivation metadata the CDIF / DDI-CDI conceptual
        and represented layers do not carry.
