# Evidence for the slots of envar_model.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

exposure_model_type:
  supported_by:
  - source: amadeus
    support:
    - type: documentation
      document: amadeus-readme
      locator: Download
      snippet: North American Regional Reanalysis
      match: partial
      explanation: 'For NARR (and MERRA-2) the model class is in the dataset name, reanalysis. Missing:
        only in the name, and only for those datasets; for gridMET nothing says how it was produced.'
      status: verified
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§2.5"
      snippet: These measures are estimated at tract level using small-area modeling.
      match: partial
      explanation: >-
        For the health prevalence inputs CHEL says how the source values were produced. Missing:
        for the other indicators it only says they are typically modeled (§2.3.1), and no model
        class is given per indicator.
      status: verified
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: table_dictionary data_level (mXX = modeled data)
      note: >-
        C-HER's data_level code flags modeled data (mXX) and distinguishes calculated (dXX)
        from modeled, but does not name the model class (reanalysis vs interpolation).
  - source: degauss
    support:
    - type: documentation
      document: degauss-pm-readme
      locator: Geomarker Methods
      snippet: More information on the development of the spatial model can be found at the
      match: partial
      explanation: >-
        The README of the `pm` container says that its values are predictions of a
        spatiotemporal model. Missing: the class of model is not named (it is in the paper), and
        nothing says what kind of model Daymet is.
      status: verified
  not_supported_by:
  - source: omop_gaia
    reason: different_concept
    explanation: >-
      `data_source` has a field `measurement_technique`, but in the catalogue it says how the
      data are represented (raster, vector, geometry type), not what kind of model produced the
      values.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.measurement_technique
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        The exposure-model class is instance-layer methodology that CDIF / DDI-CDI conceptual
        and represented layers explicitly do not carry (related-approaches.md §4).

exposure_model_inputs:
  supported_by:
  - source: cher
    legacy:
      extent: partial
      status: asserted
      where: dataset_lineage (parent resources of a computed/modeled resource)
      note: >-
        C-HER's dataset_lineage links parent resources a child was calculated/modeled from,
        but as resource FKs, not a named model-input variable list.
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'No model inputs are listed. Closest: the gridMET methods paper is cited in the `download_gridmet`
      references, where the inputs are described.'
    closest:
    - type: schema
      document: amadeus-download-gridmet
      locator: references
      source_slot: references.article_abatzoglou2013development
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for the inputs of the model behind a dataset. Closest: `isBasedOn` in the
      catalogue schema, for a source the dataset is derived from, and the free-text description.
    closest:
    - type: schema
      document: gaiacatalog-schema
      locator: Dataset
      source_slot: Dataset.is_based_on
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      The inputs of the Daymet model are not passed on. Closest: the README's links to the
      Daymet documentation.
    closest:
    - type: documentation
      document: degauss-daymet-readme
      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Model inputs are instance-layer derivation provenance that the CDIF / DDI-CDI conceptual
        and represented layers do not carry (related-approaches.md §4).
  - source: chel
    reason: different_concept
    explanation: >-
      The input lineage table lists the datasets CHEL itself reads (EJI, ACS, GPW), not the
      inputs of the models behind the indicators.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§2.7"
      snippet: >-
        These datasets form the full upstream dependency graph for aggregation and spatial
        linkage.
      status: verified
    status: unverified

exposure_model_paper_doi:
  supported_by:
  - source: amadeus
    support:
    - type: schema
      document: amadeus-download-gridmet
      locator: references
      source_slot: references.article_abatzoglou2013development
      match: partial
      explanation: 'The help page of `download_gridmet` cites the gridMET methods paper (Abatzoglou
        2013). Missing: the package bibliography gives no DOI for it, and the citation is not in the
        result.'
      status: verified
    - type: documentation
      document: amadeus-references
      locator: article_abatzoglou2013development
      snippet: Development of gridded surface meteorological data for ecological applications and modelling
      match: partial
      explanation: 'The bibliography entry has title, journal, volume and pages. Missing: no DOI.'
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-pm-readme
      locator: Geomarker Methods
      snippet: >-
        A High Resolution Spatiotemporal Fine Particulate Matter Exposure Assessment Model for
        the Contiguous United States.
      match: partial
      explanation: >-
        The README of the `pm` container cites the methods paper of its model, with a link to
        the publisher. Missing: a link and not a DOI, and only in this container: the daymet
        README links the Daymet user guide and project page, no paper.
      status: verified
  not_supported_by:
  - source: chel
    reason: not_recorded
    explanation: >-
      No methods paper is cited for any of the source models. Closest: the pointer to the EJI
      technical documentation in §3.6, as a web link.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§3.6"
      snippet: for details on rank calculation
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: "No field for a methods paper. Closest: the `url` of the dataset."
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.url
      status: verified
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's doi field is the resource's own DOI, not a methods-paper DOI for the model
        that produced the values.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        A model methods-paper DOI is instance-layer derivation metadata the CDIF / DDI-CDI
        conceptual and represented layers do not carry.

