missing_data_handling_method:
  supported_by:
  - source: chel
    legacy:
      extent: partial
      status: asserted
      where: >-
        CHEL Documentation.md §4.3.1, §4.3.3 (conservation diagnostics; null taxonomy)
      note: >-
        CHEL §4.3 has conservation diagnostics and a null taxonomy (validation), but no per-value
        missing-data-handling method slot. Conservative: partial.
  not_supported_by:
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Gaia's meta_etl nodata registers the missing-value sentinel, not the source's missing-data
        handling method.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS records no missing-data-handling method.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus's THREDDS metadata declares a _FillValue sentinel but not the source's gap-filling
        method.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's null taxonomy classifies null cells but carries no source missing-data-handling
        method field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Missing-data handling method is instance-layer; out of scope for CODATA.

