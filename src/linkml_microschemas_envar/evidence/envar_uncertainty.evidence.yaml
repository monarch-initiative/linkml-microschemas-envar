      locator: Background
      snippet: Daymet data documentation
      status: verified
    status: unverified
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no whole-model cross-validation metrics.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: C-HER carries no model cross-validation summary field.
  - source: codata
    legacy:
