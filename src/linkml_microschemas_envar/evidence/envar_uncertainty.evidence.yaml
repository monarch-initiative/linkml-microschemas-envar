# Evidence for the slots of envar_uncertainty.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

per_value_uncertainty_type:
  not_supported_by:
  - source: chel
    legacy:
      extent: absent
      status: asserted
      where: >-
        CHEL Documentation.md §4.6.4 (source uncertainty acknowledged, none carried)
      note: >-
        CHEL §4.6.4 acknowledges source uncertainty but carries no per-value uncertainty on
        its indicators (only the EJI population margin of error `M_TOTPOP` passes through).
  - source: omop_gaia
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: No gaia output carries a per-value uncertainty type.
  - source: degauss
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: DeGAUSS emits no per-value uncertainty.
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: Amadeus emits no per-value uncertainty type.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's column_tag Meta value can hold uncertainty columns in principle, but no per-value
        uncertainty type is a modelled field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Per-value uncertainty is instance-layer; out of scope for CODATA.

