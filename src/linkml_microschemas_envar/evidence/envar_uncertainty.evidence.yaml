# Evidence for the slots of envar_uncertainty.yaml.
# Shape: evidence.schema.yaml (EvidenceFile). Design: specs/2026-11-25-slot-evidence-design.md
# `legacy` blocks are covered_by verdicts copied word for word; they are unverified until reviewed.

per_value_uncertainty_type:
  supported_by:
  - source: degauss
    support:
    - type: documentation
      document: degauss-pm-readme
      locator: Using
      snippet: standard error for predicted PM2.5
      match: partial
      explanation: >-
        The README of the `pm` container says what kind of uncertainty its column `pm_se` holds:
        a standard error. Missing: only in this container; the daymet container has no per-value
        uncertainty.
      status: verified
  not_supported_by:
  - source: amadeus
    reason: not_recorded
    explanation: 'The kind of uncertainty is not given. Closest: the MODIS AOD uncertainty layers, whose
      type is not stated.'
    closest:
    - type: schema
      document: amadeus-modis-vignette
      locator: MCD19A2 subdatasets
      source_slot: MCD19A2.AOD_Uncertainty_1
      status: verified
    status: unverified
  - source: chel
    reason: not_recorded
    explanation: >-
      No indicator has a described per-value uncertainty. Closest: §4.6.4 says the modeled
      inputs are uncertain. The tables pass on one margin of error column from EJI (`M_TOTPOP`)
      without describing it.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§4.6.4"
      snippet: >-
        Modeled environmental exposures (e.g., air pollution estimates) contain inherent
        uncertainty independent of spatial aggregation.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for the uncertainty of a value. Nothing close was found in the schema or the
      README.
    status: unverified
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's column_tag Meta value can hold uncertainty columns in principle, but no per-value
        uncertainty type is a modelled field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: Per-value uncertainty is instance-layer; out of scope for CODATA.

