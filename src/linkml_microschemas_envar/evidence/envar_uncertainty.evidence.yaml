missing_data_handling_method:
  supported_by:
  - source: chel
    support:
    - type: documentation
      document: chel-documentation
      locator: "§4.3.3"
      snippet: >-
        For percentile ranking, null values are excluded from ranking denominator N unless
        otherwise documented.
      match: partial
      explanation: >-
        CHEL says how missing values enter the percentile ranking. Missing: §4.3.3 says the
        propagation rules are defined but does not give them for the aggregation steps.
      status: verified
  - source: degauss
    support:
    - type: documentation
      document: degauss-daymet-entrypoint
      snippet: >-
        Removing any input file observations where the Daymet cell raster number is missing
      match: partial
      explanation: >-
        The code drops input rows whose coordinate is outside the Daymet grid. Missing: stated
        in a code comment only; the README does not say that rows can be dropped, and missing
        values inside the grid are not mentioned.
      status: verified
  - source: omop_gaia
    support:
    - type: documentation
      document: gaiadb-readme
      locator: Raster Sources
      snippet: nodata or outside the raster gives no row
      match: partial
      explanation: >-
        The README says what the join does with missing source values (no exposure row), and the
        nodata value of a variable is registered. Missing: how the source itself treated missing
        data is not passed on.
      status: verified
  not_supported_by:
  - source: amadeus
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        Amadeus's THREDDS metadata declares a _FillValue sentinel but not the source's gap-filling
        method.
  - source: cher
    legacy:
      extent: absent
      status: asserted
      where: no column
      note: >-
        C-HER's null taxonomy classifies null cells but carries no source missing-data-handling
        method field.
  - source: codata
    legacy:
      extent: out_of_layer
      status: asserted
      where: no column
      note: >-
        Missing-data handling method is instance-layer; out of scope for CODATA.

