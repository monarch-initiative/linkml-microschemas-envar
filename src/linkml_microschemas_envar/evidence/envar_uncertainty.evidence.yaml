      interpolation. Closest: §4.6.4.
    closest:
    - type: documentation
      document: chel-documentation
      locator: "§4.6.4"
      snippet: >-
        Modeled environmental exposures (e.g., air pollution estimates) contain inherent
        uncertainty independent of spatial aggregation.
      status: verified
    status: unverified
  - source: omop_gaia
    reason: not_recorded
    explanation: >-
      No field for summary statistics of a source model. Closest: the free-text `description` of
      the dataset.
    closest:
    - type: schema
      document: gaiadb-init-schema
      locator: backbone.data_source
      source_slot: data_source.description
      status: verified
    status: unverified
  - source: degauss
    reason: not_recorded
    explanation: >-
      No summary statistic of the Daymet model is passed on. Closest: the README's links to the
