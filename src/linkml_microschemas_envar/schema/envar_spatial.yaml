id: https://w3id.org/linkml/microschemas/envar/spatial
name: envar-spatial
title: EnVar Microschemas — Spatial Reference
version: "0.1.0"
description: |-
  Spatial reference slots: native grid, extraction footprint, CRS, geographic
  extent, extraction method, target geography. Covers §3 of
  envar-heat-scenario-requirements.md.
license: Apache-2.0

prefixes:
  envar: https://w3id.org/linkml/microschemas/envar/
  linkml: https://w3id.org/linkml/
  EPSG: https://epsg.io/
default_prefix: envar
default_range: string

imports:
- linkml:types
- envar_common

#────────────────────────────────────────────────────────────────
# CLASSES
#────────────────────────────────────────────────────────────────

classes:

  SpatialReference:
    title: Spatial Reference
    description: >-
      Spatial provenance of an environmental exposure value: the native grid /
      footprint of the source product, the CRS, the geographic extent, the
      extraction rule used to attach a value to a patient location, and the
      target geography type. One per record.
    see_also:
    - https://epsg.io/
    - https://en.wikipedia.org/wiki/Coordinate_reference_system
    annotations:
      domain_of_use: environmental_exposure
    slots:
    - native_geometry
    - native_spatial_resolution_descriptor
    - crs
    - spatial_extent_bbox
    - spatial_extent_descriptor
    - extraction_method
    - extraction_buffer_m
    - extraction_buffer_m_missing_reason
    - population_weighting_source
    - population_weighting_source_missing_reason
    - target_geography_type
    - spatial_aggregation_preserves
    slot_usage:
      crs:
        required: true
      extraction_method:
        required: true
      native_geometry:
        required: true
      target_geography_type:
        required: true

  Geometry:
    title: Source Geometry
    abstract: true
    description: >-
      Geometry a source product is delivered on. `geometry_kind` names one of
      the subclasses, and the subclass decides which further slots exist: a
      regular grid has a cell size in metres, an H3 grid has a resolution, and
      the other geometries have neither.
    annotations:
      domain_of_use: environmental_exposure
    slots:
    - geometry_kind

  RegularGrid:
    is_a: Geometry
    title: Regular Grid
    description: >-
      Evenly spaced grid, projected or lat/lon, with one nominal cell size.
    slots:
    - native_spatial_resolution_m
    slot_usage:
      native_spatial_resolution_m:
        required: true

  IrregularGrid:
    is_a: Geometry
    title: Irregular Grid
    description: >-
      Grid or mesh with no single cell size (satellite swath, curvilinear or
      unstructured model mesh).

  H3Grid:
    is_a: Geometry
    title: H3 Grid
    description: H3 hexagon grid at one resolution.
    see_also:
    - https://h3geo.org/
    slots:
    - h3_resolution
    slot_usage:
      h3_resolution:
        required: true

  VectorPolygon:
    is_a: Geometry
    title: Vector Polygon
    description: >-
      Polygons of varying size (census units, urban areas, service areas).

  VectorLine:
    is_a: Geometry
    title: Vector Line
    description: Line features (roads, rivers).

  VectorPoint:
    is_a: Geometry
    title: Vector Point
    description: Monitoring stations or other point features (facilities).

#────────────────────────────────────────────────────────────────
# SLOTS
#────────────────────────────────────────────────────────────────

slots:

  native_geometry:
    title: Native Geometry
    range: Geometry
    inlined: true
    description: >-
      Geometry the source product is delivered on, with the resolution slots
      that apply to it. Describes the source, not the place the value is
      attached to (that is `target_geography_type`).
    examples:
    - object:
        geometry_kind: RegularGrid
        native_spatial_resolution_m: 1000
      description: Daymet V4 1 km grid
    - object:
        geometry_kind: H3Grid
        h3_resolution: 3
      description: CHEL H3 resolution-3 hexagons
    - object:
        geometry_kind: VectorPolygon
      description: annual mean PM2.5 per urban-area polygon

    annotations:
      tier: core
      justification: >-
        Grids, hexagons, polygons and stations have different error behaviour
        and different notions of resolution. Without the geometry a missing
        resolution is ambiguous: it could be an omission, or the source could
        have no resolution at all.
      explanation: >-
        Environmental data comes in different shapes: square tiles, honeycomb
        cells, outlines such as city boundaries, lines such as roads, or single
        points such as monitoring stations. This block says which shape the
        source uses and, where it makes sense, how big the pieces are.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §2.2.1 (H3 Hex3 grid)"
              note: >-
                CHEL states the delivered geometry first-class: H3 Resolution-3
                hexagons.
          omop_gaia:
            annotations:
              extent: full
              status: asserted
              where: "gaia_db data_source.geom_type; meta_etl_*.json structure/geometry (raster)"
              note: >-
                GAIA records the source geometry first-class (geom_type, and
                structure/geometry in the etl metadata).
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS emits no source-geometry field.
          amadeus:
            annotations:
              extent: partial
              status: asserted
              where: "thredds_dataset.xml gridDataset/gridSet"
              note: >-
                Only implied by the THREDDS gridDataset/gridSet structure; never
                written as a geometry type in the output.
          cher:
            annotations:
              extent: partial
              status: asserted
              where: "table_name spatial-res code prefix (m/k/h/c/t/b/s/z)"
              note: >-
                The resolution code prefix separates grid (m/k), H3 (h) and
                polygon (tract/block/ZIP) layouts (§2.3); it has no line or
                point code.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                Source geometry of a specific product is instance-layer detail
                outside the conceptual EV/DDI-CDI layer.
  geometry_kind:
    title: Geometry Kind
    range: string
    designates_type: true
    required: true
    description: >-
      Name of the `Geometry` subclass: `RegularGrid`, `IrregularGrid`, `H3Grid`,
      `VectorPolygon`, `VectorLine` or `VectorPoint`.
    examples:
    - value: RegularGrid
      description: Daymet V4 1 km grid

    annotations:
      tier: core
      justification: >-
        The kind decides which resolution slots apply, so a consumer cannot read
        or check the rest of the geometry without it.
      explanation: >-
        The label that says which kind of shape this is, so you know which other
        fields to expect.
  h3_resolution:
    title: H3 Resolution
    range: integer
    minimum_value: 0
    maximum_value: 15
    description: >-
      H3 resolution of the hexagons, 0 (coarsest) to 15 (finest). Cell area and
      edge length follow from it through H3's own tables.
    examples:
    - value: "3"
      description: CHEL 2024
    see_also:
    - https://h3geo.org/docs/core-library/restable/

    annotations:
      tier: conditionally_core
      justification: >-
        H3 resolutions in use differ by orders of magnitude in cell area, so
        "H3" alone does not say how coarse a value is.
      explanation: >-
        Honeycomb maps come in 16 standard sizes. This number says which one:
        0 is continent-sized cells, 15 is about a square metre.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §2.2.1 (H3 Hex3 grid)"
              note: >-
                CHEL states the H3 resolution first-class (Resolution 3).
          cher:
            annotations:
              extent: full
              status: asserted
              where: "table_name spatial-res code (e.g. h08)"
              note: >-
                C-HER encodes the H3 resolution in the table_name code (§2.3).
  native_spatial_resolution_m:
    title: Native Spatial Resolution (m)
    range: float
    description: >-
      Native spatial resolution of the source product in metres. Daymet = 1000,
      GridMET ≈ 4000, NARR ≈ 32000. Exists on `RegularGrid` only, where it is
      mandatory; other geometries have no single cell size in metres.
    examples:
    - value: "1000"
      description: Daymet V4 1 km grid
    see_also:
    - https://daymet.ornl.gov/
    - https://www.climatologylab.org/gridmet.html
    - https://psl.noaa.gov/data/gridded/data.narr.html

    annotations:
      tier: conditionally_core
      justification: >-
        Exposure misclassification scales directly with cell size: a value from
        a 32 km NARR cell averages over an entire metro area while a 1 km Daymet
        cell resolves a neighbourhood. Without the resolution, downstream users
        cannot judge how precise a per-patient exposure really is or whether two
        studies' values are comparable.
      explanation: >-
        Gridded environmental data divides the world into square tiles, like
        pixels in a photo, and reports one value per tile. This field says how
        wide each tile is in metres — small tiles give a sharp picture of local
        conditions, big tiles give a blurry average over a large area.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: partial
              status: asserted
              where: "CHEL Documentation.md §1.3/§2.2.1 (H3 Hex3 ~12,000 km2)"
              note: >-
                CHEL fixes native resolution as an H3 level (Resolution 3) with
                an approximate cell area (~12,000 km2); it gives no resolution
                in metres.
          omop_gaia:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                gaiaCatalog has no first-class native-resolution slot; it appears only via the EnVar extension
                PropertyValue envar:native_spatial_resolution_m, not natively.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS emits no resolution field; "Daymet =
                1 km" is out-of-band knowledge, not written to any output.
          amadeus:
            annotations:
              extent: partial
              status: asserted
              where: "thredds_dataset.xml axis lat/lon increment (0.041666 deg)"
              note: >-
                Only derivable from the grid-axis increment in
                thredds_dataset.xml; never written as a
                resolution number in metres.
          cher:
            annotations:
              extent: full
              status: asserted
              where: "table_name spatial-res code (e.g. m30, k05, h08)"
              note: >-
                C-HER encodes native spatial resolution first-class in the
                table_name pattern (§2.3 metric/H3 codes) and as the inheritable
                spatial_resolution field.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                CODATA EVs / DDI-CDI operate at the conceptual/represented
                layer; native grid resolution of one run is instance-layer
                detail deliberately outside their scope.
  native_spatial_resolution_descriptor:
    title: Native Resolution Descriptor
    range: string
    description: >-
      Human-readable label for the native resolution, e.g. "1 km regular grid",
      "H3 hex zoom 8", "census tract polygon", "point station".
    examples:
    - value: "1 km regular grid"
      description: Daymet V4 native grid

    annotations:
      tier: recommended
      justification: >-
        The numeric resolution alone cannot distinguish a regular grid from hex
        cells, polygons, or point stations, and these layouts imply different
        extraction and error behaviour. Omitting the label leaves the geometry
        of the source data ambiguous even when the cell size is known.
      explanation: >-
        A short plain-English phrase saying what the map data actually looks
        like — evenly spaced square tiles, honeycomb-shaped cells, irregular
        neighbourhood outlines, or individual measuring stations dotted around.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §2.2.1 (H3 Hex3 descriptor)"
              note: >-
                The hex-grid resolution descriptor (H3 Hex3) is stated
                first-class.
          omop_gaia:
            annotations:
              extent: partial
              status: asserted
              where: "gaia_db data_source.geom_type; meta_etl_*.json structure/geometry (raster)"
              note: >-
                GAIA records geometry type (point/raster) but no human-readable
                resolution-layout descriptor; the resolution label itself is
                absent.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS writes no resolution descriptor of any kind.
          amadeus:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                No resolution-layout label is emitted; only a derivable axis
                increment exists.
          cher:
            annotations:
              extent: partial
              status: asserted
              where: "table_name spatial-res code prefix (m/k/h/c/t/b/s/z)"
              note: >-
                The spatial-resolution code prefix distinguishes grid (m/k),
                H3 (h), and polygon (tract/block/ZIP) layouts (§2.3), a coded
                rather than free-text descriptor.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                Resolution-layout description of a specific product is
                instance-layer detail outside the conceptual EV/DDI-CDI layer.
  crs:
    title: Coordinate Reference System (CRS)
    range: string
    description: >-
      Coordinate reference system as an EPSG identifier or PROJ string.
      Mandatory. E.g. `EPSG:4326` for Daymet, `EPSG:5072` for NARR Lambert
      Conformal Conic.
    examples:
    - value: "EPSG:4326"
      description: WGS 84, used by the Daymet and ACAG PM2.5 scenarios
    see_also:
    - https://epsg.io/
    - https://proj.org/

    annotations:
      tier: core
      justification: >-
        Without the CRS the grid cannot be placed on the Earth correctly: the
        same coordinate pair points to different physical locations under
        different reference systems, so a mismatched or missing CRS silently
        shifts every location and attaches exposure values to the wrong places.
      explanation: >-
        A coordinate reference system is the agreed way of turning numbers into
        places on the Earth — the same pair of coordinates means different
        spots under different systems. Naming the system (usually as a short
        EPSG code) tells software exactly which convention the numbers follow.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §4.2.1 (EPSG:5070); README.md (EPSG:4326 points)"
              note: >-
                CHEL fixes CRS first-class: every area-based overlay runs in
                equal-area EPSG:5070 (§4.2.1); the README linkage example builds
                participant points in EPSG:4326.
          omop_gaia:
            annotations:
              extent: full
              status: verified
              where: "gaia_db data_source.srid (4326); gaia_catalog meta_etl_*.json epsg/local_epsg; location.geom EPSG:4326"
              evidence: "EnVar/examples/heat/COMPARISON.md §C (CRS of source raster ✅)"
              note: >-
                GAIA carries the source-raster CRS first-class via
                data_source.srid, meta_etl epsg/local_epsg, and the enforced
                PostGIS geom SRID.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS leaves CRS implicit WGS84 with no column.
          amadeus:
            annotations:
              extent: full
              status: verified
              where: "thredds_dataset.xml coordinate_system = \"WGS84,EPSG:4326\""
              evidence: "EnVar/examples/heat/COMPARISON.md §C (CRS of source raster ✅)"
              note: >-
                Amadeus's THREDDS grid declares the raster CRS explicitly as an
                EPSG code.
          cher:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                C-HER's metadata model (table_dictionary / column dictionary)
                documents spatial extent/resolution codes but no per-resource
                CRS/EPSG field.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                CRS of a specific extract is an instance-layer representation
                detail; the conceptual EV/DDI-CDI layer does not carry it.
  spatial_extent_bbox:
    title: Product Bounding Box
    range: float
    multivalued: true
    description: >-
      Bounding box of the source *product* (not the extracted subset), as
      `[min_lon, min_lat, max_lon, max_lat]`.
    examples:
    - value: "[-131.104, 14.075, -52.95, 53.038]"
      description: >-
        Daymet V4 product bounding box (CONUS + Hawaii + Puerto Rico); one
        float per list element, ordered min_lon, min_lat, max_lon, max_lat
    see_also:
    - https://datatracker.ietf.org/doc/html/rfc7946#section-5

    annotations:
      tier: recommended
      justification: >-
        The product footprint distinguishes "no value here" (the location lies
        outside the product's coverage) from "missing value" (the product covers
        it but the value is absent). Without it, out-of-extent patients look
        like data gaps and can be silently misinterpreted.
      explanation: >-
        A bounding box is a rectangle drawn on the map that just barely
        contains all the data — four numbers giving its western, southern,
        eastern, and northern edges. Anything outside that rectangle was never
        covered by the dataset in the first place.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: partial
              status: asserted
              where: "CHEL Documentation.md §1.3, §2.7 (national US extent)"
              note: >-
                CHEL's extent is national US (national-scale design, §1.3; US
                Census TIGER inputs, §2.7), but no bounding box is given.
                Conservative: partial.
          omop_gaia:
            annotations:
              extent: full
              status: verified
              where: "gaia_db data_source.spatial_coverage; meta_dcat_*.json spatialCoverage; meta_etl_*.json extent (POLYGON WKT)"
              evidence: "EnVar/examples/heat/COMPARISON.md §G (source-dataset spatial coverage ✅)"
              note: >-
                GAIA records the product footprint as a WKT polygon extent and a
                DCAT spatialCoverage string.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS emits no product bounding box.
          amadeus:
            annotations:
              extent: full
              status: verified
              where: "thredds_dataset.xml projectionBox + LatLonBox (CONUS bbox)"
              evidence: "EnVar/examples/heat/COMPARISON.md §G (source-dataset spatial coverage ✅)"
              note: >-
                The THREDDS dataset.xml gives the product footprint as
                projectionBox and LatLonBox.
          cher:
            annotations:
              extent: partial
              status: asserted
              where: "table_name spatial-extent code (Gxx/Txx/Cxx/sxx/bxx/cdX)"
              note: >-
                C-HER encodes spatial extent as a coded region (§2.2), not a
                numeric min/max bounding box.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                A product's spatial bounding box is instance/discovery-layer
                detail outside the conceptual EV/DDI-CDI layer.
  spatial_extent_descriptor:
    title: Product Extent Description
    range: string
    description: >-
      Human-readable description of the product extent, e.g.
      "CONUS + Hawaii + Puerto Rico", "global land surface 60°S-80°N".
    examples:
    - value: "CONUS + Hawaii + Puerto Rico"
      description: Daymet V4 product extent

    annotations:
      tier: recommended
      justification: >-
        The numeric bounding box is precise but opaque; a human-readable extent
        lets reviewers and data users sanity-check coverage at a glance (e.g.
        spotting that Alaska is not included) without decoding coordinates.
      explanation: >-
        A plain-English description of where in the world the dataset has data
        — for example "the continental United States plus Hawaii and Puerto
        Rico" — so you can tell at a glance whether your study area is covered.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §1.3, §2.7 (national US extent)"
              note: >-
                The national-US spatial extent is stated for CHEL products.
          omop_gaia:
            annotations:
              extent: partial
              status: asserted
              where: "gaia_db data_source.spatial_coverage; meta_dcat_*.json spatialCoverage"
              note: >-
                GAIA's spatialCoverage string can act as a human-readable extent
                label, though it is not guaranteed to be a curated prose
                descriptor.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS emits no extent descriptor.
          amadeus:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                Amadeus carries a numeric bbox (projectionBox/LatLonBox) but no
                human-readable extent description.
          cher:
            annotations:
              extent: partial
              status: asserted
              where: "spatial-extent code prefix (Gxx=global, Txx=US+Terr, Cxx=CONUS, sxx=state)"
              note: >-
                The coded spatial-extent prefix conveys a controlled-vocabulary
                extent label (§2.2) rather than free-text prose.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                Human-readable extent of a specific product is
                instance/discovery-layer detail outside the conceptual layer.
  extraction_method:
    title: Extraction Method
    range: ExtractionMethodEnum
    description: >-
      How a gridded value was extracted at the patient's coordinates. Default
      for DeGAUSS daymet / narr is `inverse_distance_weighted_4_nearest_cells`.
    examples:
    - value: inverse_distance_weighted_4_nearest_cells
      description: DeGAUSS default for point extraction (Daymet Tmax scenario)
    - value: area_weighted_polygon_mean
      description: polygon aggregation (ACAG PM2.5 tract scenario)
    see_also:
    - https://degauss.org/

    annotations:
      tier: core
      justification: >-
        This is the single biggest lever in turning a grid into a per-person
        value: different extraction methods yield different exposure values at
        the very same point. If the method is unknown, exposure values are not
        reproducible and cannot be compared across studies or tool runs.
      explanation: >-
        A patient's home almost never sits exactly at the centre of a data
        tile, so a rule is needed to pick or blend nearby tile values into one
        number for that spot — take the closest tile, average the four nearest
        ones, and so on. This field records which rule was used.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md Part 3 (§3.2-3.5 aggregation operators)"
              note: >-
                CHEL carries the extraction/aggregation operator first-class:
                area-weighted interpolation (§3.2), population-weighted allocation
                (§3.3), density and intersection-proportion (§3.4), raster zonal
                sum (§3.5).
          omop_gaia:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                No extraction-method slot in gaiaCatalog or gaia-db; only the implicit st_within join semantics
                of working.spatial_join_exposure exist, undocumented.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS applies IDW-4-nearest by default but records no
                extraction-method field.
          amadeus:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                Amadeus emits no extraction-method field.
          cher:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                C-HER's data-level codes track processing stage, not the
                point-to-cell extraction rule; no extraction-method field.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                How a value was extracted from a grid is instance-layer
                provenance the conceptual EV/DDI-CDI layer deliberately omits.
  extraction_buffer_m:
    title: Extraction Buffer Radius (m)
    range: float
    description: >-
      Radius of any spatial buffer applied (e.g. greenspace at 500 / 1500 /
      2500 m). Null when no buffer is applied.
    examples:
    - value: "500"
      description: 500 m greenspace buffer; null in the Daymet Tmax scenario (no buffer)

    annotations:
      tier: conditionally_core
      tier_context: >-
        cross-module — Core iff linkage_method.linkage_strategy is
        buffer_aggregation_around_residence. Not expressible as a class rule
        (rules cannot reach across classes), so the checker evaluates it in
        RESIDUAL_CONTEXT_PREDICATES.
      justification: >-
        For buffer-based strategies the radius is a hyperparameter that changes
        the assigned exposure — greenspace within 500 m and within 2500 m of a
        home are different quantities. Omitting it makes buffer-derived values
        unreproducible and incomparable across analyses.
      explanation: >-
        Some exposures are summarised over a circle drawn around the patient's
        home rather than at the exact address — for example, how much green
        space lies within walking distance. This field gives the radius of that
        circle in metres; a bigger circle averages over more surroundings.
  extraction_buffer_m_missing_reason:
    title: Reason Buffer Radius Is Missing
    range: MissingReasonEnum
    description: Reason `extraction_buffer_m` is null.
    examples:
    - value: not_applicable
      description: no buffer is used for point extraction (Daymet Tmax scenario)

    annotations:
      tier: optional
      justification: >-
        An empty buffer field is ambiguous: it could mean no buffer was used or
        that the radius was simply not recorded. Stating the reason makes the
        absence deliberate and checkable, so validators and reviewers do not
        flag a legitimate point extraction as incomplete metadata.
      explanation: >-
        When the circle-radius field above is left empty, this field says why —
        most often because no circle was drawn at all and the value was taken
        straight at the address. It turns a silent blank into an explicit,
        trustworthy statement.
  population_weighting_source:
    title: Population Weighting Source
    range: string
    description: >-
      Census vintage used for population weighting (e.g. the Spangler et al.
      WBGT product is population-weighted from gridMET). Null when no weighting
      is applied.
    examples:
    - value: "GPW v4 (2020)"
      description: Gridded Population of the World v4, used in the ACAG PM2.5 scenario
    see_also:
    - https://www.census.gov/programs-surveys/geography/guidance/geo-areas.html
    - https://www.climatologylab.org/gridmet.html

    annotations:
      tier: conditionally_core
      tier_context: >-
        cross-module — Core iff spatial_reference.extraction_method is
        population_weighted_mean OR linkage_method.linkage_strategy is
        population_weighted_area_to_residence. The disjunction spans two
        classes, so it is not expressible as a class rule; the checker
        evaluates it in RESIDUAL_CONTEXT_PREDICATES.
      justification: >-
        Population-weighted values depend on which population dataset and
        census vintage supplied the weights; the same grid weighted by 2010
        versus 2020 populations gives different exposures. Without the source,
        a weighted value cannot be reproduced or compared with other weighted
        products.
      explanation: >-
        Some datasets average their tiles by giving more weight to places where
        more people live, so the number reflects what a typical resident
        experiences rather than a plain average over land. This field names
        the population map (and its year) that was used for that weighting.
  population_weighting_source_missing_reason:
    title: Reason Population Weighting Is Missing
    range: MissingReasonEnum
    description: Reason `population_weighting_source` is null.
    examples:
    - value: not_applicable
      description: no population weighting applied (Daymet Tmax scenario)

    annotations:
      tier: optional
      justification: >-
        A blank weighting source is ambiguous between "no weighting was
        applied" and "the source was not recorded". Recording the reason keeps
        unweighted products from looking like incompletely documented weighted
        ones and lets automated checks pass legitimately null records.
      explanation: >-
        When the population-weighting field above is empty, this field explains
        why — usually because the dataset is a plain average with no
        population weighting at all. It makes the emptiness intentional rather
        than an oversight.
  target_geography_type:
    title: Target Geography Type
    range: TargetGeographyTypeEnum
    description: >-
      Geographic unit the exposure value is attached to.
    examples:
    - value: point_residence
      description: patient's exact residence coordinates (Daymet Tmax scenario)
    - value: census_tract
      description: tract-level aggregate (ACAG PM2.5 scenario)
    see_also:
    - https://www.census.gov/programs-surveys/geography/guidance/geo-areas.html
    annotations:
      tier: core
      justification: >-
        An exposure pinned to an exact residence and one averaged over a whole
        county are fundamentally different quantities with different privacy
        and misclassification profiles. Without the target geography, users
        cannot tell how localised the value is or link it correctly to health
        records held at a given geographic level.
      explanation: >-
        This says what kind of place the value belongs to: one specific home
        address, a neighbourhood-sized census area, a ZIP-code area, a whole
        county, and so on. The bigger the unit, the more the number is a shared
        average rather than a personal measurement.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §2.2.1 (H3 hex target)"
              note: >-
                CHEL's target geography is first-class: every value is attached to
                an H3 Hex3 cell.
          omop_gaia:
            annotations:
              extent: partial
              status: asserted
              where: "gaia_db data_source.geom_type (point); location.geom"
              note: >-
                GAIA records the geometry type (point) but not the full
                EnVar target-geography vocabulary (tract/ZCTA/county); values
                land on the person's point location.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS attaches values to the geocoded point residence but has
                no explicit target-geography-type field.
          amadeus:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                Amadeus collapses to lat/lon at the THREDDS request with no
                geography-type field.
          cher:
            annotations:
              extent: full
              status: asserted
              where: "spatial-res code (c/t/b/z/h) + column_tag Spatial – Primary"
              note: >-
                C-HER's spatial-resolution code names the geographic unit
                (county/tract/block group/ZCTA/H3) and column_tag flags the
                spatial-primary column (§2.3, §6.1).
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                The target geographic unit of a specific value is instance-layer
                detail outside the conceptual EV/DDI-CDI layer.
  spatial_aggregation_preserves:
    title: Spatial Aggregation Preserved Quantity
    range: SpatialAggregationPreservationEnum
    description: >-
      What quantity the spatial-aggregation operator is meant to *preserve* when
      a value on a source spatial support is re-expressed on the target support
      — not the mechanics of the operator (that is `extraction_method`), but the
      invariant it holds fixed (mean intensity, total mass, occurrence density,
      or areal coverage). Adopted from CHEL's §3.10 "aggregation must match
      meaning" preservation table.
    examples:
    - value: mean_intensity
      description: >-
        area-weighted interpolation of a modeled concentration preserves the
        area-mean intensity (CHEL tract-to-hex concentration case)
    - value: total_mass_conservation
      description: >-
        population-weighted / area-proportional allocation of a count preserves
        the total (CHEL population-count case)

    annotations:
      tier: recommended
      # CLAD-tiering-signal: CLAD would argue core. Its §3.10 principle
      # "aggregation must match meaning" makes the preserved quantity the central
      # design invariant; without it, an area-weighted mean and a mass-conserving
      # allocation of the same input are indistinguishable and non-comparable.
      justification: >-
        Recording *what quantity the operator preserves* — not just the
        operator name — is what makes two datasets' spatial values comparable
        and poolable: an area-weighted mean and a mass-conserving allocation
        applied to the same input give different numbers, and only the
        preserved-quantity tag tells a downstream analyst which one a value is,
        so two supports can be reconciled rather than silently mixed.
      explanation: >-
        Turning map data measured on one set of shapes into values on another
        set of shapes can aim to keep different things unchanged — the average
        level of something, the total amount of it, how densely it occurs, or
        how much of an area it covers. This records which of those the
        conversion was designed to keep true, because the same input handled
        two different ways produces two different numbers.
      covered_by:
        annotations:
          clad:
            annotations:
              extent: full
              status: asserted
              where: "CHEL Documentation.md §3.10 (geometry-weighted operator; preserved-quantity table)"
              note: >-
                CHEL §3.10 enumerates exactly this preserved-quantity
                vocabulary (mean intensity / mass conservation / occurrence
                intensity / areal coverage) and selects the operator from it.
          omop_gaia:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                No preserved-quantity slot in gaiaCatalog or gaia-db; the
                invariant an aggregation holds fixed is not recorded.
          degauss:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                DeGAUSS does point extraction only and records no
                aggregation-preservation semantics.
          amadeus:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                Amadeus records no preserved-quantity of any spatial
                aggregation.
          cher:
            annotations:
              extent: absent
              status: asserted
              where: "no column"
              note: >-
                C-HER captures resolution and data-level but not which quantity
                a re-gridding operator preserves.
          codata:
            annotations:
              extent: out_of_layer
              status: asserted
              where: "no column"
              note: >-
                The preserved quantity of an aggregation is instance-layer
                methodological detail outside the conceptual EV/DDI-CDI layer.

#────────────────────────────────────────────────────────────────
# ENUMS
#────────────────────────────────────────────────────────────────

enums:

  ExtractionMethodEnum:
    title: Extraction Method
    description: >-
      How a gridded value was extracted at a target location.
    permissible_values:
      nearest_cell:
        description: Take the value from the single nearest grid cell.
      bilinear:
        description: Bilinear interpolation of the four nearest cells.
      inverse_distance_weighted_4_nearest_cells:
        description: >-
          Inverse-distance-weighted average of the 4 nearest cells. Default for
          DeGAUSS `daymet` and `narr`.
      area_weighted_polygon_mean:
        description: Area-weighted mean of cells overlapping a polygon.
      population_weighted_mean:
        description: >-
          Population-weighted mean over a target geography (e.g. tract).
      point_station_lookup:
        description: Direct lookup at a point station observation.
      intersection_area_proportion:
        description: >-
          Value = fraction of the target cell covered by the source feature
          (source∩target area ÷ target area). CHEL areal-coverage operator
          (e.g. impaired waters).
      raster_zonal_sum:
        description: >-
          Sum of source raster cell values falling within each target zone.
          CHEL raster zonal-sum operator (e.g. population raster over a hex).
      feature_density:
        description: >-
          Count (or line-length) of source features per unit target area. CHEL
          occurrence-intensity operator (e.g. facilities, roads).

  SpatialAggregationPreservationEnum:
    title: Spatial Aggregation Preserved Quantity
    description: >-
      The quantity a spatial-aggregation operator holds invariant when a value
      is re-expressed from a source spatial support onto a target support.
      Adopted from CHEL Documentation.md §3.10 ("aggregation as a geometry-weighted
      operator; aggregation must match meaning"), which keys the operator on
      *what is preserved* rather than on the mechanics of the operator.
    see_also:
    - https://github.com/cladteam/CHEL/blob/main/Documentation.md
    permissible_values:
      mean_intensity:
        description: >-
          Preserves the area-mean intensity of the quantity (area-weighted
          interpolation). For intensive quantities that do not sum over area —
          e.g. modeled concentration, prevalence.
      total_mass_conservation:
        description: >-
          Preserves the total amount (area-proportional or population-weighted
          allocation), so the sum over the target matches the sum over the
          source. For extensive quantities — e.g. population counts.
      occurrence_intensity:
        description: >-
          Preserves occurrence density — count or line-length per unit area.
          For discrete features — e.g. facilities, roads.
      areal_coverage:
        description: >-
          Preserves fractional areal coverage — the proportion of the target
          cell intersected by the source feature. For coverage quantities —
          e.g. impaired waters.

  TargetGeographyTypeEnum:
    title: Target Geography Type
    description: >-
      Geographic unit the exposure is attached to.
    see_also:
    - https://www.census.gov/programs-surveys/geography/guidance/geo-areas.html
    - https://h3geo.org/
    permissible_values:
      point_residence:
        description: Attached to the patient's exact lat / lon.
      census_block_group:
        description: US Census Block Group.
      census_tract:
        description: US Census Tract.
      zcta:
        description: ZIP Code Tabulation Area.
      county:
        description: US County (FIPS).
      h3_hex:
        description: H3 hexagon at some resolution. Resolution captured separately.
      public_water_system:
        description: Public water system service area polygon.
