---
name: Attach packages to release
# Generates the Python datamodel (not tracked in git), builds the packages with
# it and attaches them to the GitHub release.
on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0  # the version comes from the git tags
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --group dev

      - name: Run test suite (generates the datamodel)
        run: just test

      - name: Build packages
        run: uv build

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
